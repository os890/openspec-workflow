// ------------------------------------------------------------ charts: how the work flows over time
// Data: /api/timeline merges git (every commit touching openspec/changes or openspec/backlog) with the history this
// dashboard records while it runs; per change and status, and per task, the earliest time wins. Colours: a chart
// palette of its own (--cf-*), checked for colour-vision deficiency in light and dark; every chart also has direct
// labels, a legend or a data table, so no value depends on colour alone.
const CF = [ // stacking order, bottom to top
  ['archived', 'Archived', '--cf-archived'],
  ['complete', 'Tasks done', '--cf-complete'],
  ['in-progress', 'In progress', '--cf-progress'],
  ['specified', 'Specified', '--cf-specified'],
  ['proposed', 'Draft', '--cf-draft'],
];
const CF_LABEL = Object.fromEntries(CF.map(([k, l]) => [k, l]));
const CF_VAR = Object.fromEntries(CF.map(([k, , v]) => [k, `var(${v})`]));
const RANK = { proposed: 0, specified: 1, 'in-progress': 2, complete: 3, archived: 4 };
const tl = { data: null, at: 0, rev: -1, loading: false, project: null, error: null };
const chartGeo = new Map();

async function loadTimeline() {
  if (tl.loading) return;
  const s = ui.state;
  if (tl.data && tl.project === PROJECT && tl.rev === s?.rev && Date.now() - tl.at < 60000) return;
  tl.loading = true;
  try {
    const r = await fetch(withProject('/api/timeline'));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    tl.data = await r.json();
    tl.error = null;
  } catch (e) { tl.error = e.message; }
  tl.at = Date.now(); tl.rev = s?.rev; tl.project = PROJECT; tl.loading = false;
  if (ui.boardView === 'charts' && ui.state) renderBoard(ui.state);
}

const dur = (ms) => {
  if (ms == null || !isFinite(ms)) return '—';
  const m = ms / 60000;
  if (m < 1) return '< 1 min';
  if (m < 90) return `${Math.round(m)} min`;
  const h = m / 60;
  if (h < 48) return `${h < 10 ? h.toFixed(1).replace(/\.0$/, '') : Math.round(h)} h`;
  return `${(h / 24).toFixed(h < 240 ? 1 : 0).replace(/\.0$/, '')} d`;
};
const median = (xs) => { const a = xs.filter((x) => x != null && isFinite(x)).sort((p, q) => p - q); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
const dayFmt = (t) => new Date(t).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
const whenFmt = (t) => `${new Date(t).toLocaleDateString([], { day: 'numeric', month: 'short' })} ${hhmm(t)}`;
const tipAttr = (lines) => `data-tip="${esc([].concat(lines).join('\n'))}"`;

// Readable ticks for a time axis: local hours/minutes for spans under two days, dates beyond.
function timeTicks(t0, t1, maxTicks) {
  const M = 60000, H = 60 * M, D = 24 * H;
  const steps = [5 * M, 10 * M, 15 * M, 30 * M, H, 2 * H, 3 * H, 6 * H, 12 * H, D, 2 * D, 7 * D, 14 * D, 30 * D, 91 * D];
  const step = steps.find((x) => (t1 - t0) / x <= maxTicks) ?? steps.at(-1);
  const off = new Date(t0).getTimezoneOffset() * M;
  const out = [];
  for (let t = Math.ceil((t0 - off) / step) * step + off; t <= t1; t += step) {
    const d = new Date(t);
    const midnight = d.getHours() === 0 && d.getMinutes() === 0;
    out.push({ t, label: step >= D || (midnight && step >= H) ? d.toLocaleDateString([], { day: 'numeric', month: 'short' }) : hhmm(t) });
  }
  return out;
}

// Per change: first time it reached each status (merged, monotonic), from the timeline plus the current files.
function changeTimes(s) {
  const by = new Map();
  for (const x of tl.data?.transitions ?? []) (by.get(x.change) ?? by.set(x.change, {}).get(x.change))[x.to] ??= x.t;
  for (const c of s.changes) {
    const m = by.get(c.name) ?? by.set(c.name, {}).get(c.name);
    if (c.status in RANK && m[c.status] == null) m[c.status] = c.lastModified ?? Date.now();
  }
  return by;
}
// Status of a change at time t: the furthest status reached by then.
function statusAt(times, t) {
  let best = null;
  for (const k in times) if (times[k] <= t && (best == null || RANK[k] > RANK[best])) best = k;
  return best;
}

function chartsHtml(s, shown) {
  if (!tl.data && !tl.error) return '<div class="charts"><div class="empty" style="padding:24px">Loading the timeline…</div></div>';
  const card = (id, title, sub, wide) => `<section class="ch-card ${wide ? 'wide' : ''}" aria-labelledby="ch-${id}-t">
      <div class="ch-head"><h3 id="ch-${id}-t">${title}</h3><span class="ch-sub" id="ch-${id}-sub">${sub}</span></div>
      <div class="ch-plot" data-chart="${id}" data-keep-children></div>
    </section>`;
  return `<div class="charts" data-col="charts">
    ${tl.error ? `<div class="bl-note warn">✕ Timeline not available: ${esc(tl.error)}</div>` : ''}
    ${card('cfd', 'Cumulative flow', 'Changes per status over time. A widening band is work piling up there.', true)}
    ${card('burn', 'Milestone burn-up', '', false)}
    ${card('aging', 'Work in progress: age', 'How long each open change has been in its status, against the typical time.', false)}
    ${card('gantt', 'Cycle time per change', 'Each change from specified to archived, split into its phases.', true)}
    ${card('deps', 'Dependencies and critical path', 'The roadmap as a graph. The highlighted chain is the longest one still open.', true)}
    ${card('heat', 'When tasks get checked off', 'Check-offs per hour of the day.', true)}
  </div>`;
}

function drawCharts(s) {
  if (!s || ui.boardView !== 'charts') return;
  const shownNames = new Set(chartShown(s).map((c) => c.name));
  const times = changeTimes(s);
  for (const el of document.querySelectorAll('.ch-plot[data-chart]')) {
    const W = Math.max(280, Math.floor(el.clientWidth));
    const id = el.dataset.chart;
    try {
      morphHtml(el, { cfd: cfdChart, burn: burnChart, aging: agingChart, gantt: ganttChart, heat: heatChart, deps: depsChart }[id](s, shownNames, times, W));
    } catch (e) { el.innerHTML = `<div class="empty">✕ ${esc(e.message)}</div>`; console.error(e); }
  }
}
const chartShown = (s) => s.changes.filter((c) => isTicket(c) && c.status !== 'missing' && (!ui.ms || c.milestone === ui.ms));

// Shared axis frame for time charts.
function timeFrame(W, H, t0, t1, maxY, { L = 34, R = 16, T = 10, B = 24 } = {}) {
  const x = (t) => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - v / Math.max(1, maxY)) * (H - T - B);
  const yStep = maxY <= 6 ? 1 : maxY <= 12 ? 2 : maxY <= 30 ? 5 : maxY <= 60 ? 10 : Math.ceil(maxY / 50) * 10;
  let grid = '';
  for (let v = 0; v <= maxY; v += yStep) grid += `<line class="ch-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  for (const k of timeTicks(t0, t1, Math.max(2, Math.floor((W - L - R) / 80)))) grid += `<text class="ch-ax" x="${x(k.t)}" y="${H - 6}" text-anchor="middle">${k.label}</text>`;
  return { x, y, grid, L, R, T, B };
}

// ---- cumulative flow
function cfdChart(s, shownNames, times, W) {
  const BANDS = ui.boardFocus ? CF.filter(([k]) => k !== 'archived') : CF; // focus: open work only
  const names = [...shownNames].filter((n) => times.get(n) && Object.keys(times.get(n)).length);
  const ts = [...new Set(names.flatMap((n) => Object.values(times.get(n))))].sort((a, b) => a - b);
  const now = Date.now();
  if (ts.length < 2) return '<div class="empty">Not enough history yet: the flow appears after the first status changes (from git or while the dashboard runs).</div>';
  const t0 = ts[0], t1 = now;
  const pts = [...ts.filter((t) => t <= now), now].map((t) => {
    const n = Object.fromEntries(BANDS.map(([k]) => [k, 0]));
    for (const name of names) { const st = statusAt(times.get(name), t); if (st && st in n) n[st]++; }
    return { t, n };
  });
  const maxY = Math.max(...pts.map((p) => BANDS.reduce((a, [k]) => a + p.n[k], 0)));
  const H = 240;
  const f = timeFrame(W, H, t0, t1, maxY, { R: 104 });
  let bands = '', gaps = '', labels = '';
  const cum = pts.map(() => 0);
  const lastY = [];
  for (const [k, label, v] of BANDS) {
    const lo = cum.slice();
    pts.forEach((p, i) => { cum[i] += p.n[k]; });
    if (!pts.some((p) => p.n[k])) continue;
    // step area: hold each value until the next change
    let top = '', bottom = '';
    pts.forEach((p, i) => { const nx = i + 1 < pts.length ? f.x(pts[i + 1].t) : f.x(t1); top += `${i ? 'L' : 'M'}${f.x(p.t)},${f.y(cum[i])}L${nx},${f.y(cum[i])}`; });
    for (let i = pts.length - 1; i >= 0; i--) { const nx = i + 1 < pts.length ? f.x(pts[i + 1].t) : f.x(t1); bottom += `L${nx},${f.y(lo[i])}L${f.x(pts[i].t)},${f.y(lo[i])}`; }
    bands += `<path d="${top}${bottom}Z" fill="${CF_VAR[k]}" fill-opacity=".88"/>`;
    gaps += `<path d="${top}" fill="none" stroke="var(--surface)" stroke-width="2"/>`;
    const yMid = (f.y(cum.at(-1)) + f.y(lo.at(-1))) / 2, hgt = f.y(lo.at(-1)) - f.y(cum.at(-1));
    if (hgt >= 3) lastY.push({ k, label, y: yMid, n: pts.at(-1).n[k] });
  }
  // direct labels at the right end, nudged apart so they never overlap
  lastY.sort((a, b) => a.y - b.y);
  for (let i = 1; i < lastY.length; i++) if (lastY[i].y - lastY[i - 1].y < 15) lastY[i].y = lastY[i - 1].y + 15;
  for (const l of lastY) labels += `<rect x="${W - f.R + 8}" y="${l.y - 5}" width="8" height="8" rx="2" fill="${CF_VAR[l.k]}"/><text class="ch-lbl" x="${W - f.R + 20}" y="${l.y + 3.5}">${l.label} <tspan class="ch-num">${l.n}</tspan></text>`;
  chartGeo.set('cfd', { x: f.x, t0, t1, rows: pts.map((p) => ({ t: p.t, lines: [whenFmt(p.t), ...BANDS.slice().reverse().filter(([k]) => p.n[k]).map(([k, l]) => `${l}: ${p.n[k]}`)] })) });
  const legend = `<div class="ch-legend">${BANDS.slice().reverse().map(([k, l]) => `<span><i style="background:${CF_VAR[k]}"></i>${l}</span>`).join('')}</div>`;
  const table = `<details class="ch-data"><summary>Data</summary><table><thead><tr><th>Time</th>${BANDS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>${pts.slice(-40).reverse().map((p) => `<tr><td>${whenFmt(p.t)}</td>${BANDS.map(([k]) => `<td>${p.n[k]}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
  return `${legend}<svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative flow: ${lastY.map((l) => `${l.label} ${l.n}`).join(', ')}">
    ${f.grid}${bands}${gaps}${labels}
    <line class="ch-cross" x1="0" x2="0" y1="${f.T}" y2="${H - f.B}" visibility="hidden"/>
    <rect class="ch-hit" data-xhover="cfd" x="${f.L}" y="0" width="${W - f.L - f.R}" height="${H - f.B}"/>
  </svg>${table}`;
}

// ---- milestone burn-up with a forecast from the recent pace
function burnChart(s, shownNames, times, W) {
  const cur = currentChange(s);
  const ms = ui.ms || cur?.milestone || '';
  const m = s.milestones.find((x) => x.id === ms);
  const scope = s.changes.filter((c) => isTicket(c) && c.status !== 'missing' && (!ms || c.milestone === ms));
  const sub = $('ch-burn-sub');
  if (sub) sub.textContent = ms ? `${ms} "${m?.title ?? ''}": changes done against the changes planned${ui.ms ? '' : ' (the current milestone; pick another above)'}.` : 'All changes: done against planned.';
  const born = (c) => { const t = times.get(c.name); return t ? Math.min(...Object.values(t)) : null; };
  const doneAt = (c) => { const t = times.get(c.name) ?? {}; const xs = [t.complete, t.archived].filter((v) => v != null); return xs.length ? Math.min(...xs) : null; };
  const evs = scope.map((c) => ({ c, born: born(c), done: doneAt(c) })).filter((e) => e.born != null);
  if (!evs.length) return '<div class="empty">No changes in this milestone yet.</div>';
  const now = Date.now();
  const t0 = Math.min(...evs.map((e) => e.born));
  const ts = [...new Set([t0, ...evs.map((e) => e.born), ...evs.map((e) => e.done).filter((v) => v != null), now])].filter((t) => t <= now).sort((a, b) => a - b);
  const pts = ts.map((t) => ({ t, scope: evs.filter((e) => e.born <= t).length, done: evs.filter((e) => e.done != null && e.done <= t).length }));
  const last = pts.at(-1);
  const doneTimes = evs.map((e) => e.done).filter((v) => v != null).sort((a, b) => a - b);
  const recent = doneTimes.slice(-6);
  const remaining = last.scope - last.done;
  let eta = null, pace = null;
  if (remaining > 0 && recent.length >= 2 && recent.at(-1) > recent[0]) {
    pace = (recent.at(-1) - recent[0]) / (recent.length - 1); // ms per change
    eta = now + remaining * pace;
  }
  const span = now - t0;
  const showEta = eta && eta - now <= Math.max(span, 3600e3) * 1.5;
  const t1 = showEta ? eta : now;
  const H = 210;
  const f = timeFrame(W, H, t0, t1, Math.max(1, ...pts.map((p) => p.scope)), { R: 40 });
  const step = (k) => pts.reduce((d, p, i) => d + (i ? `H${f.x(p.t)}V${f.y(p[k])}` : `M${f.x(p.t)},${f.y(p[k])}`), '') + `H${f.x(now)}`;
  chartGeo.set('burn', { x: f.x, t0, t1: now, rows: pts.map((p) => ({ t: p.t, lines: [whenFmt(p.t), `Done: ${p.done}`, `Planned: ${p.scope}`] })) });
  const note = remaining === 0 ? `All ${last.scope} done.`
    : pace ? `${last.done} of ${last.scope} done. At the recent pace (one change every ${dur(pace)}) the remaining ${remaining} take about ${dur(remaining * pace)}: ${whenFmt(eta)}.`
    : `${last.done} of ${last.scope} done. A forecast needs at least two finished changes.`;
  return `<div class="ch-legend"><span><i style="background:var(--cf-complete)"></i>Done</span><span><i class="line"></i>Planned</span>${showEta ? '<span><i class="dash"></i>Forecast</span>' : ''}</div>
  <svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(note)}">
    ${f.grid}
    <path d="${step('scope')}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
    <path d="${step('done')}V${f.y(0)}H${f.x(t0)}Z" fill="var(--cf-complete)" fill-opacity=".12"/>
    <path d="${step('done')}" fill="none" stroke="var(--cf-complete)" stroke-width="2" stroke-linejoin="round"/>
    ${showEta ? `<path d="M${f.x(now)},${f.y(last.done)}L${f.x(eta)},${f.y(last.scope)}" fill="none" stroke="var(--cf-complete)" stroke-width="2" stroke-dasharray="5 4"/>
      <circle cx="${f.x(eta)}" cy="${f.y(last.scope)}" r="4" fill="var(--surface)" stroke="var(--cf-complete)" stroke-width="2" ${tipAttr(['Forecast', whenFmt(eta)])}/>` : ''}
    <circle cx="${f.x(now)}" cy="${f.y(last.done)}" r="4.5" fill="var(--cf-complete)" stroke="var(--surface)" stroke-width="2"/>
    <text class="ch-lbl" x="${f.x(now) + 8}" y="${f.y(last.done) + 4}">${last.done}</text>
    <text class="ch-lbl muted" x="${f.x(now) + 8}" y="${f.y(last.scope) - 4}">${last.scope}</text>
    <line class="ch-cross" x1="0" x2="0" y1="${f.T}" y2="${H - f.B}" visibility="hidden"/>
    <rect class="ch-hit" data-xhover="burn" x="${f.L}" y="0" width="${f.x(now) - f.L}" height="${H - f.B}"/>
  </svg>
  <p class="ch-note">${esc(note)} The pace counts changes, not tasks: tasks only exist once a change is specified.</p>`;
}

// Phases of each change: specified → in progress → tasks done → archived.
const PHASES = [['specified', 'in-progress'], ['in-progress', 'complete'], ['complete', 'archived']];
function phasesOf(t, now) {
  return PHASES.map(([from, to]) => {
    if (t[from] == null) return null;
    const end = t[to] ?? (Object.entries(t).some(([k, v]) => RANK[k] > RANK[from] && v != null) ? Math.min(...Object.entries(t).filter(([k]) => RANK[k] > RANK[from]).map(([, v]) => v)) : null);
    return { k: from, start: t[from], end: end ?? now, open: end == null };
  }).filter(Boolean);
}

// ---- cycle time per change (a Gantt of the phases)
function ganttChart(s, shownNames, times, W) {
  const now = Date.now();
  const scopeBy = new Map();
  for (const x of tl.data?.scope ?? []) scopeBy.set(x.change, (scopeBy.get(x.change) ?? 0) + x.added);
  const all = [...shownNames].map((n) => ({ n, c: s.changes.find((x) => x.name === n), t: times.get(n) ?? {} }))
    .filter((r) => r.t.specified != null || r.t['in-progress'] != null || r.t.complete != null || r.t.archived != null)
    .map((r) => ({ ...r, ph: phasesOf(r.t, now), start: Math.min(...['specified', 'in-progress', 'complete', 'archived'].map((k) => r.t[k]).filter((v) => v != null)) }))
    .sort((a, b) => a.start - b.start);
  const finished = all.filter((r) => r.t.specified != null && (r.t.archived ?? r.t.complete) != null)
    .map((r) => ({ total: (r.t.archived ?? r.t.complete) - r.t.specified, ph: r.ph }));
  const rows = all.filter((r) => !(ui.boardFocus && r.c?.status === 'archived')).slice(-30);
  if (!rows.length) return `<div class="empty">${all.length ? 'Every change here is archived (focus mode hides them).' : 'No change has been specified yet.'}</div>`;
  const t0 = Math.min(...rows.map((r) => r.start)), t1 = now;
  const LBL = Math.min(230, Math.max(150, W * 0.28)), RT = 120, rowH = 24, T = 6;
  const H = T + rows.length * rowH + 26;
  const x = (t) => LBL + ((t - t0) / Math.max(1, t1 - t0)) * (W - LBL - RT);
  let g = '';
  for (const k of timeTicks(t0, t1, Math.max(2, Math.floor((W - LBL - RT) / 80)))) g += `<line class="ch-grid" x1="${x(k.t)}" x2="${x(k.t)}" y1="${T}" y2="${H - 22}"/><text class="ch-ax" x="${x(k.t)}" y="${H - 6}" text-anchor="middle">${k.label}</text>`;
  rows.forEach((r, i) => {
    const y = T + i * rowH + 6, h = 12;
    const lab = `#${r.c?.inRoadmap ? r.c.order : '–'} ${title(r.n)}`;
    g += `<text class="ch-lbl ch-row" x="${LBL - 10}" y="${y + 10}" text-anchor="end" data-pick="${esc(r.n)}">${esc(lab.length > 34 ? lab.slice(0, 33) + '…' : lab)}<title>${esc(r.n)}</title></text>`;
    let any = false;
    for (const p of r.ph) {
      const x0 = x(p.start), x1 = Math.max(x(p.end), x0 + 2);
      const w = Math.max(2, x1 - x0 - (p.open ? 0 : 2)); // 2px surface gap between phases
      g += `<rect x="${x0}" y="${y}" width="${w}" height="${h}" rx="${Math.min(4, w / 2)}" fill="${CF_VAR[p.k]}" ${p.open ? 'fill-opacity=".55"' : ''} ${tipAttr([r.n, `${CF_LABEL[p.k]}${p.open ? ' (still)' : ''}`, `${whenFmt(p.start)} → ${p.open ? 'now' : whenFmt(p.end)}`, dur(p.end - p.start)])}/>`;
      any = true;
    }
    if (r.t.archived != null) g += `<circle cx="${x(r.t.archived)}" cy="${y + h / 2}" r="4" fill="${CF_VAR.archived}" stroke="var(--surface)" stroke-width="2" ${tipAttr([r.n, `Archived ${whenFmt(r.t.archived)}`, ...(any ? [] : ['earlier phases not recorded (one commit)'])])}/>`;
    const st = r.t.specified ?? r.start;
    const end = r.t.archived ?? r.t.complete;
    const total = end != null ? end - st : now - st;
    const extra = scopeBy.get(r.n);
    g += `<text class="ch-lbl" x="${W - RT + 10}" y="${y + 10}">${r.t.specified == null ? '<tspan class="muted">—</tspan>' : `${end == null ? '<tspan class="muted">open </tspan>' : ''}${dur(total)}`}${extra ? ` <tspan class="ch-warn">+${extra} task${extra > 1 ? 's' : ''}</tspan>` : ''}</text>`;
  });
  g += `<line class="ch-now" x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H - 22}"/>`;
  const med = median(finished.map((f) => f.total));
  const medPh = Object.fromEntries(PHASES.map(([k]) => [k, median(finished.flatMap((f) => f.ph.filter((p) => p.k === k && !p.open).map((p) => p.end - p.start)))]));
  const sub = $('ch-gantt-sub');
  if (sub && med != null) sub.textContent = `From specified to done. Median ${dur(med)} over ${finished.length} change${finished.length > 1 ? 's' : ''}: specifying ${dur(medPh.specified)}, implementing ${dur(medPh['in-progress'])}, review and archive ${dur(medPh.complete)}.`;
  const legend = `<div class="ch-legend">${PHASES.map(([k]) => `<span><i style="background:${CF_VAR[k]}"></i>${CF_LABEL[k]}</span>`).join('')}<span><i class="dot" style="background:${CF_VAR.archived}"></i>Archived</span><span class="muted">pale = still in that phase · <span class="ch-warn">+n tasks</span> = added after work started</span></div>`;
  const table = `<details class="ch-data"><summary>Data</summary><table><thead><tr><th>Change</th><th>Specified</th><th>In progress</th><th>Tasks done</th><th>Archived</th><th>Cycle time</th></tr></thead><tbody>${rows.slice().reverse().map((r) => `<tr><td>${esc(r.n)}</td>${['specified', 'in-progress', 'complete', 'archived'].map((k) => `<td>${r.t[k] != null ? whenFmt(r.t[k]) : '—'}</td>`).join('')}<td>${r.t.specified != null ? dur((r.t.archived ?? r.t.complete ?? now) - r.t.specified) : '—'}</td></tr>`).join('')}</tbody></table></details>`;
  return `${legend}<svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cycle time per change">${g}</svg>${table}`;
}

// ---- age of the open changes in their current status, against the median of finished ones
function agingChart(s, shownNames, times, W) {
  const now = Date.now();
  const open = s.changes.filter((c) => shownNames.has(c.name) && ['specified', 'in-progress', 'complete'].includes(c.status));
  if (!open.length) return '<div class="empty">Nothing open right now: no change is specified, in progress or waiting to be archived.</div>';
  const typical = {};
  for (const [k] of PHASES) typical[k] = median([...times.entries()].map(([, t]) => phasesOf(t, now).find((p) => p.k === k && !p.open)).filter(Boolean).map((p) => p.end - p.start));
  const rows = open.map((c) => { const since = times.get(c.name)?.[c.status] ?? c.lastModified ?? now; return { c, age: now - since, typ: typical[c.status] }; })
    .sort((a, b) => b.age - a.age);
  const maxV = Math.max(...rows.map((r) => Math.max(r.age, r.typ ?? 0))) * 1.08;
  const LBL = Math.min(190, W * 0.4), R = 130, rowH = 34, T = 4;
  const H = T + rows.length * rowH + 4;
  const x = (v) => LBL + (v / maxV) * (W - LBL - R);
  let g = '';
  rows.forEach((r, i) => {
    const y = T + i * rowH;
    const slow = r.typ && r.age > 2 * r.typ;
    g += `<text class="ch-lbl ch-row" x="0" y="${y + 13}" data-pick="${esc(r.c.name)}">${esc(title(r.c.name).slice(0, 30))}<title>${esc(r.c.name)}</title></text>
      <text class="ch-ax" x="0" y="${y + 27}">${CF_LABEL[r.c.status]}${slow ? ' · ⚠ longer than usual' : ''}</text>
      <rect x="${LBL}" y="${y + 9}" width="${Math.max(3, x(r.age) - LBL)}" height="12" rx="4" fill="${CF_VAR[r.c.status]}" ${tipAttr([r.c.name, `${CF_LABEL[r.c.status]} for ${dur(r.age)}`, r.typ ? `typical: ${dur(r.typ)}` : 'no finished change to compare with yet'])}/>
      ${r.typ ? `<line x1="${x(r.typ)}" x2="${x(r.typ)}" y1="${y + 4}" y2="${y + 26}" stroke="var(--ink)" stroke-width="2" ${tipAttr([`typical ${CF_LABEL[r.c.status]}: ${dur(r.typ)}`])}/>` : ''}
      <text class="ch-lbl" x="${Math.max(x(r.age), r.typ ? x(r.typ) : 0) + 8}" y="${y + 19}">${dur(r.age)}${r.typ ? `<tspan class="muted"> / typ. ${dur(r.typ)}</tspan>` : ''}</text>`;
  });
  return `<div class="ch-legend"><span><i class="tick"></i>typical time in that status (median of finished changes)</span></div><svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Age of open changes">${g}</svg>`;
}

// ---- check-offs by day and hour
function heatChart(s, shownNames, times, W) {
  const checks = (tl.data?.checks ?? []).filter((x) => shownNames.has(x.change));
  if (!checks.length) return '<div class="empty">No checked-off tasks recorded yet.</div>';
  const dayKey = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const days = [...new Set(checks.map((x) => dayKey(x.t)))].sort((a, b) => a - b).slice(-14);
  const cell = new Map();
  for (const x of checks) { const k = `${dayKey(x.t)}:${new Date(x.t).getHours()}`; cell.set(k, (cell.get(k) ?? 0) + 1); }
  const max = Math.max(...cell.values());
  const L = 92, T = 4, gap = 2;
  const cw = Math.min(40, Math.max(8, Math.floor((W - L - 4) / 24) - gap)), ch = Math.min(22, cw);
  const H = T + days.length * (ch + gap) + 22;
  let g = '';
  days.forEach((d, r) => {
    const y = T + r * (ch + gap);
    g += `<text class="ch-ax" x="${L - 8}" y="${y + ch / 2 + 4}" text-anchor="end">${dayFmt(d)}</text>`;
    for (let h = 0; h < 24; h++) {
      const n = cell.get(`${d}:${h}`) ?? 0;
      const xx = L + h * (cw + gap);
      g += `<rect x="${xx}" y="${y}" width="${cw}" height="${ch}" rx="3" fill="${n ? `color-mix(in srgb, var(--cf-specified) ${Math.round(18 + 82 * (n / max))}%, var(--surface))` : 'var(--surface-2)'}" ${tipAttr([`${dayFmt(d)}, ${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00`, `${n} task${n === 1 ? '' : 's'} checked off`])}/>`;
    }
  });
  for (const h of [0, 6, 12, 18]) g += `<text class="ch-ax" x="${L + h * (cw + gap)}" y="${H - 6}">${String(h).padStart(2, '0')}:00</text>`;
  const live = checks.filter((x) => x.src === 'live').length;
  const sub = $('ch-heat-sub');
  if (sub) sub.textContent = `${checks.length} check-offs (${live} recorded live, ${checks.length - live} from commits, which only know the commit time). Darker = more.`;
  return `<div class="ch-legend"><span>fewer</span>${[18, 45, 72, 100].map((p) => `<i style="background:color-mix(in srgb, var(--cf-specified) ${p}%, var(--surface))"></i>`).join('')}<span>more (max ${max} per hour)</span></div><div class="ch-scroll"><svg class="ch-svg" width="${L + 24 * (cw + gap)}" height="${H}" role="img" aria-label="Check-offs per hour">${g}</svg></div>`;
}

// ---- the roadmap as a dependency graph, with the longest open chain highlighted
function depsChart(s, shownNames, times, W) {
  const all = s.changes.filter((c) => c.inRoadmap && c.status !== 'parking' && !(ui.boardFocus && c.status === 'archived'));
  const byOrder = new Map(all.map((c) => [c.order, c]));
  const nodes = all.filter((c) => shownNames.has(c.name) || all.some((x) => shownNames.has(x.name) && x.dependsOn.includes(c.order)));
  if (!nodes.length) return '<div class="empty">No roadmap.</div>';
  const inSet = new Set(nodes.map((c) => c.order));
  const deps = (c) => c.dependsOn.filter((o) => inSet.has(o));
  const soft = (c) => (c.softDependsOn ?? []).filter((o) => inSet.has(o));
  const layer = new Map();
  const lay = (c, seen = new Set()) => {
    if (layer.has(c.order)) return layer.get(c.order);
    if (seen.has(c.order)) return 0; seen.add(c.order);
    const l = deps(c).length ? 1 + Math.max(...deps(c).map((o) => lay(byOrder.get(o), seen))) : 0;
    layer.set(c.order, l); return l;
  };
  nodes.forEach((c) => lay(c));
  // critical path: longest chain of changes that are not done yet
  const chain = new Map();
  const len = (c) => {
    if (chain.has(c.order)) return chain.get(c.order).n;
    if (isDone(c)) { chain.set(c.order, { n: 0, prev: null }); return 0; }
    let best = { n: 1, prev: null };
    for (const o of deps(c)) { const n = len(byOrder.get(o)) + 1; if (n > best.n) best = { n, prev: o }; }
    chain.set(c.order, best); return best.n;
  };
  nodes.forEach(len);
  const end = nodes.filter((c) => !isDone(c)).sort((a, b) => chain.get(b.order).n - chain.get(a.order).n || a.seq - b.seq)[0];
  const crit = new Set();
  for (let o = end?.order; o != null; o = chain.get(o)?.prev) crit.add(o);
  const cols = Math.max(...nodes.map((c) => layer.get(c.order))) + 1;
  const byLayer = Array.from({ length: cols }, (_, l) => nodes.filter((c) => layer.get(c.order) === l).sort((a, b) => a.seq - b.seq));
  // fewer crossings: order each layer by the mean row of its prerequisites (barycenter), roadmap order on ties
  const row = new Map();
  byLayer.forEach((l, li) => {
    if (li) {
      const bary = (c) => { const ys = deps(c).map((o) => row.get(o)).filter((v) => v != null); return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : Infinity; };
      l.sort((a, b) => bary(a) - bary(b) || a.seq - b.seq);
    }
    l.forEach((c, i) => row.set(c.order, i));
  });
  const gx = 30, NH = 34, gy = 10;
  const NW = Math.max(124, Math.min(170, Math.floor((W - 8 - (cols - 1) * gx) / cols)));
  const Wd = cols * (NW + gx) - gx + 8, Hd = Math.max(...byLayer.map((l) => l.length)) * (NH + gy) + 8;
  const pos = new Map();
  byLayer.forEach((l, li) => l.forEach((c, i) => pos.set(c.order, { x: 4 + li * (NW + gx), y: 4 + i * (NH + gy) })));
  let edges = '', boxes = '';
  const maxCh = Math.floor((NW - 18) / 6.6);
  for (const c of nodes) {
    const b = pos.get(c.order);
    for (const [list, dashed] of [[deps(c), false], [soft(c), true]]) for (const o of list) {
      const a = pos.get(o);
      const isCrit = !dashed && crit.has(o) && crit.has(c.order) && chain.get(c.order)?.prev === o;
      const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
      const settled = isDone(byOrder.get(o)) && isDone(c);
      edges += `<path d="M${x1},${y1}C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" class="ch-edge${isCrit ? ' crit' : settled ? ' settled' : ''}" ${dashed ? 'stroke-dasharray="4 4"' : ''}/>`;
    }
  }
  for (const c of nodes) {
    const p = pos.get(c.order);
    const st = c.status === 'proposed' ? 'proposed' : c.status;
    const ghost = !shownNames.has(c.name);
    const lab = title(c.name);
    boxes += `<g class="ch-node ${crit.has(c.order) ? 'crit' : ''} ${ghost ? 'ghost' : ''}" data-pick="${esc(c.name)}" ${tipAttr([`#${c.order} ${c.name}`, `${CF_LABEL[st] ?? st}${c.blockedBy?.length && !isDone(c) ? ` · waits for ${c.blockedBy.map((o) => '#' + o).join(', ')}` : ''}`, ...(crit.has(c.order) ? ['on the critical path'] : [])])}>
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="8" class="ch-nbox"/>
      <rect x="${p.x}" y="${p.y}" width="5" height="${NH}" rx="2.5" fill="${CF_VAR[st] ?? 'var(--faint)'}"/>

  return `<div class="ch-scroll"><svg class="ch-svg" width="${Wd}" height="${Hd}" role="img" aria-label="Dependency graph">${edges}${boxes}</svg></div>`;

const blRows = (ms) => [...document.querySelectorAll(`.bl-list[data-blms="${CSS.escape(ms)}"] > .bl-row`)];
const clearDrop = () => document.querySelectorAll('.drop-before, .drop-after').forEach((el) => el.classList.remove('drop-before', 'drop-after'));
document.addEventListener('dragstart', (e) => {

  const r = row.getBoundingClientRect();

  if (!ui.drag || !row) return;
  e.preventDefault();
  const rows = blRows(ui.drag.ms);
  const i = rows.indexOf(row);

function accept(next) {

  const prev = ui.state;
  if (prev) {
    const before = new Map(prev.changes.map((c) => [c.name, c]));
    for (const c of next.changes) for (const g of c.tasks?.groups ?? []) for (const i of g.items) {
      const old = before.get(c.name)?.tasks?.groups.flatMap((x) => x.items).find((x) => x.id === i.id);
      if (old && !old.done && i.done) ui.fresh.add(c.name + '|' + i.id);
    }
    setTimeout(() => ui.fresh.clear(), 3000);
  }
  ui.state = next;
  if (ui.pinned === null && location.hash.length > 1) ui.pinned = decodeURIComponent(location.hash.slice(1));
  render();
  if (ag.open && !$('ag-thread') && !$('ag-body')) buildAgent(); else renderAgentLive();

async function agentSend(force = false, direct = null) {
  if (ag.busy || voice.state !== 'idle') return;
  const ta = $('ag-text');
  const typed = ta?.value.trim() ?? '';
  const text = direct ?? (typed && ag.panel === 'chat' ? withQuote(typed) : typed);
  ag.busy = true;
  try {
    if (ag.panel === 'chat') {
      if (!text) return;
      const c = conversations().find((x) => x.id === ag.convo);
      if (c?.terminal) await agentPost('message', { text, to: 'inbox' });
      else if (c?.session) await agentPost('message', { change: c.last.change, text, job: c.last.id });
      else await agentPost('chat', { text, mode: c?.brainstorm ? 'brainstorm' : 'assistant' });
      if (!direct) { ag.drafts['chat-' + ag.convo] = ''; ta.value = ''; rx.quote = null; showQuoteChip(); }
      ag.stick = true;
      ag.note = '';
    } else if (ag.mode === 'ask') {
      if (!text) return;
      await agentPost('ask', { change: ag.target, question: text });
      ag.drafts['ticket-ask'] = ''; ta.value = ''; ag.note = '';
    } else {
      const r = await agentPost('start', { change: ag.target, force });
      ag.force = null; ag.note = '';
      const sid = await waitForSession(r.id);
      if (sid) return openChat('session:' + sid);
    }
  } catch (e) {
    ag.note = '✕ ' + e.message;
    if (e.needsForce) { ag.force = true; return buildAgent(); }
    if (ag.panel === 'chat') $('ag-route').innerHTML = `<span style="color:var(--st-blocked)">${esc(ag.note)}</span>`;
  } finally {
    ag.busy = false;
  }
  renderAgentLive();
}

  if (l.id === 'gh-list' && gh.more && !gh.loading && l.scrollTop + l.clientHeight > l.scrollHeight - 200) ghLoad(false);
}, true);
document.addEventListener('keydown', (e) => {
  if (!gh.open || e.target.closest?.('input, textarea, select, [contenteditable]') || document.querySelector('dialog[open]')) return;
  if (e.key === 'Escape') { e.preventDefault(); return gh.max ? $('githist').querySelector('[data-gh-max]').click() : ghClose(); }
  const k = { ArrowDown: 1, j: 1, ArrowUp: -1, k: -1, PageDown: 10, PageUp: -10, Home: -1e9, End: 1e9 }[e.key];
  if (!k || !e.target.closest?.('#githist') && document.activeElement !== document.body) return;
  e.preventDefault(); e.stopPropagation();
  const i = Math.max(0, Math.min(gh.commits.length - 1, gh.commits.findIndex((c) => c.h === gh.sel) + k));

const PARAMS = new URLSearchParams(location.search);
const SNAPSHOT = PARAMS.has('snapshot');
let PROJECT = PARAMS.get('project');
function withProject(u) { return PROJECT ? `${u}${u.includes('?') ? '&' : '?'}project=${encodeURIComponent(PROJECT)}` : u; }
function hrefFor(id) {
  const u = new URL(location.href);
  if (id) { u.searchParams.set('project', id); u.searchParams.delete('overview'); } else { u.searchParams.delete('project'); u.searchParams.set('overview', ''); }
  u.hash = '';

}

  const back = (x, act, label) => x.exists ? `<button class="${act === 'reactivate' ? 'btn primary' : 'link'}" type="button" data-proj-act="${act}" data-root="${esc(x.root)}">${label}</button>`
    : `<span class="muted">its openspec/ folder is gone</span><button class="link" type="button" data-proj-act="forget" data-root="${esc(x.root)}">Remove from the list</button>`;
  const arch = (x) => { const m = x.summary; return `<div class="panel ov-card ov-arch">
      <div class="ov-top"><span class="ov-name">${esc(x.name)}</span><span class="pill" style="--st:var(--st-archived)">Archived</span></div>
      <div class="ov-path">${esc(x.display)}</div>
      ${m && !m.loading ? `<div class="ov-row"><span class="num">${m.done}/${m.changes} changes done</span><span class="num">${m.totals.done}/${m.totals.total} tasks</span>${m.current ? `<span>last: ${esc(title(m.current.name))}</span>` : ''}</div>` : ''}
      <div class="ov-row"><span>archived ${ago(x.at)}</span></div>

    ${a.length ? `<div class="ov-grid">${a.map(arch).join('')}</div>` : ''}
    ${u.length ? `<div class="ov-unf"><span class="muted">Unfollowed:</span>${u.map((x) => `<span class="ov-unf-i" title="${esc(x.display)}"><b>${esc(x.name)}</b>${AGENT_TOKEN ? back(x, 'follow', 'Follow again') : ''}${AGENT_TOKEN && x.exists ? `<button class="link" type="button" data-proj-act="forget" data-root="${esc(x.root)}" title="Remove it from this list">✕</button>` : ''}</span>`).join('')}</div>` : ''}
  </details>`;
}

    const d = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));

const onb = { path: null };
const planNow = (j) => { const t = j?.plan?.find((x) => x.status === 'in_progress'); return t ? (t.activeForm ?? t.content) : null; };
function onbJob() { const c = ui.overview?.discovery?.candidates.find((x) => x.path === onb.path); return c ? { c, job: discJobs(c).onboard } : {}; }

  const running = alive(job);
  const end = running ? Date.now() : (job.lastActivity ?? Date.now());
  const mins = Math.max(0, Math.round((end - job.startedAt) / 60000));
  const steps = job.log.filter((l) => l.kind === 'tool' || l.kind === 'text' || l.kind === 'error');
  const plan = job.plan ?? [];
  const done = plan.filter((t) => t.status === 'completed').length;
  const summary = !running ? [...job.log].reverse().find((l) => l.kind === 'text' && !l.sub) : null;
  const status = running ? `<span><span class="ag-spin"></span> Running</span>`
    : job.status === 'failed' ? `<span class="bad">✕ Failed${job.error ? `: ${esc(job.error.slice(0, 200))}` : ''}</span>`
    : `<span class="ok">✓ Done</span>`;
  const list = dlg.querySelector('#onb-steps');
  const atEnd = !list || list.scrollTop + list.clientHeight >= list.scrollHeight - 30;
  morphHtml(dlg, `<div class="set-head"><h2 id="onb-title">Onboarding ${esc(c.name)}</h2><button class="link" type="button" data-sc-open="${esc(c.path)}" data-onb-close>Open the conversation</button><button class="link" type="button" data-onb-close autofocus>Close ✕</button></div>
    <div class="onb-status">${status}<span class="muted">started ${esc(hhmm(job.startedAt))} · ${mins < 1 ? 'less than a minute' : `${mins} min`}${running ? ' so far' : ''} · ${steps.length} step${steps.length === 1 ? '' : 's'}</span><bdi class="muted">${esc(c.display)}</bdi></div>
    <div class="onb-sec"><h3>Plan <span class="muted">${plan.length ? `${done} of ${plan.length} done${running && planNow(job) ? ` · now: ${esc(planNow(job))}` : ''}` : ''}</span></h3>
      ${plan.length ? `<div class="onb-bar"><span style="width:${Math.round((done / plan.length) * 100)}%"></span></div>
        <ol class="onb-plan">${plan.map((t) => `<li class="${t.status === 'completed' ? 'p-done' : t.status === 'in_progress' ? 'p-now' : 'p-open'}"><i>${t.status === 'completed' ? '✓' : t.status === 'in_progress' ? '◐' : '○'}</i><span>${esc(t.status === 'in_progress' ? (t.activeForm ?? t.content) : t.content)}</span></li>`).join('')}</ol>`
      : `<div class="muted" style="font-size:13px">${running ? 'Claude has not written its plan yet; the steps below show what it is doing.' : 'No plan was recorded.'}</div>`}</div>
    <div class="onb-sec"><h3>Steps <span class="muted">newest at the bottom</span></h3>
      <ol class="onb-steps" id="onb-steps">${steps.map((l) => `<li class="${l.kind} ${l.sub ? 'sub' : ''}"><time>${esc(hhmm(l.t))}</time><span>${esc(l.kind === 'text' ? l.text.replace(/\s+/g, ' ').slice(0, 220) + (l.text.length > 220 ? '…' : '') : l.text)}</span></li>`).join('') || '<li><span class="muted">Starting…</span></li>'}</ol></div>
    ${summary ? `<div class="onb-sec onb-sum"><h3>Summary</h3><div class="md">${md(summary.text)}</div></div>` : ''}`);

const sc_projects = new Map();

    if (i % 2 === 0) return p.trim() ? md(p) : '';
    const t = parseTicket(p);
    const f = {};
    for (const l of p.split(/^---\s*$/m)[0].split('\n')) { const m = l.match(/^\s*([a-z][a-z ]*):\s*(.*)$/i); if (m) f[m[1].trim().toLowerCase()] = m[2].trim(); }
    const id = `${key}:${i}`;
    sc_projects.set(id, { name: (f.name ?? '').replace(/`/g, ''), title: f.title ?? '', brief: p.trim() });
    return `<div class="tk-card">
      <div class="tk-h">📁 Project <code>${esc(f.name || '?')}</code>${f.title ? ` · ${esc(f.title)}` : ''}</div>
      <div class="tk-meta">${[f.stack && esc(f.stack), f['quality gate'] && `gate <code>${esc(f['quality gate'])}</code>`].filter(Boolean).join(' · ')}</div>
      ${t.body ? `<details class="tk-body"><summary>Brief</summary><div class="md">${md(t.body)}</div></details>` : ''}
      <div class="ag-row"><button class="btn primary" type="button" data-np-create="${esc(id)}">Create project…</button><span class="ag-note">creates the folder and sets it up in the background</span></div>
    </div>`;
  }).join('');
}
// ---- expert mode for a new project: the workflow details it is set up with (quality gates, what every task is
// checked for, what every change is reviewed for, the workflow steps). Toggle chips with defaults, own entries can
// be added; remembered as the default for the next project. Sent to the brainstorm when they change, and with Create
// as the brief's "Workflow" section, which the setup writes into openspec/config.yaml and CLAUDE.md.
const ONE = { one: true }; // a group where exactly one entry is chosen
const XP_CHECK = 'Check local containers and images for services to reuse before installing anything';
const EXPERT = [
  ['gates', 'Quality gates', [['Build and unit tests', 1], ['Linting and formatting', 1], ['Type checks / null safety', 1], ['Integration tests against real dependencies', 0], ['End-to-end tests', 0], ['Coverage threshold', 0], ['Mutation testing', 0], ['Architecture rules (module boundaries)', 0], ['Dependency vulnerability scan', 0], ['License check', 0], ['Performance budgets', 0]]],
  ['task', 'Checked for every task', [['A test proves it (the verify criterion)', 1], ['Quality gate green before ticking it', 0], ['No TODOs or commented-out code', 0], ['Docs updated when behaviour changes', 0]]],
  ['review', 'Reviewed for every change', [['Matches the specs and their scenarios', 1], ['Security (input validation, secrets, access)', 1], ['Error handling and logging', 1], ['Test quality (meaningful assertions, not flaky)', 1], ['Readability and maintainability', 1], ['Performance', 0], ['Accessibility', 0], ['API compatibility (no unintended breaking changes)', 0], ['Data migrations and backward compatibility', 0]]],
  ['flow', 'Workflow steps', [['One commit per ticket', 1], ['Acceptance check by a fresh agent', 1], ['Diff review by a fresh agent, findings validated', 1], ['Docs update by a fresh agent', 1], ['Diagram update', 0], ['Parking lot for deferred findings', 1]]],
  ['docs', 'Documentation', [['README: setup, usage and the quality gate', 1], ['CLAUDE.md / AGENTS.md kept current', 1], ['Architecture overview', 0], ['Decision records (ADRs)', 1], ['API reference (e.g. OpenAPI)', 0], ['User guide', 0], ['Changelog', 0], ['Diagrams of the architecture and the main flows', 1]]],
  ['diagrams', 'Diagram format', [['Mermaid', 1], ['PlantUML', 0], ['Mermaid and PlantUML', 0]], ONE],
  ['diagramTypes', 'Diagram types', [['System context (C4 level 1)', 1], ['Containers (C4 level 2)', 1], ['Components (C4 level 3)', 0], ['Sequence diagrams of the main flows', 1], ['Data model (ER)', 1], ['State machines', 0], ['Activity / flow charts', 0], ['Deployment', 0], ['Class diagrams', 0]]],
  ['engine', 'Container engine', [['Podman', 1], ['Docker', 0], ['None: install on the host', 0]], ONE],
  ['services', 'Tools and services', [['Tools not installed on the host run in a container', 1], [XP_CHECK, 1], ['Dev services (database, mail, …) in a compose file', 0], ['Pinned image versions', 1]]],
];
const xp = (() => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('osd-expert') || 'null'); } catch {}
  const groups = Object.fromEntries(EXPERT.map(([k, , items]) => [k, { on: new Set(saved?.on?.[k] ?? items.filter(([, d]) => d).map(([l]) => l)), custom: saved?.custom?.[k] ?? [] }]));
  return { open: !!saved?.open, groups, sent: null, fold: false }; // fold: on, but shown as one line (after it went with a message)
})();
const xpSave = () => { try { localStorage.setItem('osd-expert', JSON.stringify({ open: xp.open, on: Object.fromEntries(Object.entries(xp.groups).map(([k, g]) => [k, [...g.on]])), custom: Object.fromEntries(Object.entries(xp.groups).map(([k, g]) => [k, g.custom])) })); } catch {} };
function xpSummary() { // what is chosen, per group, as plain lines
  return EXPERT.map(([k, label]) => { const g = xp.groups[k]; const on = [...g.on]; return on.length ? `${label}: ${on.join('; ')}` : null; }).filter(Boolean);
}
// with "check local containers" chosen, the server adds the list of local containers and images (of the chosen engine)
const xpContainers = () => (xp.open && xp.groups.services.on.has(XP_CHECK) ? { inventory: true, engine: /docker/i.test([...xp.groups.engine.on][0] ?? '') ? 'docker' : 'podman' } : {});
function xpHtml() {
  if (!xp.open) return '';
  if (xp.fold) {
    const n = Object.values(xp.groups).reduce((a, g) => a + g.on.size, 0);
    return `<div class="np-expert-fold">⚙ Expert mode is on: ${n} choices in ${EXPERT.length} groups go with the brainstorm and with Create. <button class="link" type="button" data-xp-unfold>Show</button></div>`;
  }
  return `<div class="np-expert">${EXPERT.map(([k, label, items]) => {
    const g = xp.groups[k];
    const all = [...items.map(([l]) => l), ...g.custom];
    const one = EXPERT.find(([x]) => x === k)[3]?.one;
    return `<div class="xp-g"><div class="xp-h">${esc(label)} <span class="muted">${one ? 'choose one' : `${g.on.size} of ${all.length}`}</span></div><div class="xp-chips">${all.map((l) => `<button type="button" class="xp-chip" data-xp="${esc(k)}" data-xp-item="${esc(l)}" aria-pressed="${g.on.has(l)}">${esc(l)}</button>`).join('')}<input class="xp-add" data-xp-add="${esc(k)}" placeholder="+ add" spellcheck="false"></div></div>`;
  }).join('')}<div class="ag-note">Claude gets these with your next message and plans with them (with the check of local containers, it also gets the list of your local containers and images); Create writes them into the project's <code>openspec/config.yaml</code> and CLAUDE.md.</div></div>`;
}
document.addEventListener('click', (e) => {
  const t = e.target;
  const tog = t.closest?.('[data-xp-toggle], [data-xp-unfold]');
  const chip = t.closest?.('[data-xp-item]');
  if (!tog && !chip) return;
  e.stopPropagation();
  if (tog) { if (tog.matches('[data-xp-unfold]') || (xp.open && xp.fold)) xp.fold = false; else xp.open = !xp.open; }
  else {
    const g = xp.groups[chip.dataset.xp], item = chip.dataset.xpItem;
    if (EXPERT.find(([k]) => k === chip.dataset.xp)[3]?.one) g.on = new Set([item]); // exactly one
    else g.on.has(item) ? g.on.delete(item) : g.on.add(item);
  }
  xpSave(); renderScout();
}, true);
document.addEventListener('keydown', (e) => {
  const inp = e.target.closest?.('[data-xp-add]');
  if (!inp || e.key !== 'Enter') return;
  e.preventDefault();
  const v = inp.value.trim();
  const g = xp.groups[inp.dataset.xpAdd];
  const grp = EXPERT.find(([k]) => k === inp.dataset.xpAdd);
  if (v && !g.custom.includes(v) && !grp[2].some(([l]) => l === v)) { g.custom.push(v); if (grp[3]?.one) g.on = new Set([v]); else g.on.add(v); }
  const key = inp.dataset.xpAdd;
  inp.value = ''; xpSave(); renderScout();
  document.querySelector(`[data-xp-add="${CSS.escape(key)}"]`)?.focus(); // ready for the next entry
});
function renderNewProject() {
  const d = ui.overview?.discovery;
  const jobs = (sc.fresh ? null : d?.newChats.find((x) => x.parent === sc.parent)?.jobs) ?? [];
  $('sc-title').innerHTML = 'New project<span class="sc-path">brainstorm it, then create it</span>';
  const cr = sc.create;
  morphHtml($('sc-bar'), `<div class="ag-row np-row"><label class="np-parent">Create in <input id="np-parent" value="${esc(sc.parentInput ?? '')}" spellcheck="false" autocomplete="off" ${jobs.length ? 'readonly title="Start a new brainstorm to choose another folder"' : ''}></label>
      <button class="link xp-toggle" type="button" data-xp-toggle aria-pressed="${xp.open}" title="Quality gates, task checks, review topics, workflow steps, documentation, diagram format and types, and containers for the new project">⚙ Expert mode</button>
      ${jobs.length ? '<button class="link" type="button" data-np-fresh>New brainstorm</button>' : ''}</div>
    ${xpHtml()}
    ${cr ? `<div class="ag-row np-create"><span class="ag-note">Create</span><code>${esc((sc.parentInput ?? '').replace(/\/$/, ''))}/</code><input id="np-name" value="${esc(cr.name)}" spellcheck="false" autocomplete="off">
      <button class="btn primary" type="button" data-np-go ${sc.busy ? 'disabled' : ''}>Create and set up</button><button class="link" type="button" data-np-cancel>Cancel</button></div>` : ''}
    <div class="ag-note ${sc.note.startsWith('✕') ? 'warn' : ''}">${esc(sc.note || 'Brainstorming · read-only · nothing is created until you press Create.')}</div>`);
  const th = $('ag-thread');
  const atEnd = th.scrollHeight - th.scrollTop - th.clientHeight < 60;
  th.innerHTML = threadHtml({ jobs, last: jobs.at(-1), newproject: true });
  if (atEnd || sc.stick) { th.scrollTop = th.scrollHeight; sc.stick = false; }
}
function openScout(p) {
  Object.assign(sc, { open: true, mode: 'candidate', path: p, note: '', create: null });
  scoutPanel('Ask about this project');
  const c = candidate(p);
  if (c && !discJobs(c).chat.length) $('sc-text').value = 'What is this project, and should we onboard it to OpenSpec and the ticket workflow?';
  sc.stick = true;
  renderScout();
  $('sc-text').focus();
  if (ui.overview) renderOverview(ui.overview);
}
function closeScout() { sc.open = false; scoutMax(false); $('agent').hidden = true; document.body.classList.remove('ag-open'); if (ui.overview) renderOverview(ui.overview); }
function renderScout() {
  if (sc.mode === 'new') return $('sc-bar') && renderNewProject();
  const c = candidate(sc.path);
  if (!c || !$('sc-bar')) return;
  const { chat, onboard } = discJobs(c);
  $('sc-title').innerHTML = `${esc(c.name)}<span class="sc-path" title="${esc(c.path)}">${esc(c.display)}</span>`;
  const running = onboard && alive(onboard);
  morphHtml($('sc-bar'), c.followed
    ? `<div class="ag-row"><span class="disc-ok">✓ Onboarded and followed.</span><a class="btn primary" href="${esc(hrefFor(c.projectId))}">Open it</a><button class="btn" type="button" data-sc-next>Next candidate →</button></div>`
    : running ? `<div class="ag-row"><span class="ag-note"><span class="ag-spin"></span>Onboarding in the background; the project appears in the list once <code>openspec/</code> is set up. Nothing is committed.</span></div>`
    : `<div class="ag-row sc-decide"><span class="ag-note">Decision:</span>
        <button class="btn primary" type="button" data-sc-onboard ${c.openspec ? 'disabled' : ''}>Onboard it</button>
        <button class="btn" type="button" data-sc-skip>Skip → next candidate</button>
        ${onboard?.status === 'failed' ? `<span class="ag-note warn">✕ ${esc(onboard.error ?? 'Onboarding failed')}</span>` : ''}</div>
       ${sc.note ? `<div class="ag-note ${sc.note.startsWith('✕') ? 'warn' : ''}">${esc(sc.note)}</div>` : ''}`);
  const jobs = [...chat, ...(onboard ? [onboard] : [])].sort((a, b) => a.startedAt - b.startedAt);
  const th = $('ag-thread');
  const atEnd = th.scrollHeight - th.scrollTop - th.clientHeight < 60;
  th.innerHTML = threadHtml({ jobs, last: jobs.at(-1), scout: true });
  if (atEnd || sc.stick) { th.scrollTop = th.scrollHeight; sc.stick = false; }
}
function nextCandidate(after) {
  const list = (ui.overview?.discovery?.candidates ?? []).filter((c) => !c.skipped && !c.followed && !c.openspec);
  const i = list.findIndex((c) => c.path === after);
  return list[i + 1] ?? list.find((c) => c.path !== after) ?? null;
}
async function scoutSend(direct = null) {
  const ta = $('sc-text');
  const typed = ta?.value.trim();
  const text = direct ?? (typed ? withQuote(typed) : '');
  if (!text || sc.busy) return;
  sc.busy = true;
  try {
    if (sc.mode === 'new') {
      const parentInput = $('np-parent')?.value.trim() || sc.parentInput;
      const sum = xp.open ? xpSummary().join(' · ') : '';
      const withXp = sum && (sc.fresh || sum !== xp.sent) ? `[Workflow details (expert mode): ${sum.replace(/[\]\n]/g, ' ')}]\n${text}` : text;
      const r = await discPost({ action: 'newchat', parent: parentInput, text: withXp, fresh: sc.fresh, ...(withXp !== text ? xpContainers() : {}) });
      if (sum) { xp.sent = sum; if (!xp.fold) { xp.fold = true; renderScout(); } } // the brainstorm gets the room again
      Object.assign(sc, { parent: r.parent, parentInput, fresh: false });
    } else await discPost({ action: 'chat', path: sc.path, text });
    if (!direct) { ta.value = ''; rx.quote = null; showQuoteChip(); }
    sc.stick = true; sc.note = '';
  }
  catch (e) { $('sc-route').innerHTML = `<span style="color:var(--st-blocked)">✕ ${esc(e.message)}</span>`; }
  finally { sc.busy = false; }
}
document.addEventListener('submit', (e) => {
  if (!e.target.matches?.('[data-disc-form]')) return;
  e.preventDefault();
  const path = $('disc-path').value.trim();
  sc.note = 'Searching…';
  discPost({ action: 'scan', path }).then((d) => { sc.note = `${d.found} found`; }).catch((err) => { sc.note = '✕ ' + err.message; }).finally(() => ui.overview && renderOverview(ui.overview));
  if (ui.overview) renderOverview(ui.overview);
});
document.addEventListener('change', (e) => {
  if (e.target.matches?.('[data-disc-skipped]')) { sc.showSkipped = e.target.checked; renderOverview(ui.overview); }
});
document.addEventListener('click', (e) => {
  const t = e.target;
  const hit = t.closest?.('[data-disc], [data-sc-open], [data-sc-close], [data-sc-max], [data-sc-send], [data-sc-onboard], [data-sc-skip], [data-sc-next], [data-np-open], [data-np-fresh], [data-np-create], [data-np-go], [data-np-cancel]');
  if (!hit) return;
  e.stopPropagation();
  if (hit.matches('[data-np-open]')) return openNewProject();
  if (hit.matches('[data-sc-max]')) {
    scoutMax(!sc.max);
    if (sc.mode === 'new') try { localStorage.setItem('osd-np-max', sc.max ? '1' : '0'); } catch {}
    return $('sc-text')?.focus();
  }
  if (hit.matches('[data-np-fresh]')) { Object.assign(sc, { fresh: true, create: null, note: '' }); return renderScout(); }
  if (hit.matches('[data-np-cancel]')) { sc.create = null; return renderScout(); }
  if (hit.matches('[data-np-create]')) {
    const pj = sc_projects.get(hit.dataset.npCreate);
    if (!pj) return;
    sc.create = { name: pj.name, brief: pj.brief };
    renderScout();
    return $('np-name')?.focus();
  }
  if (hit.matches('[data-np-go]')) {
    const name = $('np-name')?.value.trim();
    sc.busy = true; sc.note = 'Creating…'; renderScout();
    return discPost({ action: 'create', parent: sc.parent ?? sc.parentInput, name, brief: sc.create.brief, workflow: xp.open ? xpSummary() : null, ...xpContainers() })
      .then((r) => { sc.busy = false; sc.create = null; openScout(r.path); })
      .catch((err) => { sc.busy = false; sc.note = '✕ ' + err.message; renderScout(); });
  }
  if (hit.matches('[data-sc-open]')) return openScout(hit.dataset.scOpen);
  if (hit.matches('[data-sc-close]')) return closeScout();
  if (hit.matches('[data-sc-send]')) return scoutSend();
  const act = (body, okNote = '') => discPost(body).then(() => { sc.note = okNote; }).catch((err) => { sc.note = '✕ ' + err.message; }).finally(() => { if (ui.overview) renderOverview(ui.overview); if (sc.open) renderScout(); });
  if (hit.matches('[data-disc]')) return act({ action: hit.dataset.disc, path: hit.dataset.path });
  if (hit.matches('[data-sc-onboard]')) return act({ action: 'onboard', path: sc.path });
  if (hit.matches('[data-sc-skip], [data-sc-next]')) {
    const next = nextCandidate(sc.path);
    const done = () => (next ? openScout(next.path) : closeScout());
    return hit.matches('[data-sc-skip]') ? discPost({ action: 'skip', path: sc.path }).then(done).catch((err) => { sc.note = '✕ ' + err.message; renderScout(); }) : done();
  }
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sc.open && !document.querySelector('dialog[open]')) { e.preventDefault(); return sc.max ? scoutMax(false) : closeScout(); }
  if (e.target.id !== 'sc-text' || e.key !== 'Enter' || e.isComposing || e.shiftKey) return;
  e.preventDefault(); scoutSend();
});

function startProject() {
  if (PARAMS.has('focus')) ui.boardFocus = PARAMS.get('focus') !== '0'; // ?focus: the board in focus mode
  if (['board', 'backlog', 'charts'].includes(PARAMS.get('view'))) ui.boardView = PARAMS.get('view'); // ?view=backlog|charts
  if (AGENT_TOKEN && PARAMS.get('panel')?.startsWith('ticket:')) { // ?panel=ticket:<change> opens a ticket's panel
    Object.assign(ag, { open: true, panel: 'ticket', target: PARAMS.get('panel').slice(7), max: ag.max || PARAMS.has('max') }); $('agent').hidden = false; document.body.classList.add('ag-open');
  }
  if (AGENT_TOKEN && PARAMS.get('panel') === 'chat') { ag.open = true; ag.panel = 'chat'; ag.stick = true; ag.max = ag.max || PARAMS.has('max'); $('agent').hidden = false; document.body.classList.add('ag-open'); } // ?panel=chat opens the chat, &max maximized
  if (SNAPSHOT && AGENT_TOKEN) fetch(withProject('/api/agent')).then((r) => r.json()).then((v) => { ag.view = v; renderAgentLive(); });
  if (SNAPSHOT) fetch(withProject('/api/state')).then((r) => r.json()).then((d) => { $('conn').innerHTML = `<span class="dot"></span>snapshot ${hhmm(d.scannedAt)}`; accept(d); });
  else connect();
}
function startOverview() {
  document.querySelectorAll('[data-chat-btn]').forEach((b) => b.remove()); // the chat belongs to a project; candidates have their own
  document.querySelector('.main').hidden = true;
  $('board').hidden = true;
  $('overview').hidden = false;
  if (SNAPSHOT) {
    fetch('/api/projects').then((r) => r.json()).then((d) => { $('conn').innerHTML = `<span class="dot"></span>snapshot ${hhmm(d.scannedAt)}`; renderOverview(d); });
    return;
  }
  const es = new EventSource('/events?overview=1');
  es.onopen = () => { $('conn').innerHTML = '<span class="dot on"></span>live'; };
  es.onmessage = (ev) => { const d = JSON.parse(ev.data); $('conn').innerHTML = `<span class="dot on"></span>live · ${hhmm(d.scannedAt)}`; renderOverview(d); };
  es.onerror = () => { $('conn').innerHTML = '<span class="dot off"></span>disconnected, retrying…'; };
  setInterval(() => ui.overview && renderOverview(ui.overview), 30000);
}
(async () => {
  let list = [];
  try { list = (await (await fetch('/api/projects')).json()).projects ?? []; } catch { /* older server: one project */ }
  if (list.length > 1 || AGENT_TOKEN) { // with --agent the overview (and its discovery) is reachable with one project too
    const gone = PROJECT && !list.some((p) => p.id === PROJECT); // unfollowed or archived meanwhile: the overview
    if (gone) { PROJECT = null; history.replaceState(null, '', hrefFor(null)); }
    if (!PROJECT && list.length === 1 && !PARAMS.has('overview') && !gone) PROJECT = list[0].id;
    const sel = $('project');
    sel.innerHTML = `<option value="">All projects (${list.length})</option>` + list.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
    sel.value = PROJECT ?? '';
    sel.hidden = false;
    sel.addEventListener('change', () => { location.href = hrefFor(sel.value); });
    if (!PROJECT) return startOverview();
  }
  startProject();
})();
