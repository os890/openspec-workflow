<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSpec Dashboard</title>
<meta name="osd-agent" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Patrick+Hand&family=Courier+Prime:wght@400;700&family=Permanent+Marker&family=Cabin+Sketch:wght@400;700&family=Architects+Daughter&family=Share+Tech+Mono&family=Bangers&family=VT323&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* Layout: focus card (current change, its current task, its checklist) + side column (milestone, activity),
   then a soft kanban board. Friendly: rounded surfaces, soft shadows, tinted status lanes, readable titles. */
:root {
  --bg: #f3f4fa;
  --surface: #ffffff;
  --surface-2: #f2f3f9;
  --ink: #23253f;
  --muted: #61657f;
  --faint: #9a9db5;
  --line: #e4e6f0;
  --accent: #4f57d6;
  --accent-soft: #ebecfc;
  --st-proposed: #8d91aa;
  --st-specified: #3a86c8;
  --st-progress: #e0861a;
  --st-complete: #1f9d68;
  --st-archived: #5c8f7a;
  --st-blocked: #df5560;
  --st-missing: #df5560;
  --shadow: 0 1px 2px rgba(35, 37, 63, .05), 0 6px 20px rgba(35, 37, 63, .06);
  --shadow-hover: 0 2px 4px rgba(35, 37, 63, .07), 0 10px 28px rgba(35, 37, 63, .10);
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 16px;
  --radius-sm: 11px;
  /* chart palette (status flow), validated for colour-vision deficiency on light and dark surfaces */
  --cf-draft: #e87ba4; --cf-specified: #2a78d6; --cf-progress: #eb6834; --cf-complete: #1baf7a; --cf-archived: #6250d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14151f; --surface: #1d1e2c; --surface-2: #252738; --ink: #e9eaf6; --muted: #a6a9c4; --faint: #6f7291;
    --line: #2e3047; --accent: #9da2ff; --accent-soft: #2a2c52;
    --st-proposed: #9195b0; --st-specified: #6db4f2; --st-progress: #f5a54a; --st-complete: #4ccb91; --st-archived: #8bbca6;
    --st-blocked: #ff8189; --st-missing: #ff8189;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-hover: 0 4px 16px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cf-draft: #d55181; --cf-specified: #3987e5; --cf-progress: #d95926; --cf-complete: #199e70; --cf-archived: #9085e9; } }
:root[data-theme="dark"], :root[data-style="blackboard"], :root[data-style="matrix"], :root[data-style="terminal"] { --cf-draft: #d55181; --cf-specified: #3987e5; --cf-progress: #d95926; --cf-complete: #199e70; --cf-archived: #9085e9; }
:root[data-theme="dark"] {
  --bg: #14151f; --surface: #1d1e2c; --surface-2: #252738; --ink: #e9eaf6; --muted: #a6a9c4; --faint: #6f7291;
  --line: #2e3047; --accent: #9da2ff; --accent-soft: #2a2c52;
  --st-proposed: #9195b0; --st-specified: #6db4f2; --st-progress: #f5a54a; --st-complete: #4ccb91; --st-archived: #8bbca6;
  --st-blocked: #ff8189; --st-missing: #ff8189;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-hover: 0 4px 16px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code, .mono { font-family: var(--font-mono); font-size: .86em; }
code { background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: .05em .4em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .01em; }
.btn { border: 0; background: var(--surface-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { background: var(--accent-soft); color: var(--accent); }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; font-weight: 600; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: var(--st); background: color-mix(in srgb, var(--st) 15%, transparent); white-space: nowrap; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; border-radius: 999px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-proposed); display: inline-block; margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--st-complete); animation: pulse 2.4s infinite; }
.dot.off { background: var(--st-blocked); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--st-complete) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.slug { font-family: var(--font-mono); font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }

/* header */
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 18px 4px; flex-wrap: wrap; }
header.top h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -.02em; }
header.top h1 span { color: var(--muted); font-weight: 500; }
.live { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.live > span { background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 4px 12px; }

/* layout */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; padding-block: 16px 20px; align-items: start; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }

/* focus */
.focus-head { padding: 22px 26px 18px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.eyebrow .label { font-size: 13px; }
.eyebrow .switch { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.eyebrow .switch button { border: 0; background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
.eyebrow .switch button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.eyebrow .back { margin-left: auto; font-size: 13px; }
.f-name { font-size: 26px; font-weight: 800; letter-spacing: -.025em; line-height: 1.2; margin: 0; text-wrap: balance; }
.f-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.f-goal { font-size: 15px; max-width: 68ch; text-wrap: pretty; }
.progress { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; margin-top: 6px; }
.progress .count { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.progress .count small { font-size: 16px; color: var(--muted); font-weight: 600; }
.segs { display: flex; gap: 5px; height: 14px; }
.seg { flex: var(--n) 1 0; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
.seg > span { position: absolute; inset: 0 auto 0 0; background: var(--st-complete); border-radius: 999px; }
.seg.cur { box-shadow: inset 0 0 0 2px var(--st-progress); }
.seg-labels { grid-column: 2; display: flex; gap: 5px; font-size: 11.5px; color: var(--faint); }
.seg-labels span { flex: var(--n) 1 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; padding-left: 4px; }
.seg-labels span.cur { color: var(--st-progress); font-weight: 700; }

.now { margin: 4px 26px 0; background: color-mix(in srgb, var(--st-progress) 10%, var(--surface)); border-radius: var(--radius-sm); padding: 14px 18px; display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
.now.done { background: color-mix(in srgb, var(--st-complete) 11%, var(--surface)); }
.now .tag { font-size: 12px; font-weight: 800; color: var(--surface); background: var(--st-progress); border-radius: 999px; padding: 2px 10px; align-self: start; margin-top: 2px; }
.now.done .tag { background: var(--st-complete); }
.now .t { font-size: 16px; font-weight: 700; }
.now .t .tid { font-family: var(--font-mono); color: var(--muted); font-weight: 500; font-size: 13px; margin-right: 8px; }
.now .v { grid-column: 2; font-size: 13px; color: var(--muted); }
.now .v b { font-weight: 700; color: var(--ink); margin-right: 4px; }
.now .pulse { grid-column: 2; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 6px; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 20px; margin-top: 18px; }
.tab { border: 0; background: none; padding: 7px 14px; cursor: pointer; color: var(--muted); border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.tab:hover:not(:disabled) { background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
.tab:disabled { opacity: .4; cursor: default; }
.f-body { padding: 12px 26px 24px; }

details.group { border-radius: var(--radius-sm); margin: 0 -10px; padding: 0 10px; }
details.group + details.group { margin-top: 2px; }
details.group > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 9px 0; font-weight: 700; font-size: 14px; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary:hover { color: var(--accent); }
details.group > summary .chev { color: var(--faint); transition: transform .15s; font-size: 10px; }
details.group[open] > summary .chev { transform: rotate(90deg); }
details.group.complete > summary { color: var(--muted); font-weight: 600; }
details.group.current { background: color-mix(in srgb, var(--st-progress) 5%, transparent); }
details.group > summary .num { color: var(--muted); font-weight: 600; font-size: 12.5px; background: var(--surface-2); border-radius: 999px; padding: 0 9px; }
details.group.complete > summary .num { color: var(--st-complete); background: color-mix(in srgb, var(--st-complete) 12%, transparent); }
details.group.current > summary .num { color: var(--st-progress); background: color-mix(in srgb, var(--st-progress) 14%, transparent); }
.tasks { padding: 0 0 10px 26px; }
.task { display: grid; grid-template-columns: 22px 34px 1fr; gap: 2px 6px; padding: 6px 8px; margin: 0 -8px; border-radius: 9px; font-size: 13.5px; }
.box { width: 17px; height: 17px; border: 2px solid var(--faint); border-radius: 50%; margin-top: 2px; display: grid; place-items: center; }
.task.done .box { background: var(--st-complete); border-color: var(--st-complete); }
.task.done .box::after { content: ""; width: 7px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.task.done .txt { color: var(--muted); }
.task.cur { background: color-mix(in srgb, var(--st-progress) 12%, transparent); }
.task.cur .box { border-color: var(--st-progress); }
.task .tid { font-family: var(--font-mono); font-size: 12px; color: var(--faint); padding-top: 2px; }
.task .ver { grid-column: 3; font-size: 12.5px; color: var(--muted); }
.task.fresh { animation: flash 2.5s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--st-complete) 30%, transparent); } 100% { background: transparent; } }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
.issue { font-size: 13px; background: color-mix(in srgb, var(--st-blocked) 10%, transparent); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 8px; }
.issue.WARNING, .issue.INFO { background: color-mix(in srgb, var(--st-progress) 10%, transparent); }
.issue b { font-size: 11.5px; margin-right: 6px; color: var(--st-blocked); }
.val-head { font-weight: 700; margin-bottom: 10px; } .val-head.ok { color: var(--st-complete); } .val-head.bad { color: var(--st-blocked); }
.val-table { border-collapse: collapse; width: 100%; font-size: 13px; }
.val-table th, .val-table td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.val-table th { font-size: 12px; color: var(--muted); font-weight: 600; }
.val-table td.warn { color: var(--st-blocked); font-weight: 700; }
.val-table .op { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); }
.val-table .op.ADDED { color: var(--st-complete); } .val-table .op.MODIFIED { color: var(--st-progress); } .val-table .op.REMOVED { color: var(--st-blocked); }
.md { font-size: 14px; max-width: 78ch; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.2em 0 .4em; text-wrap: balance; font-weight: 800; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14.5px; } .md h4 { font-size: 13.5px; color: var(--muted); }
.md > :first-child { margin-top: 0; }
.md p { margin: .5em 0; }
.md ul, .md ol { padding-left: 1.3em; margin: .4em 0; }
.md pre { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; overflow-x: auto; font-size: 12px; }
.md pre code { background: none; padding: 0; }
.md .tbl { overflow-x: auto; }
/* tables in chat answers: the bubble may use the full width, words do not break, a wide table scrolls sideways */
.msg.them:has(table) { max-width: 100%; }
.msg .md .tbl { max-width: 100%; }
.msg .md table { width: max-content; max-width: none; border-collapse: collapse; font-size: 12.5px; }
.msg .md th, .msg .md td { overflow-wrap: normal; word-break: normal; min-width: 4ch; max-width: 30ch; padding: 4px 8px; vertical-align: top; border-bottom: 1px solid var(--line); text-align: left; }
.msg .md td code { white-space: nowrap; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }

/* side */
.side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.side .panel { padding: 18px 20px; }
.ms-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
.ms-title span { color: var(--accent); margin-right: 6px; }
.ms-list { list-style: none; margin: 12px -8px 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ms-list li button { width: 100%; display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; background: none; border: 0; padding: 6px 8px; border-radius: 9px; cursor: pointer; text-align: left; font-size: 13px; }
.ms-list li button:hover { background: var(--surface-2); }
.ms-list .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-list .s { color: var(--muted); font-size: 12px; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--st); }
.ms-next { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.feed { list-style: none; margin: 10px 0 0; padding: 0; max-height: 360px; overflow: auto; }
.feed li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.feed li:first-child { border-top: 0; }
.feed time { color: var(--faint); font-size: 12px; padding-top: 1px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.feed .what { min-width: 0; overflow-wrap: anywhere; }
.feed .ch { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font-size: 12.5px; font-weight: 600; }
details.files { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
details.files summary { cursor: pointer; }
details.files ul { list-style: none; padding: 0; margin: 6px 0 0; font-family: var(--font-mono); font-size: 11px; }
details.files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 2px 0; }
details.files .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
svg text { fill: var(--muted); font-family: var(--font-sans); font-size: 10.5px; }

/* board */
.board { padding: 20px 20px 22px; margin-bottom: 36px; }
.board-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 16px; }
.board-head .label { font-size: 18px; color: var(--ink); font-weight: 800; letter-spacing: -.02em; }
.ms-filter { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.ms-filter button { border: 0; background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.ms-filter button b { font-weight: 700; color: var(--ink); margin-right: 4px; }
.ms-filter button:hover { color: var(--ink); }
.ms-filter button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.ms-filter button[aria-pressed="true"] b { color: var(--surface); }
.cols { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.col { background: color-mix(in srgb, var(--st) 7%, var(--surface-2)); border-radius: var(--radius-sm); min-width: 0; display: flex; flex-direction: column; }
.col-head { padding: 12px 12px 6px; }
.col-head .t { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
.col-head .t::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--st); }
.col-head .t .num { margin-left: auto; color: var(--st); background: var(--surface); font-weight: 700; font-size: 12px; border-radius: 999px; padding: 0 9px; }
.col-head .d { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.col-body { padding: 6px 8px 10px; display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow: auto; }
.col-empty { font-size: 12.5px; color: var(--faint); padding: 8px 4px; text-align: center; }
.kc { text-align: left; background: var(--surface); border: 0; border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0; box-shadow: var(--shadow); transition: box-shadow .15s, transform .15s; }
.kc:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.kc.focus { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.kc.moved { animation: moved 3s ease-out; }
@keyframes moved { 0% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 40%, transparent); } 100% { box-shadow: var(--shadow); } }
.kc-top { display: flex; gap: 6px; font-size: 11.5px; color: var(--muted); min-width: 0; align-items: center; }
.kc-top .o { font-weight: 700; color: var(--faint); }
.kc-top .c { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.kc-top .m { margin-left: auto; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 7px; font-size: 11px; }
.kc-name { font-size: 13.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.kc-prog { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.kc-prog .bar { flex: 1; height: 6px; }
.kc-flag { font-size: 11.5px; color: var(--st-blocked); font-weight: 600; }
.kc-flag.muted { color: var(--muted); font-weight: 500; }

/* view switch and backlog list */
.view-switch { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.view-switch button { border: 0; background: none; border-radius: 999px; padding: 4px 14px; font-size: 15px; font-weight: 800; color: var(--muted); cursor: pointer; letter-spacing: -.01em; }
.view-switch button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.board.max .view-switch { background: var(--surface); box-shadow: var(--shadow); }
.board.max .view-switch button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.backlog { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
.bl-hint { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
.bl-note { font-weight: 600; color: var(--accent); } .bl-note.warn { color: var(--st-blocked); }
.bl-head { display: flex; gap: 8px; align-items: baseline; font-size: 15px; font-weight: 700; padding: 0 4px 6px; border-bottom: 1px solid var(--line); }
.bl-head b { color: var(--accent); } .bl-head .muted { font-size: 12.5px; font-weight: 500; margin-left: auto; }
.bl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.bl-row { display: grid; grid-template-columns: 18px 38px minmax(0, 1.6fr) minmax(0, .6fr) minmax(0, .7fr) 130px 104px; gap: 10px; align-items: center;

:root[data-style="notebook"] .kc.focus { box-shadow: inset 3px 0 0 var(--st), 0 0 0 2px var(--accent); }
:root[data-style="notebook"] .now,

:root[data-style="matrix"] .style-select,
:root[data-style="matrix"] .ms-filter button,

/* ---------------------------------------------------------------- style: comic
   Halftone paper, thick ink outlines with hard shadows, bold lettering, a speech bubble for the current task. */
:root[data-style="comic"] body,
:root[data-style="comic"] .board.max {
  background-color: var(--bg);

  background-size: 10px 10px;
}

:root[data-style="comic"] .drawer { border: 3px solid var(--ink); border-radius: 6px; box-shadow: 6px 6px 0 var(--ink); }
:root[data-style="comic"] .board.max { border: 0; border-radius: 0; box-shadow: none; }
:root[data-style="comic"] header.top h1,
:root[data-style="comic"] .f-name,
:root[data-style="comic"] .ms-title,
:root[data-style="comic"] .board-head .label,
:root[data-style="comic"] .col-head .t,
:root[data-style="comic"] .side .label,
:root[data-style="comic"] .now .t { font-family: var(--font-comic); font-weight: 400 !important; letter-spacing: .04em; text-transform: uppercase; }
:root[data-style="comic"] header.top h1 { font-size: 26px; }

  border: 2.5px solid var(--ink); border-radius: 4px;

}
:root[data-style="comic"] .col-head .t::before { width: 12px; height: 12px; border: 2px solid var(--ink); }

:root[data-style="comic"] .col-head .d { color: var(--ink); font-weight: 600; }
:root[data-style="comic"] .kc { border: 2.5px solid var(--ink); border-radius: 4px; box-shadow: 4px 4px 0 var(--ink); }
:root[data-style="comic"] .kc:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
:root[data-style="comic"] .kc.focus { box-shadow: 4px 4px 0 var(--accent); border-color: var(--accent); }
:root[data-style="comic"] .kc-name { font-weight: 800; }
:root[data-style="comic"] .kc-top .m { border: 1.5px solid var(--ink); }
:root[data-style="comic"] .now { position: relative; background: var(--surface); border: 3px solid var(--ink); border-radius: 26px; box-shadow: 4px 4px 0 var(--ink); margin-bottom: 18px; }
:root[data-style="comic"] .now::before,
:root[data-style="comic"] .now::after { content: ""; position: absolute; left: 46px; clip-path: polygon(0 0, 100% 0, 0 100%); }
:root[data-style="comic"] .now::before { bottom: -22px; width: 30px; height: 22px; background: var(--ink); }
:root[data-style="comic"] .now::after { bottom: -15px; left: 49.5px; width: 22px; height: 16px; background: var(--surface); }
:root[data-style="comic"] .board-now { background: var(--surface); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 3px 3px 0 var(--ink); }
:root[data-style="comic"] .now .tag { background: var(--st-progress); color: var(--ink); border: 2px solid var(--ink); text-transform: uppercase; font-family: var(--font-comic); font-size: 14px; letter-spacing: .05em; font-weight: 400; }
:root[data-style="comic"] .now.done .tag { background: var(--st-complete); }
:root[data-style="comic"] .pill { color: var(--ink); background: color-mix(in srgb, var(--st) 35%, var(--surface)); border: 2px solid var(--ink); text-transform: uppercase; font-weight: 800; }
:root[data-style="comic"] .bar,
:root[data-style="comic"] .seg { background: var(--surface); border: 2px solid var(--ink); height: 14px; }
:root[data-style="comic"] .segs { height: 16px; }
:root[data-style="comic"] .bar > span,
:root[data-style="comic"] .seg > span { background-image: radial-gradient(rgba(255, 255, 255, .45) 1.2px, transparent 1.5px); background-size: 5px 5px; }
:root[data-style="comic"] .box { border: 2.5px solid var(--ink); border-radius: 4px; }
:root[data-style="comic"] .task.done .box { background: var(--st-complete); border-color: var(--ink); }
:root[data-style="comic"] .task.done .box::after { border-color: var(--ink); }
:root[data-style="comic"] .task.cur { background: color-mix(in srgb, var(--st-progress) 22%, transparent); box-shadow: inset 0 0 0 2px var(--ink); }
:root[data-style="comic"] details.group.current { background: transparent; }
:root[data-style="comic"] .tab { border: 2px solid transparent; font-weight: 800; }
:root[data-style="comic"] .tab[aria-selected="true"] { background: var(--accent); color: var(--surface); border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
:root[data-style="comic"] .btn,
:root[data-style="comic"] .style-select,
:root[data-style="comic"] .ms-filter button,
:root[data-style="comic"] .live > span,
:root[data-style="comic"] .board-live { background: var(--surface); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); font-weight: 700; }
:root[data-style="comic"] .ms-filter button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
:root[data-style="comic"] .ms-filter button[aria-pressed="true"] b { color: var(--surface); }
:root[data-style="comic"] details.group > summary .num { border: 2px solid var(--ink); }

/* ---------------------------------------------------------------- style: terminal
   Retro CRT: green phosphor with a soft glow, scanlines, monospace, a blinking cursor on the current task. */
:root[data-style="terminal"] body { text-shadow: 0 0 3px color-mix(in srgb, var(--ink) 45%, transparent); }
:root[data-style="terminal"] body::after {
  content: ""; position: fixed; inset: 0; z-index: 100; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0, 0, 0, .45));
}
:root[data-style="terminal"] header.top h1,
:root[data-style="terminal"] .f-name,
:root[data-style="terminal"] .ms-title,
:root[data-style="terminal"] .board-head .label,
:root[data-style="terminal"] .col-head .t,
:root[data-style="terminal"] .side .label,
:root[data-style="terminal"] .now .t { font-family: var(--font-crt); font-weight: 400 !important; letter-spacing: .02em; }
:root[data-style="terminal"] header.top h1 { font-size: 26px; }
:root[data-style="terminal"] .f-name { font-size: 38px; }

:root[data-style="terminal"] .ms-title { font-size: 24px; }
:root[data-style="terminal"] .board-head .label { font-size: 28px; }
:root[data-style="terminal"] .side .label { font-size: 22px !important; color: var(--ink); }
:root[data-style="terminal"] .col-head .t { font-size: 22px; text-transform: uppercase; }
:root[data-style="terminal"] .now .t { font-size: 22px; }
:root[data-style="terminal"] .now .t::after { content: "▋"; margin-left: 4px; color: var(--ink); animation: t-blink 1.1s steps(1) infinite; }
@keyframes t-blink { 50% { opacity: 0; } }
:root[data-style="terminal"] .panel,
:root[data-style="terminal"] .drawer { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 0 18px -6px color-mix(in srgb, var(--ink) 30%, transparent); }
:root[data-style="terminal"] .board.max { border: 0; box-shadow: none; background: var(--bg); }
:root[data-style="terminal"] .col { background: transparent; border: 1px solid var(--line); }
:root[data-style="terminal"] .col-head .t::before { border-radius: 0; }
:root[data-style="terminal"] .kc { background: transparent; border: 1px dashed color-mix(in srgb, var(--st) 75%, transparent); }
:root[data-style="terminal"] .kc:hover { transform: none; background: color-mix(in srgb, var(--st) 9%, transparent); }
:root[data-style="terminal"] .kc.focus { border-style: solid; border-color: var(--accent); box-shadow: 0 0 10px -2px color-mix(in srgb, var(--accent) 60%, transparent); }
:root[data-style="terminal"] .kc-top .m { background: transparent; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
:root[data-style="terminal"] .now,
:root[data-style="terminal"] .board-now { background: transparent; border: 1px solid var(--st-progress); }
:root[data-style="terminal"] .now.done { border-color: var(--st-complete); }
:root[data-style="terminal"] .now .tag { background: var(--st-progress); color: var(--bg); text-shadow: none; }
:root[data-style="terminal"] .now.done .tag { background: var(--st-complete); }
:root[data-style="terminal"] .pill { background: transparent; padding: 0; }
:root[data-style="terminal"] .pill::before { content: "["; }
:root[data-style="terminal"] .pill::after { content: "]"; }
:root[data-style="terminal"] .bar,
:root[data-style="terminal"] .seg { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

:root[data-style="terminal"] .seg > span { background-image: repeating-linear-gradient(90deg, transparent 0 6px, var(--surface) 6px 8px); }
:root[data-style="terminal"] .box { border-radius: 0; border: 1.5px solid var(--ink); }
:root[data-style="terminal"] .task.done .box { background: var(--ink); border-color: var(--ink); }
:root[data-style="terminal"] .task.done .box::after { border-color: var(--bg); }
:root[data-style="terminal"] .task.cur { background: color-mix(in srgb, var(--st-progress) 12%, transparent); }
:root[data-style="terminal"] details.group.current { background: transparent; }
:root[data-style="terminal"] .tab[aria-selected="true"],
:root[data-style="terminal"] .ms-filter button[aria-pressed="true"] { background: var(--ink); color: var(--bg); text-shadow: none; }
:root[data-style="terminal"] .ms-filter button[aria-pressed="true"] b { color: var(--bg); }
:root[data-style="terminal"] .btn,
:root[data-style="terminal"] .style-select,
:root[data-style="terminal"] .ms-filter button,
:root[data-style="terminal"] .live > span,
:root[data-style="terminal"] .board-live,
:root[data-style="terminal"] .tab,
:root[data-style="terminal"] .eyebrow .switch button { background: transparent; border: 1px solid var(--line); border-radius: 0; color: var(--ink); }

:root[data-style="terminal"] details.group > summary .num,

[hidden] { display: none !important; }
.live > span:empty { display: none; }

/* discovering projects to onboard */
.disc { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.disc-form { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.disc-form input[type="text"], .disc-form #disc-path { flex: 1 1 320px; max-width: 560px; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; }
.disc .btn.primary, .ov-parked .btn.primary, .agent-panel .sc-decide .btn.primary { background: var(--accent) !important; color: var(--bg) !important; border-color: var(--accent) !important; font-weight: 700; }
.disc-toggle { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.disc-note { font-size: 12.5px; color: var(--muted); } .disc-note.warn { color: var(--st-blocked); font-weight: 600; }
.disc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.disc-row { display: flex; gap: 14px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; }
.disc-row.skipped { opacity: .55; } .disc-row.picked { box-shadow: inset 4px 0 0 var(--accent); }
.disc-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.disc-name { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 15px; }
.disc-chip { font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 6px; }
.disc-chip.os { color: var(--st-complete); }
.disc-about { font-size: 13px; color: var(--muted); }
.disc-path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-row { padding-bottom: 6px; }
.xp-toggle[aria-pressed="true"] { font-weight: 700; }
.np-expert-fold { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 6px 10px; margin: 2px 0 8px; }
.np-expert { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 2px 0 8px; max-height: 42vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.xp-h { font-size: 12px; font-weight: 700; margin-bottom: 4px; } .xp-h .muted { font-weight: 400; }
.xp-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.xp-chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
.xp-chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); font-weight: 600; }
.xp-add { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 12px; color: var(--ink); width: 90px; }
.xp-add:focus { width: 180px; outline: 2px solid var(--accent); outline-offset: 0; }
.np-parent { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0; }
.np-parent input, .np-create input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.np-parent input[readonly] { opacity: .7; }
.np-create { margin: 4px 0 6px; } .np-create code { font-size: 12px; } .np-create input { max-width: 200px; }
#sc-title { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sc-path { font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; letter-spacing: 0; }
.disc-state { font-size: 12.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.disc-ok { color: var(--st-complete); font-weight: 700; } .disc-err { color: var(--st-blocked); font-weight: 700; } .disc-run { color: var(--st-progress); display: inline-flex; gap: 6px; align-items: center; }
.disc-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; flex: none; }
@media (max-width: 760px) { .disc-row { flex-direction: column; align-items: stretch; } .disc-actions { justify-content: flex-start; } }
/* projects overview (several projects) */
.overview { padding-block: 16px 36px; display: flex; flex-direction: column; gap: 16px; }
.ov-head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.ov-head .label { font-size: 22px; color: var(--ink); font-weight: 800; letter-spacing: -.02em; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
.ov-card { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; color: inherit; text-decoration: none; min-width: 0; transition: box-shadow .15s, transform .15s; }
.ov-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.ov-card.fresh { animation: moved 3s ease-out; }

/* ---------------------------------------------------------------- style: clay
   Calm and warm, in the spirit of Claude's apps without copying them: ivory paper and warm charcoal, a terracotta
   accent, serif headings, quiet hairline borders; in the chat your messages sit in a soft bubble and answers read
   as plain serif text. */

<body>
<header class="top">
  <div class="wrap">
    <h1 id="title">OpenSpec <span>progress</span></h1>
    <div class="live">
      <select id="project" class="style-select" aria-label="Project" title="Project" hidden></select>
      <span id="conn"><span class="dot"></span>connecting…</span>
      <span id="cli"></span>
      <select id="style" class="style-select" aria-label="Style" title="Visual style">
        <option value="flat">Flat</option><option value="glass">Glass</option><option value="clay">Clay</option><option value="paper">Paper</option><option value="whiteboard">Whiteboard</option><option value="blackboard">Blackboard</option><option value="notebook">Notebook</option><option value="matrix">Matrix</option><option value="terminal">Terminal</option><option value="comic">Comic</option>
      </select>
      <button class="btn" id="agent-btn" type="button" data-chat-btn aria-controls="agent" hidden>Chat</button>
      <button class="btn" id="theme" type="button" aria-label="Toggle light or dark theme">◐</button>
      <button class="btn" id="git-btn" type="button" aria-label="Git history" aria-controls="githist" title="Git history: the commits, branches and tags, and what each commit changed" hidden>⎇</button>
      <button class="btn" id="settings-btn" type="button" aria-label="Settings" title="Settings: local models and Podman" hidden>⚙</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="overview" id="overview" aria-live="polite" hidden></section>
  <div class="main">
    <article class="panel" id="focus" aria-live="polite"></article>
    <div class="side">
      <section class="panel" id="milestone"></section>
      <section class="panel"><div class="label" style="font-size:15px;color:var(--ink);font-weight:800">Activity</div><ul class="feed" id="feed"></ul><div id="burn"></div></section>
    </div>
  </div>
  <section class="panel board" id="board"></section>
</div>
<dialog class="set-dialog" id="settings" aria-labelledby="set-title"></dialog>
<dialog class="set-dialog pd-dialog" id="propose" aria-labelledby="pd-title"></dialog>
<dialog class="set-dialog onb-dialog" id="onbdlg" aria-labelledby="onb-title"></dialog>
<aside class="drawer agent-panel" id="agent" aria-label="Agent" hidden></aside>
<aside class="drawer agent-panel gh-panel" id="githist" aria-label="Git history" hidden></aside>

<script>
const STATUS = {
  'archived':    { label: 'Archived',    v: '--st-archived' },
  'complete':    { label: 'Tasks done',  v: '--st-complete' },
  'in-progress': { label: 'In progress', v: '--st-progress' },
  'specified':   { label: 'Specified',   v: '--st-specified' },
  'proposed':    { label: 'Proposed',    v: '--st-proposed' },
  'missing':     { label: 'Missing',     v: '--st-missing' },
  'parking':     { label: 'Parking lot', v: '--st-proposed' },
  'idea':        { label: 'Idea',        v: '--st-proposed' },
};
const ui = { boardView: 'board', drag: null, pendingBoard: false, blMoved: null, lastPick: null, boardFocus: false, state: null, pinned: null, tab: 'tasks', open: new Map(), fileCache: new Map(), fresh: new Set(), prevCol: new Map(), ms: '', boardMax: false, drawer: null, drawerScroll: 0, colScroll: new Map() };
try { const t = localStorage.getItem('osd-theme'); if (t) document.documentElement.dataset.theme = t; ui.ms = localStorage.getItem('osd-ms') || ''; ui.boardFocus = localStorage.getItem('osd-board-focus') === '1'; ui.boardView = ['backlog', 'charts'].includes(localStorage.getItem('osd-board-view')) ? localStorage.getItem('osd-board-view') : 'board'; } catch {}
// visual style: flat (default) or glass; ?style=glass overrides the remembered choice
const STYLES = ['flat', 'glass', 'clay', 'paper', 'whiteboard', 'blackboard', 'notebook', 'matrix', 'terminal', 'comic'];
// Matrix style: falling code on a canvas behind the page; only exists while that style is active.
let rain = null;
function setRain(on) {
  if (!on) {
    if (rain) { cancelAnimationFrame(rain.raf); removeEventListener('resize', rain.resize); rain.canvas.remove(); rain = null; }
    return;
  }
  if (rain || !document.body) return;
  const canvas = document.createElement('canvas');
  canvas.id = 'matrix-rain'; canvas.setAttribute('aria-hidden', 'true');
  document.body.prepend(canvas);
  const ctx = canvas.getContext('2d');
  const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワ0123456789<>{}=+*';
  const size = 16;
  let w = 0, h = 0, drops = [];
  const resize = () => {
    w = canvas.width = innerWidth; h = canvas.height = innerHeight;
    drops = Array.from({ length: Math.ceil(w / size) }, () => Math.floor(Math.random() * h / size));
  };
  const step = () => {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#00ff66'; ctx.font = size + 'px monospace';
    drops.forEach((y, i) => {
      ctx.fillText(glyphs[Math.floor(Math.random() * glyphs.length)], i * size, y * size);
      drops[i] = y * size > h && Math.random() > 0.975 ? 0 : y + 1;
    });
  };
  rain = { canvas, raf: 0, resize };
  resize(); addEventListener('resize', resize);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { for (let k = 0; k < 90; k++) step(); return; }
  let last = 0;
  const loop = (t) => { rain.raf = requestAnimationFrame(loop); if (t - last < 55) return; last = t; step(); };
  rain.raf = requestAnimationFrame(loop);
}
function applyStyle(name) {
  const st = STYLES.includes(name) ? name : 'flat';
  setRain(st === 'matrix');
  if (st === 'flat') delete document.documentElement.dataset.style; else document.documentElement.dataset.style = st;
  const b = document.getElementById('style');
  if (b) b.value = st;
  return st;
}
{
  // ?theme=light|dark overrides the remembered light/dark choice (links, screenshots)
  const qt = new URLSearchParams(location.search).get('theme');
  if (qt === 'light' || qt === 'dark') document.documentElement.dataset.theme = qt;
  let st = new URLSearchParams(location.search).get('style');
  if (!st) { try { st = localStorage.getItem('osd-style'); } catch {} }
  applyStyle(st);
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// [text](url): web links open in a new tab; project paths show the text, the path is the tooltip
const link = (_, text, url) => /^https?:\/\//.test(url) ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>` : `<span class="ref" title="${url}">${text}</span>`;
const inline = (s) => esc(s).replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, link).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');
const isTicket = (c) => c.status !== 'parking' && c.status !== 'idea'; // ideas are not planned yet
const stVar = (s) => `var(${STATUS[s]?.v ?? '--st-proposed'})`;
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
// add-due-dates -> Add due dates (the slug stays visible where it matters)
const title = (slug) => { const t = String(slug).replace(/[-_]+/g, ' ').replace(/\bmcp\b/gi, 'MCP').replace(/\bapi\b/gi, 'API').replace(/\bpostgresql\b/gi, 'PostgreSQL').replace(/\bpoc\b/gi, 'PoC').replace(/\bcqrs\b/gi, 'CQRS').replace(/^setup /, 'Set up '); return t.charAt(0).toUpperCase() + t.slice(1); };
const isDone = (c) => c.status === 'archived' || c.status === 'complete';
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(t) {
  if (!t) return '—';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(t).toLocaleDateString();
}

function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0, list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { closeList(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); const n = Math.min(4, h[1].length); out += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      closeList();
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      let t = '<div class="tbl"><table><thead><tr>' + cells(l).map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { t += '<tr>' + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++; }
      out += t + '</tbody></table></div>'; continue;
    }
    const li = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const kind = /\d/.test(li[2]) ? 'ol' : 'ul';
      if (list !== kind) { closeList(); out += kind === 'ol' ? `<ol start="${parseInt(li[2], 10)}">` : `<${kind}>`; list = kind; } // a nested list must not restart the numbering
      let text = li[3];
      const cb = text.match(/^\[([ xX])\]\s+(.*)$/);
      if (cb) text = (cb[1] === ' ' ? '☐ ' : '☑ ') + cb[2];
      while (i + 1 < lines.length && /^\s{2,}\S/.test(lines[i + 1]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i + 1])) text += ' ' + lines[++i].trim();
      out += `<li style="margin-left:${Math.min(3, Math.floor(li[1].length / 2))}em">${inline(text)}</li>`; i++; continue;
    }
    if (!l.trim()) { closeList(); i++; continue; }
    closeList();
    const buf = [l];
    while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#|```|\s*([-*]|\d+\.)\s|\|)/.test(lines[i + 1])) buf.push(lines[++i]);
    out += `<p>${inline(buf.join(' '))}</p>`; i++;
  }
  closeList();
  return out;
}
async function loadFile(f) {
  const hit = ui.fileCache.get(f.path);
  if (hit && hit.mtime === f.mtime) return hit.text;
  const r = await fetch(withProject('/api/file?path=' + encodeURIComponent(f.path)));
  const text = r.ok ? await r.text() : `Could not load ${f.path} (${r.status}).`;
  ui.fileCache.set(f.path, { mtime: f.mtime, text });
  return text;
}

// ------------------------------------------------------------ what is "current"
// Active = changes with work in them that are not archived: in progress, tasks done (awaiting archive),
// or specified (elaborated, nothing checked yet). Most recently touched first.
function activeChanges(s) {
  const rank = { 'in-progress': 0, 'complete': 1, 'specified': 2 };
  return s.changes.filter((c) => c.status in rank)
    .sort((a, b) => rank[a.status] - rank[b.status] || (b.lastModified ?? 0) - (a.lastModified ?? 0));
}
function currentChange(s) {
  return activeChanges(s)[0] ?? s.changes.find((c) => c.name === s.nextUp) ?? s.changes[0];
}
function currentTask(c) {
  for (const g of c.tasks?.groups ?? []) for (const i of g.items) if (!i.done) return { g, i };
  return null;
}

// ------------------------------------------------------------ render: focus
async function renderFocus(s, el = $('focus'), forced = null) {
  const inDrawer = forced !== null;
  const auto = currentChange(s);
  const c = (inDrawer && s.changes.find((x) => x.name === forced)) || (ui.pinned && s.changes.find((x) => x.name === ui.pinned)) || auto;
  if (!c) { el.innerHTML = '<div class="focus-head">No changes found.</div>'; return; }
  const active = activeChanges(s);
  const pinnedAway = !inDrawer && c.name !== auto?.name;
  const cur = currentTask(c);
  const t = c.tasks;
  const lastDone = s.events.find((e) => e.change === c.name && e.kind === 'task-done');

  let eyebrow;
  if (pinnedAway) eyebrow = 'Viewing';
  else if (c.status === 'in-progress') eyebrow = 'Working on';
  else if (c.status === 'complete') eyebrow = 'Ready to archive';
  else if (c.status === 'specified') eyebrow = 'Up next · planned and ready';
  else eyebrow = 'Up next';

  let now = '';
  if (t && cur) {
    now = `<div class="now"><span class="tag">${c.status === 'in-progress' ? 'Now' : 'First'}</span>
      <div class="t"><span class="tid">${esc(cur.i.id)}</span>${inline(cur.i.text)}</div>
      ${cur.i.verify ? `<div class="v"><b>verify</b>${inline(cur.i.verify)}</div>` : ''}
      <div class="pulse">
        <span>${esc(cur.g.title)} · ${cur.g.done}/${cur.g.total}</span>
        ${lastDone ? `<span>last check-off ${ago(lastDone.t)}</span>` : ''}
        ${s.workspace?.recent?.[0] ? `<span>last file write ${ago(s.workspace.recent[0].mtime)}</span>` : ''}
        ${AGENT_TOKEN ? `<button class="link" type="button" data-agent="${esc(c.name)}" data-agent-mode="ask" data-agent-draft="${esc(`About task ${cur.i.id} (${cur.i.text}): `)}">Ask about this task</button>` : ''}
      </div></div>`;
  } else if (t && !cur) {
    now = `<div class="now done"><span class="tag">Done</span><div class="t">Nice, all ${t.total} tasks are checked.</div>
      <div class="v">${c.status === 'archived' ? `Archived ${esc(c.archivedAt ?? '')}.` : 'Last step: <code>openspec archive ' + esc(c.name) + '</code> moves it into the specs.'}</div></div>`;
  } else {
    const blocked = c.blockedBy.length ? `Waits for ${c.blockedBy.map((o) => '#' + o).join(', ')}. ` : '';
    now = `<div class="now"><span class="tag">Next</span><div class="t">Not planned in detail yet</div>
      <div class="v">${blocked}Only the proposal exists; design, spec deltas and tasks come when the change is picked up.</div></div>`;
  }

  const tabs = [
    ['tasks', t ? 'Tasks' : 'Tasks', !!t],
    ['proposal', 'Proposal', c.artifacts.proposal],
    ['design', 'Design', c.artifacts.design],
    ['specs', `Spec deltas${c.specs.files.length ? ' · ' + c.specs.requirements + ' req' : ''}`, c.specs.files.length > 0],
    ['validation', c.validation ? (c.validation.valid ? 'Validation ✓' : `Validation · ${c.validation.issues.length}`) : 'Validation', true],
  ];
  let tab = ui.tab;
  if (!tabs.find(([k, , ok]) => k === tab && ok)) tab = tabs.find(([, , ok]) => ok)[0];

  let body = '';
  if (tab === 'tasks') {
    body = t.groups.map((g, gi) => {
      const complete = g.done === g.total;
      const isCur = cur && cur.g === g;
      const key = c.name + '|' + gi;
      const open = ui.open.has(key) ? ui.open.get(key) : !complete;
      return `<details class="group ${complete ? 'complete' : ''} ${isCur ? 'current' : ''}" data-key="${esc(key)}" ${open ? 'open' : ''}>
        <summary><span class="chev">▶</span><span>${complete ? '✓ ' : ''}${inline(g.title)}</span><span class="num">${g.done}/${g.total}</span></summary>
        <div class="tasks">${g.items.map((i) => `<div class="task ${i.done ? 'done' : ''} ${cur && cur.i === i ? 'cur' : ''} ${ui.fresh.has(c.name + '|' + i.id) ? 'fresh' : ''}">
          <span class="box"></span><span class="tid">${esc(i.id)}</span><span class="txt">${inline(i.text)}</span>${i.verify && !i.done ? `<span class="ver">verify: ${inline(i.verify)}</span>` : ''}</div>`).join('')}</div>
      </details>`;
    }).join('') || '<div class="empty">tasks.md has no checkboxes.</div>';
  } else if (tab === 'proposal' || tab === 'design') {
    const f = c.files.find((x) => x.name === tab + '.md');
    body = f ? `<div class="md">${md(await loadFile(f))}</div>` : '<div class="empty">Not written yet.</div>';
  } else if (tab === 'specs') {
    const texts = await Promise.all(c.specs.files.map((sf) => { const f = c.files.find((x) => x.path === sf.path); return f ? loadFile(f) : ''; }));
    body = c.specs.files.map((sf, k) => `<div class="label" style="margin:${k ? 22 : 0}px 0 6px;color:var(--accent)">${esc(sf.capability)} · ${sf.requirements} requirements · ${sf.scenarios} scenarios</div><div class="md">${md(texts[k])}</div>`).join('');
  } else {

  const scroll = inDrawer ? ui.drawerScroll : window.scrollY;
  if (!el.isConnected) return;
  el.innerHTML = `
    <div class="focus-head">
      <div class="eyebrow">
        <span class="label" style="color:${pinnedAway ? 'var(--muted)' : stVar(c.status)}">${eyebrow}</span>
        ${!inDrawer && active.length > 1 ? `<span class="switch">${active.map((a) => `<button type="button" data-pick="${esc(a.name)}" aria-pressed="${a.name === c.name}" title="${esc(a.name)} · ${STATUS[a.status].label}">${a.inRoadmap ? '#' + a.order : esc(a.name)}</button>`).join('')}</span>` : ''}

        ${AGENT_TOKEN && c.status !== 'archived' ? `<button class="btn ag-open" type="button" data-agent="${esc(c.name)}" title="Ask about this ticket or start a session on it">Agent…</button>` : ''}
        ${inDrawer ? '<button class="link back" type="button" data-close-drawer>Close ✕</button>' : ''}
      </div>
      <h2 class="f-name">${esc(title(c.name))}</h2>
      <div class="slug">${esc(c.name)}</div>
      <div class="f-meta">
        <span class="pill" style="--st:${stVar(c.status)}">${STATUS[c.status].label}</span>
        ${c.inRoadmap ? `<span class="mono">#${c.order}</span>` : '<span>not in roadmap.md</span>'}<span>${esc(c.context)}</span>${c.milestone ? `<span>${esc(c.milestone)}</span>` : ''}
        ${c.validation ? (c.validation.valid ? '<span style="color:var(--st-complete)">✓ valid</span>' : `<span style="color:${c.status === 'proposed' ? 'var(--muted)' : 'var(--st-blocked)'}">✕ validation</span>`) : ''}
        <span>changed ${ago(c.lastModified)}</span>
      </div>
      <div class="f-goal">${inline(c.goal)}</div>
      ${t ? `<div class="progress">
        <div class="count num">${t.done}<small> / ${t.total}</small></div>
        <div class="segs">${t.groups.map((g) => `<div class="seg ${cur && cur.g === g ? 'cur' : ''}" style="--n:${g.total}" title="${esc(g.title)} ${g.done}/${g.total}"><span style="width:${pct(g.done, g.total)}%"></span></div>`).join('')}</div>
        <div class="muted num" style="font-size:12px">${pct(t.done, t.total)}% tasks</div>
        <div class="seg-labels">${t.groups.map((g) => `<span class="${cur && cur.g === g ? 'cur' : ''}" style="--n:${g.total}" title="${esc(g.title)}">${esc(g.title.replace(/^\d+\.\s*/, ''))}</span>`).join('')}</div>
      </div>` : ''}
    </div>
    ${now}

    <div class="f-body">${body}${AGENT_TOKEN ? icHtml(c, tab) : ''}</div>`;
  icRestore(el);
  edFill();
  if (inDrawer) el.scrollTop = scroll; else if (!ui.boardMax) window.scrollTo(0, scroll);
}

// ---- inline chat under a tab: a question about this part of the change goes to the assistant (read-only, it
// remembers the conversation), with the context in front: [About the design of the change x: <files>] question.
// The exchanges about this tab show right here; "Continue in chat" opens the whole conversation.
const IC_LABEL = { tasks: 'tasks', proposal: 'proposal', design: 'design', specs: 'spec deltas', validation: 'validation result' };
const IC_RE = /^\[About the (.+?) of the change ([\w.-]+)(?:: [^\]]*)?\] ([\s\S]*)$/;
ui.icDrafts = new Map();
function icTag(c, tab) {
  const f = (n) => c.files.find((x) => x.name === n)?.path;
  const cur = currentTask(c);
  const where = tab === 'tasks' ? `${f('tasks.md') ?? `openspec/changes/${c.name}/tasks.md`}${cur ? `; current task ${cur.i.id} ${cur.i.text}` : ''}`
    : tab === 'proposal' ? f('proposal.md') ?? '' : tab === 'design' ? f('design.md') ?? ''
    : tab === 'specs' ? c.specs.files.map((x) => x.path).join(', ')
    : `openspec validate ${c.name}${c.validation ? (c.validation.valid ? ' passes' : ` reports ${c.validation.issues.length} issues`) : ''}`;
  return `[About the ${IC_LABEL[tab]} of the change ${c.name}${where ? `: ${where.replace(/[\]\n]/g, ' ')}` : ''}]`;
}
function icExchanges(c, tab) {
  const chats = groupBySession((ag.view?.jobs ?? []).filter((j) => j.kind === 'chat' && (j.mode ?? 'assistant') === 'assistant'));
  const conv = chats.at(-1);
  if (!conv) return { list: [], running: false };
  const prefix = `[About the ${IC_LABEL[tab]} of the change ${c.name}`;
  const list = [];
  let cur = null;
  for (const j of conv.jobs) for (const l of j.log) {
    if (l.kind === 'user') { cur = l.text.startsWith(prefix) ? { q: (l.text.match(IC_RE)?.[3] ?? l.text).replace(/^Please propose an updated version of \S+? that does this: ([\s\S]*?)(?: Take what we discussed about [^.]* into account\.)? Write the complete new content[\s\S]*$/, (_, what) => `✎ Propose an update: ${what.replace(/\.$/, '')}`), t: l.t, a: [], key: '' } : null; if (cur) list.push(cur); }
    else if (l.kind === 'text' && !l.sub && cur) { if (!cur.key) cur.key = `${j.id}:${l.t}`; cur.a.push(l.text); }
  }
  return { list: list.slice(-3), running: ['running', 'starting'].includes(conv.last?.status) };
}
function icThreadHtml(c, tab) {
  const { list, running } = icExchanges(c, tab);
  return list.map((e, i) => `<div class="ic-q"><span>${esc(e.q)}</span><time>${hhmm(e.t)}</time></div>${e.a.length ? `<div class="ic-a md">${e.a.map((a, k) => editMd(a, `${e.key}:${k}`)).join('')}</div>`
    : i === list.length - 1 && running ? '<div class="ic-a ic-wait"><span class="ag-spin"></span>thinking…</div>' : ''}`).join('');
}
function icHtml(c, tab) {
  const key = `${c.name}|${tab}`;
  return `<div class="ic" data-ic="${esc(key)}">
    <div class="ic-thread">${icThreadHtml(c, tab)}</div>
    <div class="ic-compose"><textarea class="ic-text" rows="1" placeholder="Ask about the ${esc(IC_LABEL[tab])} of ${esc(title(c.name))}…"></textarea><button class="btn" type="button" data-ic-send disabled>Ask</button>${icFiles(c, tab).length ? `<button class="btn" type="button" data-ic-propose title="Opens a dialog to ask Claude for an updated version of ${esc(icFiles(c, tab).join(', '))}; you see a diff and accept or reject it">✎ Propose update…</button>` : ''}</div>
    <div class="ic-note"><span class="ic-err"></span>Goes to the assistant with this context; it reads the project and changes nothing. Enter sends. <button class="link" type="button" data-chat="assistant">Continue in chat →</button></div>
  </div>`;
}
// the tab view is redrawn on every update: keep what is being typed, and the cursor
function icRestore(el) {
  for (const ta of el.querySelectorAll('.ic-text')) {
    const k = ta.closest('.ic').dataset.ic;
    ta.value = ui.icDrafts.get(k) ?? '';
    ta.closest('.ic').querySelector('[data-ic-send]').disabled = !ta.value.trim();
    if (ui.icFocus === k) { ta.focus({ preventScroll: true }); const p = Math.min(ui.icCaret ?? ta.value.length, ta.value.length); ta.setSelectionRange(p, p); }
  }
}
function icRefresh() { // new answers: only the threads, not the whole tab view
  for (const box of document.querySelectorAll('.ic')) {
    const [name, tab] = box.dataset.ic.split('|');
    const c = ui.state?.changes.find((x) => x.name === name);
    const th = box.querySelector('.ic-thread');
    if (c && th) { const html = icThreadHtml(c, tab); if (th.dataset.html !== html) { th.innerHTML = html; th.dataset.html = html; } }
  }
  edFill();
}
// the files a tab's update would touch
function icFiles(c, tab) {
  const f = (n) => c.files.find((x) => x.name === n)?.path;
  return (tab === 'tasks' ? [f('tasks.md')] : tab === 'proposal' ? [f('proposal.md')] : tab === 'design' ? [f('design.md')]
    : tab === 'specs' || tab === 'validation' ? c.specs.files.map((x) => x.path) : []).filter(Boolean);
}
// ---- "✎ Propose update…": a focused dialog for one tab of a change. It shows what the update is about (the change,
// the file and its current content), takes what should change (with suggestions), and shows Claude's proposal as a
// diff to accept or reject, right there.
const PD_CHIPS = {
  tasks: ['Split tasks that are too big, and give every task a precise verify criterion.', 'Add the tasks that are missing to cover every spec scenario.'],
  proposal: ['Make the Why and the scope sharper, and list what is out of scope.'],
  design: ['Add the risks and open questions that are missing.', 'Explain the main decisions with their alternatives.'],
  specs: ['Add missing scenarios, especially error and edge cases.', 'Make every requirement testable (SHALL/MUST, concrete values).'],
  validation: ['Fix the issues openspec validate reports.'],
};
const PD_REVIEW = 'Review it and improve what is unclear, inconsistent with the proposal or the specs, or missing; keep the scope and invent no new requirements.';
const pd = { c: null, tab: null, text: '', disc: true, sent: null, busy: false, err: '', current: '' };
async function openPropose(box) {
  const [name, tab] = box.dataset.ic.split('|');
  Object.assign(pd, { c: ui.state.changes.find((x) => x.name === name), tab, text: box.querySelector('.ic-text').value.trim(), disc: true, sent: null, busy: false, err: '', current: '' });
  $('propose').showModal();
  renderPropose();
  const f = pd.c.files.find((x) => x.path === icFiles(pd.c, tab)[0]);
  pd.current = f ? await loadFile(f) : '';
  renderPropose();
  $('pd-text')?.focus();
}
function pdAnswer() { // Claude's reply to the request sent from the dialog
  if (!pd.sent) return null;
  const conv = groupBySession((ag.view?.jobs ?? []).filter((j) => j.kind === 'chat' && (j.mode ?? 'assistant') === 'assistant')).at(-1);
  let found = false, key = null;
  const a = [];
  for (const j of conv?.jobs ?? []) for (const l of j.log) {
    if (l.kind === 'user') { if (found && a.length) break; found = l.text === pd.sent; }
    else if (found && l.kind === 'text' && !l.sub) { if (!key) key = `${j.id}:${l.t}`; a.push(l.text); }
  }
  return { a, key, running: ['running', 'starting'].includes(conv?.last?.status) };
}
function renderPropose() {
  const dlg = $('propose');
  if (!dlg.open || !pd.c) return;
  const { c, tab } = pd;
  const files = icFiles(c, tab);
  const discussed = icExchanges(c, tab).list.length;
  const ans = pdAnswer();
  const keepText = $('pd-text')?.value;
  dlg.innerHTML = `
    <div class="set-head"><h2 id="pd-title">✎ Propose an update</h2><button class="link" type="button" data-pd-close>Close ✕</button></div>
    <div class="pd-ctx"><b>${esc(title(c.name))}</b> · the ${esc(IC_LABEL[tab])} · ${files.map((f) => `<code>${esc(f)}</code>`).join(' ')}</div>
    ${tab === 'validation' && c.validation && !c.validation.valid ? `<div class="pd-issues">${c.validation.issues.map((i) => `<div><b>${esc(i.level)}</b> ${esc(i.message)}</div>`).join('')}</div>` : ''}
    <details class="pd-cur" ${pd.sent ? '' : 'open'}><summary>Current content${files.length > 1 ? ` of ${esc(files[0].split('/').slice(-2).join('/'))}` : ''}</summary><div class="md">${pd.current ? md(pd.current) : '<span class="muted">Loading…</span>'}</div></details>
    ${pd.sent ? '' : `
    <label class="pd-what">What should change?<textarea id="pd-text" rows="3" placeholder="e.g. ${esc((PD_CHIPS[tab] ?? [PD_REVIEW])[0])}">${esc(keepText ?? pd.text)}</textarea></label>
    <div class="pd-chips"><span class="muted">Suggestions:</span>${[...(PD_CHIPS[tab] ?? []), PD_REVIEW].map((t) => `<button type="button" class="chip" data-pd-chip="${esc(t)}" title="${esc(t)}">${esc(t.split(/[,;:]/)[0].replace(/\.$/, ''))}</button>`).join('')}</div>
    ${discussed ? `<label class="set-check pd-disc"><input type="checkbox" data-pd-disc ${pd.disc ? 'checked' : ''}> Take what we discussed about the ${esc(IC_LABEL[tab])} into account (${discussed} exchange${discussed > 1 ? 's' : ''} below the tab)</label>` : ''}
    <div class="set-actions"><button class="btn primary" type="button" data-pd-go disabled>Propose</button><button class="btn" type="button" data-pd-close>Cancel</button><span class="set-note warn">${esc(pd.err)}</span></div>`}
    ${pd.sent ? `<div class="pd-result">${ans?.a.length ? `<div class="md">${ans.a.map((t, k) => editMd(t, `${ans.key}:${k}`)).join('')}</div>` : ans?.running || pd.busy ? '<div class="ag-note"><span class="ag-spin"></span> Claude is writing the proposal…</div>' : ''}</div>
      <div class="set-actions"><button class="btn" type="button" data-pd-again>Another proposal</button><button class="btn" type="button" data-pd-close>Close</button></div>` : ''}`;
  const ta = $('pd-text');
  if (ta) dlg.querySelector('[data-pd-go]').disabled = !ta.value.trim() || pd.busy;
  edFill();
}
async function pdGo() {
  const text = $('pd-text').value.trim();
  if (!text) return;
  const { c, tab } = pd;
  const disc = icExchanges(c, tab).list.length && pd.disc;
  const req = `${icTag(c, tab)} Please propose an updated version of ${icFiles(c, tab).join(', ')} that does this: ${text}${tab === 'validation' ? ' The goal is that openspec validate passes.' : ''}${disc ? ` Take what we discussed about the ${IC_LABEL[tab]} into account.` : ''} Write the complete new content in a fenced block whose info string is "edit" and the path (four backticks if the content contains three), one block per changed file, and say in one or two sentences what changed.`;
  pd.busy = true; pd.err = ''; renderPropose();
  try { await agentPost('chat', { text: req, mode: 'assistant' }); pd.sent = req; pd.text = text; }
  catch (e) { pd.err = '✕ ' + e.message; }
  pd.busy = false; renderPropose();
}
$('propose').addEventListener('input', (e) => { if (e.target.id === 'pd-text') $('propose').querySelector('[data-pd-go]').disabled = !e.target.value.trim(); });
$('propose').addEventListener('change', (e) => { if (e.target.matches('[data-pd-disc]')) pd.disc = e.target.checked; });
$('propose').addEventListener('keydown', (e) => { if (e.target.id === 'pd-text' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); pdGo(); } });
$('propose').addEventListener('click', (e) => {
  const t = e.target;
  if (t === $('propose') || t.closest('[data-pd-close]')) return $('propose').close();
  const chip = t.closest('[data-pd-chip]');
  if (chip) { const ta = $('pd-text'); ta.value = chip.dataset.pdChip; ta.dispatchEvent(new Event('input', { bubbles: true })); return ta.focus(); }
  if (t.closest('[data-pd-go]')) return pdGo();
  if (t.closest('[data-pd-again]')) { pd.sent = null; return renderPropose(); }
});
async function icSend(box) {
  const ta = box.querySelector('.ic-text');
  const q = ta.value.trim();
  if (!q) return;
  const [name, tab] = box.dataset.ic.split('|');
  const c = ui.state.changes.find((x) => x.name === name);
  const text = `${icTag(c, tab)} ${q}`;
  try {
    await agentPost('chat', { text, mode: 'assistant' });
    ui.icDrafts.delete(box.dataset.ic); ta.value = ''; box.querySelector('[data-ic-send]').disabled = true; box.querySelector('.ic-err').textContent = '';
  } catch (e) { box.querySelector('.ic-err').textContent = `✕ ${e.message} `; }
}
document.addEventListener('focusin', (e) => { ui.icFocus = e.target.matches?.('.ic-text') ? e.target.closest('.ic').dataset.ic : null; });
document.addEventListener('input', (e) => {
  if (!e.target.matches?.('.ic-text')) return;
  ui.icDrafts.set(e.target.closest('.ic').dataset.ic, e.target.value);
  ui.icCaret = e.target.selectionStart;
  e.target.closest('.ic').querySelector('[data-ic-send]').disabled = !e.target.value.trim();
});
document.addEventListener('keyup', (e) => { if (e.target.matches?.('.ic-text')) ui.icCaret = e.target.selectionStart; });
document.addEventListener('keydown', (e) => {
  if (!e.target.matches?.('.ic-text') || e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault(); icSend(e.target.closest('.ic'));
});
document.addEventListener('click', (e) => {
  const b = e.target.closest?.('[data-ic-send], [data-ic-propose]');
  if (b) { e.stopPropagation(); return b.matches('[data-ic-propose]') ? openPropose(b.closest('.ic')) : icSend(b.closest('.ic')); }
}, true);

// ------------------------------------------------------------ render: side
function renderMilestone(s) {
  const focusName = ((ui.pinned && s.changes.find((x) => x.name === ui.pinned)) || currentChange(s))?.name;
  const msOf = s.milestones.map((m) => ({ m, cs: s.changes.filter((c) => c.milestone === m.id) }));
  const focusMs = s.changes.find((c) => c.name === focusName)?.milestone;
  const byFocus = msOf.findIndex((x) => x.m.id === focusMs);
  const idx = byFocus >= 0 ? byFocus : Math.max(0, msOf.findIndex((x) => x.cs.some((c) => !isDone(c))));
  const { m, cs } = msOf[idx] ?? { m: { id: '—', title: 'No milestones' }, cs: [] };
  const done = cs.filter(isDone).length;
  const next = msOf[idx + 1];
  const td = s.totals;
  $('milestone').innerHTML = `
    <div class="label">Current milestone</div>
    <div class="ms-title"><span>${esc(m.id)}</span>${esc(m.title)}</div>
    <div class="muted num" style="font-size:12.5px;margin:2px 0 8px">${done} of ${cs.length} changes done</div>
    <div class="bar">${cs.map((c) => `<span style="flex:1;background:${stVar(c.status)};opacity:${isDone(c) ? 1 : c.tasks ? .35 + .65 * (c.tasks.done / Math.max(1, c.tasks.total)) : .15};border-right:2px solid var(--surface)"></span>`).join('')}</div>
    <ul class="ms-list">${cs.map((c) => `<li><button type="button" data-pick="${esc(c.name)}" ${c.name === focusName ? 'style="font-weight:600"' : ''}>
      <span class="sw" style="--st:${stVar(c.status)}"></span><span class="n">${esc(title(c.name))}</span>
      <span class="s num">${c.tasks ? `${c.tasks.done}/${c.tasks.total}` : STATUS[c.status].label.toLowerCase()}</span></button></li>`).join('')}</ul>
    <div class="ms-next">${next ? `Then <b>${esc(next.m.id)}</b> ${esc(next.m.title)} · ${next.cs.length} changes` : 'Last milestone'}<br>
      Overall <span class="num">${s.changes.filter(isDone).length}/${s.changes.filter(isTicket).length}</span> changes · <span class="num">${td.done}/${td.total}</span> tasks written so far</div>`;
}

function renderFeed(s) {
  const name = (n) => `<button type="button" class="ch" data-pick="${esc(n)}">${esc(title(n))}</button>`;
  const items = s.events.slice(0, 40).map((e) => {
    let what;
    if (e.kind === 'task-done') what = `<span style="color:var(--st-complete)">✓</span> <span class="mono">${esc(e.task)}</span> ${inline(e.text)} <span class="muted">· ${name(e.change)}</span>`;
    else if (e.kind === 'task-reopened') what = `<span style="color:var(--st-progress)">↺</span> <span class="mono">${esc(e.task)}</span> ${inline(e.text)} <span class="muted">· ${name(e.change)}</span>`;
    else if (e.kind === 'status') what = `${name(e.change)} → <b style="color:${stVar(e.to)}">${STATUS[e.to]?.label ?? e.to}</b>`;
    else if (e.kind === 'added') what = `${name(e.change)} added`;
    else if (e.kind === 'scope') what = `${name(e.change)}: <b>+${e.to - e.from}</b> task${e.to - e.from === 1 ? '' : 's'} added after work started`;
    else what = `<span class="mono">${esc(e.change)}</span> removed`;
    return `<li><time title="${new Date(e.t).toLocaleString()}">${hhmm(e.t)}</time><span class="what">${what}</span></li>`;
  });
  $('feed').innerHTML = items.join('') || '<li><time></time><span class="what muted">Nothing yet. Checked-off tasks show up here as soon as they happen.</span></li>';
  const w = s.workspace;
  $('burn').innerHTML = burn(s) + (w?.recent?.length ? `<details class="files"><summary>${w.changedLast15m} files written in the last 15 min</summary><ul>${w.recent.slice(0, 10).map((f) => `<li><span class="p" title="${esc(f.path)}"><bdi>${esc(f.path)}</bdi></span><span>${ago(f.mtime)}</span></li>`).join('')}</ul></details>` : '');
}

// The result of `openspec validate` for a change, with what it covered (`openspec show`: the spec deltas).
function validationHtml(c, cli) {
  const v = c.validation;
  const errors = v.issues.filter((i) => i.level === 'ERROR').length;
  const head = v.valid
    ? `<div class="val-head ok">✓ <code>openspec validate ${esc(c.name)}</code> passes</div>`
    : `<div class="val-head bad">✕ <code>openspec validate ${esc(c.name)}</code> fails: ${errors} error${errors === 1 ? '' : 's'}</div>`;
  const issues = v.issues.map((i) => `<div class="issue ${esc(i.level)}"><b>${esc(i.level)}</b>${i.path && i.path !== 'file' ? `<span class="mono muted">${esc(i.path)}</span> ` : ''}${esc(i.message)}</div>`).join('');
  const d = c.deltas;
  const checked = d?.length ? `<div class="label" style="margin:14px 0 6px">What it checked: ${d.length} spec delta${d.length === 1 ? '' : 's'}, ${d.reduce((a, x) => a + x.scenarios, 0)} scenarios</div>
      <table class="val-table"><thead><tr><th>Delta</th><th>Capability</th><th>Requirement</th><th>Scenarios</th></tr></thead><tbody>${d.map((x) => `<tr><td><span class="op ${esc(x.op)}">${esc(x.op)}</span></td><td class="mono">${esc(x.spec)}</td><td>${esc(x.requirement ?? '—')}</td><td class="${x.scenarios ? '' : 'warn'}">${x.scenarios}</td></tr>`).join('')}</tbody></table>`
    : d ? '<div class="empty">No spec deltas: the change declares no behaviour change (or has not written its deltas yet).</div>' : '';
  const when = cli.lastRun ? `<div class="ag-note" style="margin-top:10px">Checked at ${hhmm(cli.lastRun)} · again when a file under <code>openspec/</code> changes. Validation checks the structure of the proposal and the spec deltas (every requirement with SHALL/MUST and at least one scenario); whether the code does what they say is for the tests and the review.</div>` : '';
  return head + issues + checked + when;
}
// Why a change has no validation result (yet): drafts and archived changes are not validated by the CLI at all.
function validationPending(c, cli) {
  if (c.location === 'backlog') return 'Nothing to validate yet: this is a draft in <code>openspec/backlog/</code>, not an OpenSpec change. <code>openspec validate</code> checks it once the change is created.';
  if (c.status === 'archived') return 'Archived: its spec deltas are part of <code>openspec/specs/</code> now; <code>openspec validate</code> only checks active changes.';
  if (!cli.available) return 'OpenSpec CLI disabled.';
  const secs = (t) => `${Math.max(1, Math.round((Date.now() - t) / 1000))} s`;
  if (cli.state === 'running') return `<span class="ag-spin"></span> <code>openspec validate</code> is running (for ${secs(cli.since)}).`;
  if (cli.state === 'queued') return `<span class="ag-spin"></span> Waiting for the OpenSpec CLI: its calls run one at a time across all projects (queued ${secs(cli.since)} ago).`;
  if (cli.error) return `✕ The OpenSpec CLI failed: ${esc(cli.error)}${cli.nextTry ? ` Next try at ${hhmm(cli.nextTry)}, or sooner when a file under <code>openspec/</code> changes.` : ''}`;
  if (cli.lastRun) return `Not in the result of <code>openspec validate --all</code> (${hhmm(cli.lastRun)}).`;
  return 'Waiting for the first run of the OpenSpec CLI…';
}

function burn(s) {
  const pts = s.series;
  if (pts.length < 2) return '';
  const W = 300, H = 90, L = 4, R = 24, T = 8, B = 16;
  const t0 = pts[0].t, t1 = Math.max(Date.now(), pts.at(-1).t);
  const maxY = Math.max(1, ...pts.map((p) => p.total));
  const x = (t) => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - v / maxY) * (H - T - B);
  const step = (k) => pts.reduce((d, p, i) => d + (i ? `H${x(p.t)}V${y(p[k])}` : `M${x(p.t)},${y(p[k])}`), '') + `H${x(t1)}`;
  const last = pts.at(-1);
  return `<div class="label" style="margin-top:14px">Tasks checked over time</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${last.done} of ${last.total} tasks done">
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <path d="${step('total')}" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${step('done')}V${y(0)}H${x(t0)}Z" fill="var(--st-complete)" fill-opacity=".14"/>
    <path d="${step('done')}" fill="none" stroke="var(--st-complete)" stroke-width="2"/>
    <circle cx="${x(t1)}" cy="${y(last.done)}" r="3" fill="var(--st-complete)"/>
    <text x="${x(t1) + 5}" y="${y(last.done) + 3.5}" style="fill:var(--ink);font-weight:600">${last.done}</text>
    <text x="${L}" y="${H - 3}">${hhmm(t0)}</text><text x="${W - R}" y="${H - 3}" text-anchor="end">now</text>
  </svg>`;
}

// Update an element in place to match new markup: nodes that stay the same are kept, only what differs changes.
// Replacing the whole board on every live update would recreate its scroll areas, which makes macOS flash their
// scroll bars and loses scroll positions. Elements with data-keep-children keep their content (drawn separately);
// an opened <details class="ch-data"> stays open.
function morphChildren(a, b) {
  const ac = [...a.childNodes], bc = [...b.childNodes];
  bc.forEach((n, i) => { if (i < ac.length) morphNode(ac[i], n); else a.appendChild(n); });
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}
function morphNode(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  const keepOpen = a.nodeName === 'DETAILS' && a.classList.contains('ch-data') && a.open;
  for (const { name } of [...a.attributes]) if (!b.hasAttribute(name) && !(keepOpen && name === 'open')) a.removeAttribute(name);
  for (const { name, value } of [...b.attributes]) if (a.getAttribute(name) !== value) a.setAttribute(name, value);
  if (!a.hasAttribute('data-keep-children')) morphChildren(a, b);
}
function morphHtml(el, html) {
  const t = document.createElement('template');
  t.innerHTML = html;
  morphChildren(el, t.content);
}

// ------------------------------------------------------------ render: board
// Columns are derived from the files (see README "Status rules"); the board is read-only on purpose.

  ['complete',    'Tasks done',  'Waiting for openspec archive',          '--st-complete'],

      <span class="board-actions">${AGENT_TOKEN ? '<button class="btn board-toggle" type="button" data-chat-btn aria-controls="agent">Chat</button>' : ''}

      <button class="btn board-toggle" type="button" data-max aria-pressed="${max}" title="${max ? 'Back to the dashboard (Esc)' : 'Show the board across the whole window'}">${max ? 'Exit full screen ✕' : '⤢ Full screen'}</button></span>
    </div>

      const cs = byCol[key];
      if (focus && !cs.length) return `<section class="col folded" style="--st:var(${v})" aria-label="${title}: none" title="${title}: none"><div class="col-head"><div class="t"><span class="num">0</span><span class="vt">${title}</span></div></div></section>`;
      return `<section class="col" style="--st:var(${v})" aria-label="${title}">
        <div class="col-head"><div class="t">${title}<span class="num">${cs.length}</span></div><div class="d">${desc}</div></div>

    </div>`);
  if (ui.boardView === 'charts') drawCharts(s);

  for (const el of board.querySelectorAll('[data-col]')) { const y = ui.colScroll.get(el.dataset.col) ?? 0; if (el.scrollTop !== y) el.scrollTop = y; }
  if (ui.blMoved) { const r = board.querySelector(`.bl-row[data-bl="${CSS.escape(ui.blMoved)}"]`); if (r) { r.classList.add('moved'); r.focus({ preventScroll: true }); } ui.blMoved = null; }
  if (max && ui.drawer) renderFocus(s, $('drawer'), ui.drawer);
