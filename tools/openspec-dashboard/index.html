<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSpec Dashboard</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-512.png?v=2">
<meta name="theme-color" content="#5865f2">
<meta name="osd-agent" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Patrick+Hand&family=Courier+Prime:wght@400;700&family=Permanent+Marker&family=Cabin+Sketch:wght@400;700&family=Architects+Daughter&family=Share+Tech+Mono&family=Bangers&family=VT323&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* Layout: focus card (current change, its current task, its checklist) + side column (milestone, activity),
   then a soft kanban board. Friendly: rounded surfaces, soft shadows, tinted status lanes, readable titles. */
:root {
  --bg: #f3f4fa;
  --surface: #ffffff;
  --surface-2: #f2f3f9;
  --ink: #23253f;
  --muted: #61657f;
  --faint: #9a9db5;
  --line: #e4e6f0;
  --accent: #4f57d6;
  --accent-soft: #ebecfc;
  --st-proposed: #8d91aa;
  --st-specified: #3a86c8;
  --st-progress: #e0861a;
  --st-complete: #1f9d68;
  --st-archived: #5c8f7a;
  --st-blocked: #df5560;
  --st-missing: #df5560;
  --shadow: 0 1px 2px rgba(35, 37, 63, .05), 0 6px 20px rgba(35, 37, 63, .06);
  --shadow-hover: 0 2px 4px rgba(35, 37, 63, .07), 0 10px 28px rgba(35, 37, 63, .10);
  --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 16px;
  --radius-sm: 11px;
  /* chart palette (status flow), validated for colour-vision deficiency on light and dark surfaces */
  --cf-draft: #e87ba4; --cf-specified: #2a78d6; --cf-progress: #eb6834; --cf-complete: #1baf7a; --cf-archived: #6250d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14151f; --surface: #1d1e2c; --surface-2: #252738; --ink: #e9eaf6; --muted: #a6a9c4; --faint: #6f7291;
    --line: #2e3047; --accent: #9da2ff; --accent-soft: #2a2c52;
    --st-proposed: #9195b0; --st-specified: #6db4f2; --st-progress: #f5a54a; --st-complete: #4ccb91; --st-archived: #8bbca6;
    --st-blocked: #ff8189; --st-missing: #ff8189;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-hover: 0 4px 16px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cf-draft: #d55181; --cf-specified: #3987e5; --cf-progress: #d95926; --cf-complete: #199e70; --cf-archived: #9085e9; } }
:root[data-theme="dark"], :root[data-style="blackboard"], :root[data-style="matrix"], :root[data-style="terminal"] { --cf-draft: #d55181; --cf-specified: #3987e5; --cf-progress: #d95926; --cf-complete: #199e70; --cf-archived: #9085e9; }
:root[data-theme="dark"] {
  --bg: #14151f; --surface: #1d1e2c; --surface-2: #252738; --ink: #e9eaf6; --muted: #a6a9c4; --faint: #6f7291;
  --line: #2e3047; --accent: #9da2ff; --accent-soft: #2a2c52;
  --st-proposed: #9195b0; --st-specified: #6db4f2; --st-progress: #f5a54a; --st-complete: #4ccb91; --st-archived: #8bbca6;
  --st-blocked: #ff8189; --st-missing: #ff8189;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-hover: 0 4px 16px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code, .mono { font-family: var(--font-mono); font-size: .86em; }
code { background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: .05em .4em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .01em; }
.btn { border: 0; background: var(--surface-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { background: var(--accent-soft); color: var(--accent); }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; font-weight: 600; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: var(--st); background: color-mix(in srgb, var(--st) 15%, transparent); white-space: nowrap; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; border-radius: 999px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-proposed); display: inline-block; margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--st-complete); animation: pulse 2.4s infinite; }
.dot.off { background: var(--st-blocked); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--st-complete) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.slug { font-family: var(--font-mono); font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }

/* header */
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 18px 4px; flex-wrap: wrap; }
header.top .logo { flex: none; margin-right: -8px; border-radius: 7px; }
header.top h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -.02em; }
header.top h1 span { color: var(--muted); font-weight: 500; }
.live { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.live > span { background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 4px 12px; }

/* layout */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; padding-block: 16px 20px; align-items: start; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }

/* focus */
.focus-head { padding: 22px 26px 18px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.eyebrow .label { font-size: 13px; }
.eyebrow .switch { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.eyebrow .switch button { border: 0; background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
.eyebrow .switch button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.eyebrow .back { margin-left: auto; font-size: 13px; }
.f-name { font-size: 26px; font-weight: 800; letter-spacing: -.025em; line-height: 1.2; margin: 0; text-wrap: balance; }
.f-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.f-goal { font-size: 15px; max-width: 68ch; text-wrap: pretty; }
.progress { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; margin-top: 6px; }
.progress .count { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.progress .count small { font-size: 16px; color: var(--muted); font-weight: 600; }
.segs { display: flex; gap: 5px; height: 14px; }
.seg { flex: var(--n) 1 0; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
.seg > span { position: absolute; inset: 0 auto 0 0; background: var(--st-complete); border-radius: 999px; }
.seg.cur { box-shadow: inset 0 0 0 2px var(--st-progress); }
.seg-labels { grid-column: 2; display: flex; gap: 5px; font-size: 11.5px; color: var(--faint); }
.seg-labels span { flex: var(--n) 1 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; padding-left: 4px; }
.seg-labels span.cur { color: var(--st-progress); font-weight: 700; }

.now { margin: 4px 26px 0; background: color-mix(in srgb, var(--st-progress) 10%, var(--surface)); border-radius: var(--radius-sm); padding: 14px 18px; display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
.now.done { background: color-mix(in srgb, var(--st-complete) 11%, var(--surface)); }
.now .tag { font-size: 12px; font-weight: 800; color: var(--surface); background: var(--st-progress); border-radius: 999px; padding: 2px 10px; align-self: start; margin-top: 2px; }
.now.done .tag { background: var(--st-complete); }
.now .t { font-size: 16px; font-weight: 700; }
.now .t .tid { font-family: var(--font-mono); color: var(--muted); font-weight: 500; font-size: 13px; margin-right: 8px; }
.now .v { grid-column: 2; font-size: 13px; color: var(--muted); }
.now .v b { font-weight: 700; color: var(--ink); margin-right: 4px; }
.now .pulse { grid-column: 2; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 6px; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 20px; margin-top: 18px; }
.tab { border: 0; background: none; padding: 7px 14px; cursor: pointer; color: var(--muted); border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.tab:hover:not(:disabled) { background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
.tab:disabled { opacity: .4; cursor: default; }
.f-body { padding: 12px 26px 24px; }

details.group { border-radius: var(--radius-sm); margin: 0 -10px; padding: 0 10px; }
details.group + details.group { margin-top: 2px; }
details.group > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 9px 0; font-weight: 700; font-size: 14px; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary:hover { color: var(--accent); }
details.group > summary .chev { color: var(--faint); transition: transform .15s; font-size: 10px; }
details.group[open] > summary .chev { transform: rotate(90deg); }
details.group.complete > summary { color: var(--muted); font-weight: 600; }
details.group.current { background: color-mix(in srgb, var(--st-progress) 5%, transparent); }
details.group > summary .num { color: var(--muted); font-weight: 600; font-size: 12.5px; background: var(--surface-2); border-radius: 999px; padding: 0 9px; }
details.group.complete > summary .num { color: var(--st-complete); background: color-mix(in srgb, var(--st-complete) 12%, transparent); }
details.group.current > summary .num { color: var(--st-progress); background: color-mix(in srgb, var(--st-progress) 14%, transparent); }
.tasks { padding: 0 0 10px 26px; }
.task { display: grid; grid-template-columns: 22px 34px 1fr; gap: 2px 6px; padding: 6px 8px; margin: 0 -8px; border-radius: 9px; font-size: 13.5px; }
.box { width: 17px; height: 17px; border: 2px solid var(--faint); border-radius: 50%; margin-top: 2px; display: grid; place-items: center; }
.task.done .box { background: var(--st-complete); border-color: var(--st-complete); }
.task.done .box::after { content: ""; width: 7px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.task.done .txt { color: var(--muted); }
.task.cur { background: color-mix(in srgb, var(--st-progress) 12%, transparent); }
.task.cur .box { border-color: var(--st-progress); }
.task .tid { font-family: var(--font-mono); font-size: 12px; color: var(--faint); padding-top: 2px; }
.task .ver { grid-column: 3; font-size: 12.5px; color: var(--muted); }
.task.fresh { animation: flash 2.5s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--st-complete) 30%, transparent); } 100% { background: transparent; } }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
.issue { font-size: 13px; background: color-mix(in srgb, var(--st-blocked) 10%, transparent); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 8px; }
.issue.WARNING, .issue.INFO { background: color-mix(in srgb, var(--st-progress) 10%, transparent); }
.issue b { font-size: 11.5px; margin-right: 6px; color: var(--st-blocked); }
.val-head { font-weight: 700; margin-bottom: 10px; } .val-head.ok { color: var(--st-complete); } .val-head.bad { color: var(--st-blocked); }
.val-table { border-collapse: collapse; width: 100%; font-size: 13px; }
.val-table th, .val-table td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.val-table th { font-size: 12px; color: var(--muted); font-weight: 600; }
.val-table td.warn { color: var(--st-blocked); font-weight: 700; }
.val-table .op { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); }
.val-table .op.ADDED { color: var(--st-complete); } .val-table .op.MODIFIED { color: var(--st-progress); } .val-table .op.REMOVED { color: var(--st-blocked); }
.md { font-size: 14px; max-width: 78ch; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.2em 0 .4em; text-wrap: balance; font-weight: 800; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14.5px; } .md h4 { font-size: 13.5px; color: var(--muted); }
.md > :first-child { margin-top: 0; }
.md p { margin: .5em 0; }
.md ul, .md ol { padding-left: 1.3em; margin: .4em 0; }
.md pre { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; overflow-x: auto; font-size: 12px; }
.md pre code { background: none; padding: 0; }
.md .tbl { overflow-x: auto; }
/* tables in chat answers: the bubble may use the full width, words do not break, a wide table scrolls sideways */
.msg.them:has(table) { max-width: 100%; }
.msg .md .tbl { max-width: 100%; }
.msg .md table { width: max-content; max-width: none; border-collapse: collapse; font-size: 12.5px; }
.msg .md th, .msg .md td { overflow-wrap: normal; word-break: normal; min-width: 4ch; max-width: 30ch; padding: 4px 8px; vertical-align: top; border-bottom: 1px solid var(--line); text-align: left; }
.msg .md td code { white-space: nowrap; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }

/* side */
.side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.side .panel { padding: 18px 20px; }
.ms-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
.ms-title span { color: var(--accent); margin-right: 6px; }
.ms-list { list-style: none; margin: 12px -8px 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ms-list li button { width: 100%; display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; background: none; border: 0; padding: 6px 8px; border-radius: 9px; cursor: pointer; text-align: left; font-size: 13px; }
.ms-list li button:hover { background: var(--surface-2); }
.ms-list .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-list .s { color: var(--muted); font-size: 12px; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--st); }
.ms-next { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.feed { list-style: none; margin: 10px 0 0; padding: 0; max-height: 360px; overflow: auto; }
.feed li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.feed li:first-child { border-top: 0; }
.feed time { color: var(--faint); font-size: 12px; padding-top: 1px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.feed .what { min-width: 0; overflow-wrap: anywhere; }
.feed .ch { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font-size: 12.5px; font-weight: 600; }
details.files { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
details.files summary { cursor: pointer; }
details.files ul { list-style: none; padding: 0; margin: 6px 0 0; font-family: var(--font-mono); font-size: 11px; }
details.files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 2px 0; }
details.files .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
svg text { fill: var(--muted); font-family: var(--font-sans); font-size: 10.5px; }

/* board */
.board { padding: 20px 20px 22px; margin-bottom: 36px; }
.board-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 16px; }
.board-head .label { font-size: 18px; color: var(--ink); font-weight: 800; letter-spacing: -.02em; }
.ms-filter { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.ms-filter button { border: 0; background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.ms-filter button b { font-weight: 700; color: var(--ink); margin-right: 4px; }
.ms-filter button:hover { color: var(--ink); }
.ms-filter button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.ms-filter button[aria-pressed="true"] b { color: var(--surface); }
.cols { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.col { background: color-mix(in srgb, var(--st) 7%, var(--surface-2)); border-radius: var(--radius-sm); min-width: 0; display: flex; flex-direction: column; }
.col-head { padding: 12px 12px 6px; }
.col-head .t { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
.col-head .t::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--st); }
.col-head .t .num { margin-left: auto; color: var(--st); background: var(--surface); font-weight: 700; font-size: 12px; border-radius: 999px; padding: 0 9px; }
.col-head .d { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.col-body { padding: 6px 8px 10px; display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow: auto; }
.col-empty { font-size: 12.5px; color: var(--faint); padding: 8px 4px; text-align: center; }
.kc { text-align: left; background: var(--surface); border: 0; border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0; box-shadow: var(--shadow); transition: box-shadow .15s, transform .15s; }
.kc:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.kc.focus { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.kc.moved { animation: moved 3s ease-out; }
@keyframes moved { 0% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 40%, transparent); } 100% { box-shadow: var(--shadow); } }
.kc-top { display: flex; gap: 6px; font-size: 11.5px; color: var(--muted); min-width: 0; align-items: center; }
.kc-top .o { font-weight: 700; color: var(--faint); }
.kc-top .c { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.kc-top .m { margin-left: auto; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 7px; font-size: 11px; }
.kc-name { font-size: 13.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.kc-prog { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.kc-prog .bar { flex: 1; height: 6px; }
.kc-flag { font-size: 11.5px; color: var(--st-blocked); font-weight: 600; }
.kc-flag.muted { color: var(--muted); font-weight: 500; }

/* view switch and backlog list */
.view-switch { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.view-switch button { border: 0; background: none; border-radius: 999px; padding: 4px 14px; font-size: 15px; font-weight: 800; color: var(--muted); cursor: pointer; letter-spacing: -.01em; }
.view-switch button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.board.max .view-switch { background: var(--surface); box-shadow: var(--shadow); }
.board.max .view-switch button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.backlog { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; overflow: auto; }
.bl-hint { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
.bl-note { font-weight: 600; color: var(--accent); } .bl-note.warn { color: var(--st-blocked); }
.bl-head { display: flex; gap: 8px; align-items: baseline; font-size: 15px; font-weight: 700; padding: 0 4px 6px; border-bottom: 1px solid var(--line); }
.bl-head b { color: var(--accent); } .bl-head .muted { font-size: 12.5px; font-weight: 500; margin-left: auto; }
.bl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

  --line: #fbfbf2; --accent: #ffd60a; --accent-soft: #3b3a1e;
  --st-proposed: #b4b4c8; --st-specified: #6aa5ff; --st-progress: #ffa24a; --st-complete: #4ade80;
  --st-archived: #9cc4b2; --st-blocked: #ff5a67; --st-missing: #ff5a67; color-scheme: dark;
}
:root[data-style="terminal"],
:root[data-style="terminal"][data-theme="light"],
:root[data-style="terminal"][data-theme="dark"] {
  --bg: #040704; --surface: #081009; --surface-2: #0b160c; --ink: #9cff9c; --muted: #62c26c; --faint: #3c7a45;
  --line: #1e4a25; --accent: #ffc94a; --accent-soft: #1a2a12;
  --st-proposed: #6fa877; --st-specified: #67e8f9; --st-progress: #ffb000; --st-complete: #7dff7a;
  --st-archived: #5f9f72; --st-blocked: #ff5f56; --st-missing: #ff5f56;
  --shadow: none; --shadow-hover: none; --radius: 0px; --radius-sm: 0px;
  --font-sans: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; color-scheme: dark;
}

/* ---------------------------------------------------------------- style: notebook
   Plain paper with one faint square grid and a red margin line; quiet cards with a status stripe. */
:root[data-style="notebook"] .panel,
:root[data-style="notebook"] .drawer {
  background-color: var(--surface);
  background-image:
    linear-gradient(90deg, transparent 12px, var(--nb-margin) 12px 13.5px, transparent 13.5px),
    linear-gradient(var(--nb-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--nb-grid) 1px, transparent 1px);
  background-size: auto, 20px 20px, 20px 20px;
}
:root[data-style="notebook"] .board.max { background-image: linear-gradient(var(--nb-grid) 1px, transparent 1px), linear-gradient(90deg, var(--nb-grid) 1px, transparent 1px); background-size: 20px 20px; box-shadow: none; }
:root[data-style="notebook"] header.top h1,
:root[data-style="notebook"] .f-name,
:root[data-style="notebook"] .ms-title,
:root[data-style="notebook"] .board-head .label,
:root[data-style="notebook"] .col-head .t,
:root[data-style="notebook"] .now .t { font-family: var(--font-architect); font-weight: 400 !important; letter-spacing: .01em; }
:root[data-style="notebook"] .f-name { font-size: 28px; }
:root[data-style="notebook"] .col { background: transparent; border-radius: 0; }
:root[data-style="notebook"] .col-head { border-bottom: 2px solid var(--st); margin: 0 8px; padding: 10px 2px 6px; }
:root[data-style="notebook"] .col-head .t::before { display: none; }
:root[data-style="notebook"] .col-head .t { color: var(--st); font-size: 16px; }
:root[data-style="notebook"] .col-body { padding: 12px 8px; }
:root[data-style="notebook"] .kc { border: 1px solid var(--line); border-radius: 3px; box-shadow: inset 3px 0 0 var(--st), 0 1px 2px rgba(0, 0, 0, .06); }
:root[data-style="notebook"] .kc:hover { transform: none; box-shadow: inset 3px 0 0 var(--st), 0 4px 10px -4px rgba(0, 0, 0, .18); }
:root[data-style="notebook"] .kc.focus { box-shadow: inset 3px 0 0 var(--st), 0 0 0 2px var(--accent); }
:root[data-style="notebook"] .now,
:root[data-style="notebook"] .board-now { background: color-mix(in srgb, var(--st-progress) 8%, var(--surface)); border-radius: 3px; box-shadow: inset 3px 0 0 var(--st-progress); }
:root[data-style="notebook"] .now.done { background: color-mix(in srgb, var(--st-complete) 8%, var(--surface)); box-shadow: inset 3px 0 0 var(--st-complete); }
:root[data-style="notebook"] .pill { background: transparent; border: 1px solid var(--st); border-radius: 3px; }
:root[data-style="notebook"] .bar,
:root[data-style="notebook"] .seg,
:root[data-style="notebook"] .bar > span,
:root[data-style="notebook"] .seg > span { border-radius: 2px; }
:root[data-style="notebook"] .box { border-radius: 2px; border-width: 1.5px; }
:root[data-style="notebook"] .task.cur { background: color-mix(in srgb, var(--st-progress) 10%, transparent); }
:root[data-style="notebook"] details.group.current { background: transparent; }
:root[data-style="notebook"] .tab { border-radius: 0; }
:root[data-style="notebook"] .tab[aria-selected="true"] { background: transparent; color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
:root[data-style="notebook"] .btn,
:root[data-style="notebook"] .style-select,
:root[data-style="notebook"] .ms-filter button,
:root[data-style="notebook"] .live > span { border-radius: 3px; background: var(--surface); border: 1px solid var(--line); }
:root[data-style="notebook"] .ms-filter button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
:root[data-style="notebook"] .ms-filter button[aria-pressed="true"] b { color: var(--accent); }

/* ---------------------------------------------------------------- style: matrix
   Falling green code (canvas, see setRain) behind translucent panels with a green glow. */
#matrix-rain { position: fixed; inset: 0; z-index: -1; opacity: .30; pointer-events: none; }
:root[data-style="matrix"] .panel,
:root[data-style="matrix"] .drawer {
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
:root[data-style="matrix"] .board.max { background: color-mix(in srgb, var(--bg) 70%, transparent); border: 0; }
:root[data-style="matrix"] header.top h1,
:root[data-style="matrix"] .f-name,
:root[data-style="matrix"] .ms-title,
:root[data-style="matrix"] .board-head .label,
:root[data-style="matrix"] .col-head .t,
:root[data-style="matrix"] .side .label,
:root[data-style="matrix"] .now .t { color: var(--accent); text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent); letter-spacing: .02em; }
:root[data-style="matrix"] .f-name { font-size: 30px; }
:root[data-style="matrix"] .side .label { color: var(--accent) !important; }
:root[data-style="matrix"] .now .t::after { content: "▋"; margin-left: 4px; color: var(--accent); animation: m-blink 1.1s steps(1) infinite; }
@keyframes m-blink { 50% { opacity: 0; } }
:root[data-style="matrix"] .col { background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px solid var(--line); }
:root[data-style="matrix"] .kc { background: color-mix(in srgb, var(--surface-2) 85%, transparent); border: 1px solid color-mix(in srgb, var(--st) 55%, transparent); }
:root[data-style="matrix"] .kc:hover { box-shadow: 0 0 14px -4px color-mix(in srgb, var(--st) 70%, transparent); }
:root[data-style="matrix"] .kc.focus { box-shadow: 0 0 0 1px var(--accent), 0 0 16px -2px color-mix(in srgb, var(--accent) 70%, transparent); }
:root[data-style="matrix"] .now,
:root[data-style="matrix"] .board-now { background: color-mix(in srgb, var(--st-progress) 6%, transparent); border: 1px solid var(--st-progress); }
:root[data-style="matrix"] .now .tag { background: var(--st-progress); color: var(--bg); }
:root[data-style="matrix"] .now.done { border-color: var(--st-complete); }
:root[data-style="matrix"] .now.done .tag { background: var(--st-complete); }
:root[data-style="matrix"] .pill { background: transparent; border: 1px solid color-mix(in srgb, var(--st) 60%, transparent); }
:root[data-style="matrix"] .bar,
:root[data-style="matrix"] .seg { background: color-mix(in srgb, var(--accent) 8%, transparent); }
:root[data-style="matrix"] .bar > span,
:root[data-style="matrix"] .seg > span { box-shadow: 0 0 8px color-mix(in srgb, var(--st-complete) 70%, transparent); }
:root[data-style="matrix"] .box { border-radius: 1px; border-color: var(--muted); }
:root[data-style="matrix"] .task.done .box { background: var(--accent); border-color: var(--accent); }
:root[data-style="matrix"] .task.done .box::after { border-color: var(--bg); }
:root[data-style="matrix"] .task.cur { background: color-mix(in srgb, var(--st-progress) 10%, transparent); }
:root[data-style="matrix"] details.group.current { background: transparent; }
:root[data-style="matrix"] .tab[aria-selected="true"],
:root[data-style="matrix"] .ms-filter button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
:root[data-style="matrix"] .ms-filter button[aria-pressed="true"] b { color: var(--bg); }
:root[data-style="matrix"] .btn,
:root[data-style="matrix"] .style-select,
:root[data-style="matrix"] .ms-filter button,
:root[data-style="matrix"] .live > span,
:root[data-style="matrix"] .board-live,
:root[data-style="matrix"] .tab,
:root[data-style="matrix"] .eyebrow .switch button { background: color-mix(in srgb, var(--surface) 80%, transparent); border: 1px solid var(--line); border-radius: 2px; color: var(--ink); }
:root[data-style="matrix"] .ms-filter button b { color: var(--ink); }
:root[data-style="matrix"] .style-select option { background: var(--surface); }
:root[data-style="matrix"] code { background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* ---------------------------------------------------------------- style: comic
   Halftone paper, thick ink outlines with hard shadows, bold lettering, a speech bubble for the current task. */
:root[data-style="comic"] body,
:root[data-style="comic"] .board.max {
  background-color: var(--bg);
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 10%, transparent) 1.3px, transparent 1.6px);
  background-size: 10px 10px;
}
:root[data-style="comic"] .panel,
:root[data-style="comic"] .drawer { border: 3px solid var(--ink); border-radius: 6px; box-shadow: 6px 6px 0 var(--ink); }
:root[data-style="comic"] .board.max { border: 0; border-radius: 0; box-shadow: none; }
:root[data-style="comic"] header.top h1,
:root[data-style="comic"] .f-name,
:root[data-style="comic"] .ms-title,
:root[data-style="comic"] .board-head .label,
:root[data-style="comic"] .col-head .t,
:root[data-style="comic"] .side .label,
:root[data-style="comic"] .now .t { font-family: var(--font-comic); font-weight: 400 !important; letter-spacing: .04em; text-transform: uppercase; }
:root[data-style="comic"] header.top h1 { font-size: 26px; }
:root[data-style="comic"] .f-name { font-size: 38px; line-height: 1.05; }
:root[data-style="comic"] .ms-title { font-size: 24px; }
:root[data-style="comic"] .board-head .label { font-size: 28px; }
:root[data-style="comic"] .side .label { font-size: 20px !important; color: var(--ink); }
:root[data-style="comic"] .col-head .t { font-size: 20px; }
:root[data-style="comic"] .now .t { font-size: 20px; }
:root[data-style="comic"] .col {
  border: 2.5px solid var(--ink); border-radius: 4px;
  background-color: color-mix(in srgb, var(--st) 16%, var(--surface));
  background-image: radial-gradient(color-mix(in srgb, var(--st) 30%, transparent) 1.2px, transparent 1.5px); background-size: 8px 8px;
}
:root[data-style="comic"] .col-head .t::before { width: 12px; height: 12px; border: 2px solid var(--ink); }
:root[data-style="comic"] .col-head .t .num { border: 2px solid var(--ink); color: var(--ink); }
:root[data-style="comic"] .col-head .d { color: var(--ink); font-weight: 600; }
:root[data-style="comic"] .kc { border: 2.5px solid var(--ink); border-radius: 4px; box-shadow: 4px 4px 0 var(--ink); }
:root[data-style="comic"] .kc:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
:root[data-style="comic"] .kc.focus { box-shadow: 4px 4px 0 var(--accent); border-color: var(--accent); }
:root[data-style="comic"] .kc-name { font-weight: 800; }
:root[data-style="comic"] .kc-top .m { border: 1.5px solid var(--ink); }
:root[data-style="comic"] .now { position: relative; background: var(--surface); border: 3px solid var(--ink); border-radius: 26px; box-shadow: 4px 4px 0 var(--ink); margin-bottom: 18px; }
:root[data-style="comic"] .now::before,
:root[data-style="comic"] .now::after { content: ""; position: absolute; left: 46px; clip-path: polygon(0 0, 100% 0, 0 100%); }
:root[data-style="comic"] .now::before { bottom: -22px; width: 30px; height: 22px; background: var(--ink); }
:root[data-style="comic"] .now::after { bottom: -15px; left: 49.5px; width: 22px; height: 16px; background: var(--surface); }
:root[data-style="comic"] .board-now { background: var(--surface); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 3px 3px 0 var(--ink); }
:root[data-style="comic"] .now .tag { background: var(--st-progress); color: var(--ink); border: 2px solid var(--ink); text-transform: uppercase; font-family: var(--font-comic); font-size: 14px; letter-spacing: .05em; font-weight: 400; }
:root[data-style="comic"] .now.done .tag { background: var(--st-complete); }
:root[data-style="comic"] .pill { color: var(--ink); background: color-mix(in srgb, var(--st) 35%, var(--surface)); border: 2px solid var(--ink); text-transform: uppercase; font-weight: 800; }
:root[data-style="comic"] .bar,
:root[data-style="comic"] .seg { background: var(--surface); border: 2px solid var(--ink); height: 14px; }
:root[data-style="comic"] .segs { height: 16px; }
:root[data-style="comic"] .bar > span,
:root[data-style="comic"] .seg > span { background-image: radial-gradient(rgba(255, 255, 255, .45) 1.2px, transparent 1.5px); background-size: 5px 5px; }
:root[data-style="comic"] .box { border: 2.5px solid var(--ink); border-radius: 4px; }
:root[data-style="comic"] .task.done .box { background: var(--st-complete); border-color: var(--ink); }
:root[data-style="comic"] .task.done .box::after { border-color: var(--ink); }
:root[data-style="comic"] .task.cur { background: color-mix(in srgb, var(--st-progress) 22%, transparent); box-shadow: inset 0 0 0 2px var(--ink); }
:root[data-style="comic"] details.group.current { background: transparent; }
:root[data-style="comic"] .tab { border: 2px solid transparent; font-weight: 800; }
:root[data-style="comic"] .tab[aria-selected="true"] { background: var(--accent); color: var(--surface); border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
:root[data-style="comic"] .btn,
:root[data-style="comic"] .style-select,
:root[data-style="comic"] .ms-filter button,
:root[data-style="comic"] .live > span,
:root[data-style="comic"] .board-live { background: var(--surface); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); font-weight: 700; }
:root[data-style="comic"] .ms-filter button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
:root[data-style="comic"] .ms-filter button[aria-pressed="true"] b { color: var(--surface); }
:root[data-style="comic"] details.group > summary .num { border: 2px solid var(--ink); }

/* ---------------------------------------------------------------- style: terminal
   Retro CRT: green phosphor with a soft glow, scanlines, monospace, a blinking cursor on the current task. */
:root[data-style="terminal"] body { text-shadow: 0 0 3px color-mix(in srgb, var(--ink) 45%, transparent); }
:root[data-style="terminal"] body::after {
  content: ""; position: fixed; inset: 0; z-index: 100; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0, 0, 0, .45));
}
:root[data-style="terminal"] header.top h1,
:root[data-style="terminal"] .f-name,
:root[data-style="terminal"] .ms-title,
:root[data-style="terminal"] .board-head .label,
:root[data-style="terminal"] .col-head .t,
:root[data-style="terminal"] .side .label,
:root[data-style="terminal"] .now .t { font-family: var(--font-crt); font-weight: 400 !important; letter-spacing: .02em; }
:root[data-style="terminal"] header.top h1 { font-size: 26px; }
:root[data-style="terminal"] .f-name { font-size: 38px; }
:root[data-style="terminal"] .f-name::before { content: "> "; color: var(--accent); }
:root[data-style="terminal"] .ms-title { font-size: 24px; }
:root[data-style="terminal"] .board-head .label { font-size: 28px; }
:root[data-style="terminal"] .side .label { font-size: 22px !important; color: var(--ink); }
:root[data-style="terminal"] .col-head .t { font-size: 22px; text-transform: uppercase; }
:root[data-style="terminal"] .now .t { font-size: 22px; }
:root[data-style="terminal"] .now .t::after { content: "▋"; margin-left: 4px; color: var(--ink); animation: t-blink 1.1s steps(1) infinite; }
@keyframes t-blink { 50% { opacity: 0; } }
:root[data-style="terminal"] .panel,
:root[data-style="terminal"] .drawer { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 0 18px -6px color-mix(in srgb, var(--ink) 30%, transparent); }
:root[data-style="terminal"] .board.max { border: 0; box-shadow: none; background: var(--bg); }
:root[data-style="terminal"] .col { background: transparent; border: 1px solid var(--line); }
:root[data-style="terminal"] .col-head .t::before { border-radius: 0; }
:root[data-style="terminal"] .kc { background: transparent; border: 1px dashed color-mix(in srgb, var(--st) 75%, transparent); }
:root[data-style="terminal"] .kc:hover { transform: none; background: color-mix(in srgb, var(--st) 9%, transparent); }
:root[data-style="terminal"] .kc.focus { border-style: solid; border-color: var(--accent); box-shadow: 0 0 10px -2px color-mix(in srgb, var(--accent) 60%, transparent); }
:root[data-style="terminal"] .kc-top .m { background: transparent; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
:root[data-style="terminal"] .now,
:root[data-style="terminal"] .board-now { background: transparent; border: 1px solid var(--st-progress); }
:root[data-style="terminal"] .now.done { border-color: var(--st-complete); }
:root[data-style="terminal"] .now .tag { background: var(--st-progress); color: var(--bg); text-shadow: none; }
:root[data-style="terminal"] .now.done .tag { background: var(--st-complete); }
:root[data-style="terminal"] .pill { background: transparent; padding: 0; }
:root[data-style="terminal"] .pill::before { content: "["; }
:root[data-style="terminal"] .pill::after { content: "]"; }
:root[data-style="terminal"] .bar,
:root[data-style="terminal"] .seg { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
:root[data-style="terminal"] .bar > span,
:root[data-style="terminal"] .seg > span { background-image: repeating-linear-gradient(90deg, transparent 0 6px, var(--surface) 6px 8px); }
:root[data-style="terminal"] .box { border-radius: 0; border: 1.5px solid var(--ink); }
:root[data-style="terminal"] .task.done .box { background: var(--ink); border-color: var(--ink); }
:root[data-style="terminal"] .task.done .box::after { border-color: var(--bg); }
:root[data-style="terminal"] .task.cur { background: color-mix(in srgb, var(--st-progress) 12%, transparent); }
:root[data-style="terminal"] details.group.current { background: transparent; }
:root[data-style="terminal"] .tab[aria-selected="true"],
:root[data-style="terminal"] .ms-filter button[aria-pressed="true"] { background: var(--ink); color: var(--bg); text-shadow: none; }
:root[data-style="terminal"] .ms-filter button[aria-pressed="true"] b { color: var(--bg); }
:root[data-style="terminal"] .btn,
:root[data-style="terminal"] .style-select,
:root[data-style="terminal"] .ms-filter button,
:root[data-style="terminal"] .live > span,
:root[data-style="terminal"] .board-live,
:root[data-style="terminal"] .tab,
:root[data-style="terminal"] .eyebrow .switch button { background: transparent; border: 1px solid var(--line); border-radius: 0; color: var(--ink); }
:root[data-style="terminal"] .ms-filter button b { color: var(--ink); }
:root[data-style="terminal"] .style-select option { background: var(--surface); }
:root[data-style="terminal"] .col-head .t .num,
:root[data-style="terminal"] details.group > summary .num,
:root[data-style="terminal"] code { border-radius: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

[hidden] { display: none !important; }
.live > span:empty { display: none; }

/* discovering projects to onboard */
.disc { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.disc-form { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.disc-form input[type="text"], .disc-form #disc-path { flex: 1 1 320px; max-width: 560px; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; }
.disc .btn.primary, .ov-parked .btn.primary, .agent-panel .sc-decide .btn.primary { background: var(--accent) !important; color: var(--bg) !important; border-color: var(--accent) !important; font-weight: 700; }
.disc-toggle { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.disc-note { font-size: 12.5px; color: var(--muted); } .disc-note.warn { color: var(--st-blocked); font-weight: 600; }
.disc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.disc-row { display: flex; gap: 14px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; }
.disc-row.skipped { opacity: .55; } .disc-row.picked { box-shadow: inset 4px 0 0 var(--accent); }
.disc-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.disc-name { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 15px; }
.disc-chip { font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 6px; }
.disc-chip.os { color: var(--st-complete); }
.disc-about { font-size: 13px; color: var(--muted); }
.disc-path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-row { padding-bottom: 6px; }
.xp-toggle[aria-pressed="true"] { font-weight: 700; }
.np-expert-fold { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 6px 10px; margin: 2px 0 8px; }
.np-expert { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 2px 0 8px; max-height: 42vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }

/* ---------------------------------------------------------------- agent panel (--agent) */
.agent-panel { --agp: 18px; position: fixed; top: 12px; right: 12px; bottom: 12px; left: auto; width: min(480px, calc(100vw - 24px)); z-index: 70;

.xp-g.xp-off { opacity: .45; }
.xp-g.xp-off .xp-chip { pointer-events: none; }
.np-repo { flex-wrap: wrap; margin-bottom: 6px; }

<script>

}
// Write mode of a joined session: the same rain behind the conversation while an answer takes longer than 30 s,
// so it is easy to see when it is done (≋ Matrix turns it off). It fades to transparent: works on light and dark.
let wait = null;
// the speed of the falling code (Settings › Write mode): ms per step, from very slow to very fast; 3 is the default
const RAIN_MS = [null, 160, 100, 60, 40, 25], RAIN_SPEED = [null, 'very slow', 'slow', 'normal', 'fast', 'very fast'];
const rainSpeed = () => Math.min(5, Math.max(1, Number(termView.rainSpeed) || 3));
function setWaitRain(on) {

    if (wait) { cancelAnimationFrame(wait.raf); wait.canvas.remove(); $('agent')?.classList.remove('rain-on'); wait = null; }
    return;

  const size = 15;
  let w = 0, h = 0, drops = [];
  const place = () => {
    const t = $('ag-thread');
    if (!t) return;
    Object.assign(canvas.style, { top: `${t.offsetTop}px`, left: `${t.offsetLeft}px`, width: `${t.clientWidth}px`, height: `${t.clientHeight}px` });
    if (canvas.width !== t.clientWidth || canvas.height !== t.clientHeight) {

    && T && (T.state === 'working' || (T.sentAt && Date.now() - T.sentAt < 20000)) && since && Date.now() - since > (termView.rainAfter ?? WAIT_RAIN_AFTER / 1000) * 1000);

{

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const link = (_, text, url) => /^https?:\/\//.test(url) ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>` : `<span class="ref" title="${url}">${text}</span>`;
const inline = (s) => esc(s).replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, link).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');
const isTicket = (c) => c.status !== 'parking' && c.status !== 'idea'; // ideas are not planned yet
const stVar = (s) => `var(${STATUS[s]?.v ?? '--st-proposed'})`;
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
// add-due-dates -> Add due dates (the slug stays visible where it matters)
const title = (slug) => { const t = String(slug).replace(/[-_]+/g, ' ').replace(/\bmcp\b/gi, 'MCP').replace(/\bapi\b/gi, 'API').replace(/\bpostgresql\b/gi, 'PostgreSQL').replace(/\bpoc\b/gi, 'PoC').replace(/\bcqrs\b/gi, 'CQRS').replace(/^setup /, 'Set up '); return t.charAt(0).toUpperCase() + t.slice(1); };

const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(t) {
  if (!t) return '—';

  if (s < 3600) return `${Math.round(s / 60)} min ago`;

function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0, list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { closeList(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); const n = Math.min(4, h[1].length); out += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      closeList();

      i += 2;

      while (i + 1 < lines.length && /^\s{2,}\S/.test(lines[i + 1]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i + 1])) text += ' ' + lines[++i].trim();
      out += `<li style="margin-left:${Math.min(3, Math.floor(li[1].length / 2))}em">${inline(text)}</li>`; i++; continue;
    }

    closeList();
    const buf = [l];
    while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#|```|\s*([-*]|\d+\.)\s|\|)/.test(lines[i + 1])) buf.push(lines[++i]);

async function loadFile(f) {

// ------------------------------------------------------------ what is "current"
// Active = changes with work in them that are not archived: in progress, tasks done (awaiting archive),
// or specified (elaborated, nothing checked yet). Most recently touched first.
function activeChanges(s) {
  const rank = { 'in-progress': 0, 'complete': 1, 'specified': 2 };
  return s.changes.filter((c) => c.status in rank)
    .sort((a, b) => rank[a.status] - rank[b.status] || (b.lastModified ?? 0) - (a.lastModified ?? 0));
}
function currentChange(s) {
  return activeChanges(s)[0] ?? s.changes.find((c) => c.name === s.nextUp) ?? s.changes[0];
}
function currentTask(c) {
  for (const g of c.tasks?.groups ?? []) for (const i of g.items) if (!i.done) return { g, i };
  return null;
}
