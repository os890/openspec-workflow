function renderMilestone(s) {
  const focusName = ((ui.pinned && s.changes.find((x) => x.name === ui.pinned)) || currentChange(s))?.name;
  const msOf = s.milestones.map((m) => ({ m, cs: s.changes.filter((c) => c.milestone === m.id) }));
  const focusMs = s.changes.find((c) => c.name === focusName)?.milestone;
  const byFocus = msOf.findIndex((x) => x.m.id === focusMs);
  const idx = byFocus >= 0 ? byFocus : Math.max(0, msOf.findIndex((x) => x.cs.some((c) => !isDone(c))));
  const { m, cs } = msOf[idx] ?? { m: { id: '—', title: 'No milestones' }, cs: [] };
  const done = cs.filter(isDone).length;
  const next = msOf[idx + 1];
  const td = s.totals;
  $('milestone').innerHTML = `
    <div class="label">Current milestone</div>
    <div class="ms-title"><span>${esc(m.id)}</span>${esc(m.title)}</div>
    <div class="muted num" style="font-size:12.5px;margin:2px 0 8px">${done} of ${cs.length} changes done</div>
    <div class="bar">${cs.map((c) => `<span style="flex:1;background:${stVar(c.status)};opacity:${isDone(c) ? 1 : c.tasks ? .35 + .65 * (c.tasks.done / Math.max(1, c.tasks.total)) : .15};border-right:2px solid var(--surface)"></span>`).join('')}</div>
    <ul class="ms-list">${cs.map((c) => `<li><button type="button" data-pick="${esc(c.name)}" ${c.name === focusName ? 'style="font-weight:600"' : ''}>
      <span class="sw" style="--st:${stVar(c.status)}"></span><span class="n">${esc(title(c.name))}</span>
      <span class="s num">${c.tasks ? `${c.tasks.done}/${c.tasks.total}` : STATUS[c.status].label.toLowerCase()}</span></button></li>`).join('')}</ul>
    <div class="ms-next">${next ? `Then <b>${esc(next.m.id)}</b> ${esc(next.m.title)} · ${next.cs.length} changes` : 'Last milestone'}<br>
      Overall <span class="num">${s.changes.filter(isDone).length}/${s.changes.filter(isTicket).length}</span> changes · <span class="num">${td.done}/${td.total}</span> tasks written so far</div>`;
}

function renderFeed(s) {
  const name = (n) => `<button type="button" class="ch" data-pick="${esc(n)}">${esc(title(n))}</button>`;
  const items = s.events.slice(0, 40).map((e) => {
    let what;
    if (e.kind === 'task-done') what = `<span style="color:var(--st-complete)">✓</span> <span class="mono">${esc(e.task)}</span> ${inline(e.text)} <span class="muted">· ${name(e.change)}</span>`;
    else if (e.kind === 'task-reopened') what = `<span style="color:var(--st-progress)">↺</span> <span class="mono">${esc(e.task)}</span> ${inline(e.text)} <span class="muted">· ${name(e.change)}</span>`;
    else if (e.kind === 'status') what = `${name(e.change)} → <b style="color:${stVar(e.to)}">${STATUS[e.to]?.label ?? e.to}</b>`;
    else if (e.kind === 'added') what = `${name(e.change)} added`;
    else if (e.kind === 'scope') what = `${name(e.change)}: <b>+${e.to - e.from}</b> task${e.to - e.from === 1 ? '' : 's'} added after work started`;
    else what = `<span class="mono">${esc(e.change)}</span> removed`;
    return `<li><time title="${new Date(e.t).toLocaleString()}">${hhmm(e.t)}</time><span class="what">${what}</span></li>`;
  });
  $('feed').innerHTML = items.join('') || '<li><time></time><span class="what muted">Nothing yet. Checked-off tasks show up here as soon as they happen.</span></li>';
  const w = s.workspace;
  $('burn').innerHTML = burn(s) + (w?.recent?.length ? `<details class="files"><summary>${w.changedLast15m} files written in the last 15 min</summary><ul>${w.recent.slice(0, 10).map((f) => `<li><span class="p" title="${esc(f.path)}"><bdi>${esc(f.path)}</bdi></span><span>${ago(f.mtime)}</span></li>`).join('')}</ul></details>` : '');
}

// The result of `openspec validate` for a change, with what it covered (`openspec show`: the spec deltas).
function validationHtml(c, cli) {
  const v = c.validation;
  const errors = v.issues.filter((i) => i.level === 'ERROR').length;
  const head = v.valid
    ? `<div class="val-head ok">✓ <code>openspec validate ${esc(c.name)}</code> passes</div>`
    : `<div class="val-head bad">✕ <code>openspec validate ${esc(c.name)}</code> fails: ${errors} error${errors === 1 ? '' : 's'}</div>`;
  const issues = v.issues.map((i) => `<div class="issue ${esc(i.level)}"><b>${esc(i.level)}</b>${i.path && i.path !== 'file' ? `<span class="mono muted">${esc(i.path)}</span> ` : ''}${esc(i.message)}</div>`).join('');
  const d = c.deltas;
  const checked = d?.length ? `<div class="label" style="margin:14px 0 6px">What it checked: ${d.length} spec delta${d.length === 1 ? '' : 's'}, ${d.reduce((a, x) => a + x.scenarios, 0)} scenarios</div>
      <table class="val-table"><thead><tr><th>Delta</th><th>Capability</th><th>Requirement</th><th>Scenarios</th></tr></thead><tbody>${d.map((x) => `<tr><td><span class="op ${esc(x.op)}">${esc(x.op)}</span></td><td class="mono">${esc(x.spec)}</td><td>${esc(x.requirement ?? '—')}</td><td class="${x.scenarios ? '' : 'warn'}">${x.scenarios}</td></tr>`).join('')}</tbody></table>`
    : d ? '<div class="empty">No spec deltas: the change declares no behaviour change (or has not written its deltas yet).</div>' : '';
  const when = cli.lastRun ? `<div class="ag-note" style="margin-top:10px">Checked at ${hhmm(cli.lastRun)} · again when a file under <code>openspec/</code> changes. Validation checks the structure of the proposal and the spec deltas (every requirement with SHALL/MUST and at least one scenario); whether the code does what they say is for the tests and the review.</div>` : '';
  return head + issues + checked + when;
}
// Why a change has no validation result (yet): drafts and archived changes are not validated by the CLI at all.
function validationPending(c, cli) {
  if (c.location === 'backlog') return 'Nothing to validate yet: this is a draft in <code>openspec/backlog/</code>, not an OpenSpec change. <code>openspec validate</code> checks it once the change is created.';
  if (c.status === 'archived') return 'Archived: its spec deltas are part of <code>openspec/specs/</code> now; <code>openspec validate</code> only checks active changes.';
  if (!cli.available) return 'OpenSpec CLI disabled.';
  const secs = (t) => `${Math.max(1, Math.round((Date.now() - t) / 1000))} s`;
  if (cli.state === 'running') return `<span class="ag-spin"></span> <code>openspec validate</code> is running (for ${secs(cli.since)}).`;
  if (cli.state === 'queued') return `<span class="ag-spin"></span> Waiting for the OpenSpec CLI: its calls run one at a time across all projects (queued ${secs(cli.since)} ago).`;
  if (cli.error) return `✕ The OpenSpec CLI failed: ${esc(cli.error)}${cli.nextTry ? ` Next try at ${hhmm(cli.nextTry)}, or sooner when a file under <code>openspec/</code> changes.` : ''}`;
  if (cli.lastRun) return `Not in the result of <code>openspec validate --all</code> (${hhmm(cli.lastRun)}).`;
  return 'Waiting for the first run of the OpenSpec CLI…';
}

function burn(s) {
  const pts = s.series;
  if (pts.length < 2) return '';
  const W = 300, H = 90, L = 4, R = 24, T = 8, B = 16;
  const t0 = pts[0].t, t1 = Math.max(Date.now(), pts.at(-1).t);
  const maxY = Math.max(1, ...pts.map((p) => p.total));
  const x = (t) => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - v / maxY) * (H - T - B);
  const step = (k) => pts.reduce((d, p, i) => d + (i ? `H${x(p.t)}V${y(p[k])}` : `M${x(p.t)},${y(p[k])}`), '') + `H${x(t1)}`;
  const last = pts.at(-1);
  return `<div class="label" style="margin-top:14px">Tasks checked over time</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${last.done} of ${last.total} tasks done">
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <path d="${step('total')}" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${step('done')}V${y(0)}H${x(t0)}Z" fill="var(--st-complete)" fill-opacity=".14"/>
    <path d="${step('done')}" fill="none" stroke="var(--st-complete)" stroke-width="2"/>
    <circle cx="${x(t1)}" cy="${y(last.done)}" r="3" fill="var(--st-complete)"/>
    <text x="${x(t1) + 5}" y="${y(last.done) + 3.5}" style="fill:var(--ink);font-weight:600">${last.done}</text>
    <text x="${L}" y="${H - 3}">${hhmm(t0)}</text><text x="${W - R}" y="${H - 3}" text-anchor="end">now</text>
  </svg>`;
}

// Update an element in place to match new markup: nodes that stay the same are kept, only what differs changes.
// Replacing the whole board on every live update would recreate its scroll areas, which makes macOS flash their
// scroll bars and loses scroll positions. Elements with data-keep-children keep their content (drawn separately);
// an opened <details class="ch-data"> stays open.
function morphChildren(a, b) {
  const ac = [...a.childNodes], bc = [...b.childNodes];
  bc.forEach((n, i) => { if (i < ac.length) morphNode(ac[i], n); else a.appendChild(n); });
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}
function morphNode(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeName === 'SELECT' && a === document.activeElement) return; // open or in use: changing its options makes the list flicker; it catches up after
  const keepOpen = a.nodeName === 'DETAILS' && a.classList.contains('ch-data') && a.open;
  for (const { name } of [...a.attributes]) if (!b.hasAttribute(name) && !(keepOpen && name === 'open')) a.removeAttribute(name);
  for (const { name, value } of [...b.attributes]) if (a.getAttribute(name) !== value) a.setAttribute(name, value);
  if (!a.hasAttribute('data-keep-children')) morphChildren(a, b);
}
function morphHtml(el, html) {
  const t = document.createElement('template');
  t.innerHTML = html;
  morphChildren(el, t.content);
}

// ------------------------------------------------------------ render: board
// Columns are derived from the files (see README "Status rules"); the board is read-only on purpose.
const COLS = [
  ['blocked',     'Blocked',     'Draft proposal, waits for prerequisites', '--st-blocked'],
  ['ready',       'Ready',       'Draft proposal, can start now',      '--st-proposed'],
  ['specified',   'Specified',   'Design, spec deltas and tasks written',  '--st-specified'],
  ['in-progress', 'In progress', 'Tasks being checked off',               '--st-progress'],
  ['complete',    'Tasks done',  'Waiting for openspec archive',          '--st-complete'],
  ['archived',    'Archived',    'Merged into openspec/specs',            '--st-archived'],
];
const columnOf = (c) => (c.status === 'proposed' || c.status === 'missing') ? (c.blockedBy.length ? 'blocked' : 'ready') : c.status;

function renderBoard(s) {
  if (ui.drag) { ui.pendingBoard = true; return; } // never replace the list under a drag
  const max = ui.boardMax;
  const cur = currentChange(s);
  const focusName = max && ui.drawer ? ui.drawer : ((ui.pinned && s.changes.find((x) => x.name === ui.pinned)) || cur)?.name;
  const msIds = s.milestones.map((m) => m.id);
  if (ui.ms && !msIds.includes(ui.ms)) ui.ms = '';
  const shown = s.changes.filter((c) => !ui.ms || c.milestone === ui.ms);
  const moved = new Set();
  for (const c of s.changes) {
    const col = columnOf(c);
    if (ui.prevCol.has(c.name) && ui.prevCol.get(c.name) !== col) moved.add(c.name);
    ui.prevCol.set(c.name, col);
  }
  const msBtn = (id, label, cs, name = '') => `<button type="button" data-ms="${esc(id)}" aria-pressed="${ui.ms === id}"${name ? ` title="${esc(id)} ${esc(name)}"` : ''}>${label} <span class="num">${cs.filter(isDone).length}/${cs.length}</span></button>`;
  const card = (c) => {
    const t = c.tasks;
    const flags = [];
    if (c.blockedBy.length && !isDone(c)) flags.push(`<div class="kc-flag ${columnOf(c) === 'blocked' ? 'muted' : ''}">waits for ${c.blockedBy.map((o) => '#' + o).join(', ')}</div>`);
    if (c.validation && !c.validation.valid && c.status !== 'proposed') flags.push('<div class="kc-flag">✕ validation fails</div>');
    return `<button type="button" class="kc ${c.name === focusName ? 'focus' : ''} ${moved.has(c.name) ? 'moved' : ''}" data-pick="${esc(c.name)}" title="${esc(c.goal)}">
      <div class="kc-top"><span class="o">${c.inRoadmap ? '#' + c.order : 'not in roadmap'}</span><span class="c">${esc(c.context)}</span><span class="m">${esc(c.milestone ?? '')}</span></div>
      <div class="kc-name">${esc(title(c.name))}</div>
      ${t && t.total && c.status !== 'archived' ? `<div class="kc-prog"><div class="bar"><span style="width:${pct(t.done, t.total)}%;background:var(--st-complete)"></span></div><span class="num">${t.done}/${t.total}</span></div>` : ''}
      ${flags.join('')}
    </button>`;
  };
  const focus = ui.boardFocus;
  const byCol = Object.fromEntries(COLS.map(([key]) => [key, shown.filter((c) => columnOf(c) === key).sort((a, b) => a.seq - b.seq)]));
  const visibleCols = COLS.filter(([key]) => !(focus && key === 'archived'));
  const ct = cur && currentTask(cur);
  const now = !max || !cur ? '' : `<div class="board-now ${cur.tasks && !ct ? 'done' : ''}">
      <span class="k">${cur.status === 'in-progress' ? 'Working on' : cur.status === 'complete' ? 'Ready to archive' : 'Up next'}</span>
      <button class="link" type="button" data-pick="${esc(cur.name)}">${esc(title(cur.name))}</button>
      ${cur.tasks ? `<span class="num muted">${cur.tasks.done}/${cur.tasks.total} tasks</span>` : ''}
      ${ct ? `<span>· now <span class="mono muted">${esc(ct.i.id)}</span> ${inline(ct.i.text)}</span>` : ''}
    </div>`;
  const board = $('board');
  board.classList.toggle('max', max);
  // Live updates rebuild the board; the charts are drawn only after it is in the page (they measure their width).
  // Hold the old height meanwhile, so the page never gets shorter for a moment and the browser keeps the scroll position.
  const keepY = window.scrollY;
  if (!max) board.style.minHeight = `${board.offsetHeight}px`;
  morphHtml(board, `
    <div class="board-head">
      <span class="view-switch" role="tablist" aria-label="View"><button type="button" role="tab" data-board-view="board" aria-selected="${ui.boardView === 'board'}">Board</button><button type="button" role="tab" data-board-view="backlog" aria-selected="${ui.boardView === 'backlog'}">Backlog</button><button type="button" role="tab" data-board-view="charts" aria-selected="${ui.boardView === 'charts'}">Charts</button></span>
      ${max ? `<span class="board-live">${$('conn').innerHTML}</span>` : ''}
      <span class="muted num" style="font-size:12.5px">${s.changes.filter(isDone).length} of ${s.changes.filter(isTicket).length} changes done · ${s.totals.done}/${s.totals.total} tasks${focus && byCol.archived.length ? ` · ${byCol.archived.length} archived hidden` : ''}</span>
      ${s.changes.filter((c) => c.status === 'parking').map((c) => `<button type="button" class="btn" data-pick="${esc(c.name)}" title="Parking lot: deferred items, never archived">Parking lot · ${c.tasks ? `${c.tasks.total - c.tasks.done} open` : esc(c.name)}</button>`).join('')}
      ${(() => { const n = s.changes.filter((c) => c.status === 'idea').length; return n ? `<button type="button" class="btn" data-board-view="backlog" title="Ideas that still need refinement before they are planned">💡 ${n} idea${n > 1 ? 's' : ''}</button>` : ''; })()}
      <span class="ms-filter">${msBtn('', '<b>All</b>', s.changes.filter(isTicket))}${s.milestones.map((m) => msBtn(m.id, `<b>${esc(m.id)}</b><span class="ms-name">${esc(m.title)}</span>`, s.changes.filter((c) => c.milestone === m.id), m.title)).join('')}</span>
      <span class="board-actions">${AGENT_TOKEN ? '<button class="btn board-toggle" type="button" data-chat-btn aria-controls="agent">Chat</button>' : ''}
      <button class="btn board-toggle" type="button" data-board-focus aria-pressed="${ui.boardFocus}" title="${ui.boardFocus ? 'Show the archived changes again' : ui.boardView === 'charts' ? 'Open work only: no archived band in the flow, no archived changes in the cycle times and the dependency graph' : 'Hide archived tickets and fold empty columns, so the open tickets get the space'}">${ui.boardFocus ? '◉ Focus' : '○ Focus'}</button>
      <button class="btn board-toggle" type="button" data-max aria-pressed="${max}" title="${max ? 'Back to the dashboard (Esc)' : 'Show the board across the whole window'}">${max ? 'Exit full screen ✕' : '⤢ Full screen'}</button></span>
    </div>
    ${now}
    <div class="board-body">
    ${ui.boardView === 'charts' ? chartsHtml(s, shown) : ui.boardView === 'backlog' ? backlogHtml(s, shown, (max && ui.drawer) || ui.lastPick || focusName) : `<div class="cols ${focus ? 'focus' : ''}" ${focus ? `style="--cols:${visibleCols.map(([k]) => (byCol[k].length ? 'minmax(0, 1fr)' : '46px')).join(' ')}"` : ''}>${visibleCols.map(([key, title, desc, v]) => {
      const cs = byCol[key];
      if (focus && !cs.length) return `<section class="col folded" style="--st:var(${v})" aria-label="${title}: none" title="${title}: none"><div class="col-head"><div class="t"><span class="num">0</span><span class="vt">${title}</span></div></div></section>`;
      return `<section class="col" style="--st:var(${v})" aria-label="${title}">
        <div class="col-head"><div class="t">${title}<span class="num">${cs.length}</span></div><div class="d">${desc}</div></div>
        <div class="col-body" data-col="${key}">${cs.map(card).join('') || '<div class="col-empty">None</div>'}</div>
      </section>`;
    }).join('')}</div>`}
    ${max && ui.drawer ? '<aside class="drawer" id="drawer" aria-label="Change details" data-keep-children></aside>' : ''}
    </div>`);
  if (ui.boardView === 'charts') drawCharts(s);
  board.style.minHeight = '';
  if (!max && window.scrollY !== keepY) window.scrollTo(0, keepY);
  for (const el of board.querySelectorAll('[data-col]')) { const y = ui.colScroll.get(el.dataset.col) ?? 0; if (el.scrollTop !== y) el.scrollTop = y; }
  if (ui.blMoved) { const r = board.querySelector(`.bl-row[data-bl="${CSS.escape(ui.blMoved)}"]`); if (r) { r.classList.add('moved'); r.focus({ preventScroll: true }); } ui.blMoved = null; }
  if (max && ui.drawer) renderFocus(s, $('drawer'), ui.drawer);
  if (ui.boardView === 'charts') loadTimeline();
}

// ------------------------------------------------------------ charts: how the work flows over time
// Data: /api/timeline merges git (every commit touching openspec/changes or openspec/backlog) with the history this
// dashboard records while it runs; per change and status, and per task, the earliest time wins. Colours: a chart
// palette of its own (--cf-*), checked for colour-vision deficiency in light and dark; every chart also has direct
// labels, a legend or a data table, so no value depends on colour alone.
const CF = [ // stacking order, bottom to top
  ['archived', 'Archived', '--cf-archived'],
  ['complete', 'Tasks done', '--cf-complete'],
  ['in-progress', 'In progress', '--cf-progress'],
  ['specified', 'Specified', '--cf-specified'],
  ['proposed', 'Draft', '--cf-draft'],
];
const CF_LABEL = Object.fromEntries(CF.map(([k, l]) => [k, l]));
const CF_VAR = Object.fromEntries(CF.map(([k, , v]) => [k, `var(${v})`]));
const RANK = { proposed: 0, specified: 1, 'in-progress': 2, complete: 3, archived: 4 };
const tl = { data: null, at: 0, rev: -1, loading: false, project: null, error: null };
const chartGeo = new Map();

// the code statistics (/api/code): asked for with the charts, again after a minute
const cs = { data: null, at: 0, loading: false, project: null, error: null };
async function loadCode() {
  if (cs.loading || (cs.data && cs.project === PROJECT && Date.now() - cs.at < 60000)) return;
  cs.loading = true;
  try { const r = await fetch(withProject('/api/code')); if (!r.ok) throw new Error(`HTTP ${r.status}`); cs.data = await r.json(); cs.error = null; } catch (e) { cs.error = e.message; }
  cs.at = Date.now(); cs.project = PROJECT; cs.loading = false;
  if (ui.boardView === 'charts' && ui.state) drawCharts(ui.state);
}
async function loadTimeline() {
  loadCode();
  if (tl.loading) return;
  const s = ui.state;
  if (tl.data && tl.project === PROJECT && tl.rev === s?.rev && Date.now() - tl.at < 60000) return;
  tl.loading = true;
  try {
    const r = await fetch(withProject('/api/timeline'));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    tl.data = await r.json();
    tl.error = null;
  } catch (e) { tl.error = e.message; }
  tl.at = Date.now(); tl.rev = s?.rev; tl.project = PROJECT; tl.loading = false;
  if (ui.boardView === 'charts' && ui.state) renderBoard(ui.state);
}

const dur = (ms) => {
  if (ms == null || !isFinite(ms)) return '—';
  const m = ms / 60000;
  if (m < 1) return '< 1 min';
  if (m < 90) return `${Math.round(m)} min`;
  const h = m / 60;
  if (h < 48) return `${h < 10 ? h.toFixed(1).replace(/\.0$/, '') : Math.round(h)} h`;
  return `${(h / 24).toFixed(h < 240 ? 1 : 0).replace(/\.0$/, '')} d`;
};
const median = (xs) => { const a = xs.filter((x) => x != null && isFinite(x)).sort((p, q) => p - q); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
const dayFmt = (t) => new Date(t).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
const whenFmt = (t) => `${new Date(t).toLocaleDateString([], { day: 'numeric', month: 'short' })} ${hhmm(t)}`;
const tipAttr = (lines) => `data-tip="${esc([].concat(lines).join('\n'))}"`;

// Readable ticks for a time axis: local hours/minutes for spans under two days, dates beyond.
function timeTicks(t0, t1, maxTicks) {
  const M = 60000, H = 60 * M, D = 24 * H;
  const steps = [5 * M, 10 * M, 15 * M, 30 * M, H, 2 * H, 3 * H, 6 * H, 12 * H, D, 2 * D, 7 * D, 14 * D, 30 * D, 91 * D];
  const step = steps.find((x) => (t1 - t0) / x <= maxTicks) ?? steps.at(-1);
  const off = new Date(t0).getTimezoneOffset() * M;
  const out = [];
  for (let t = Math.ceil((t0 - off) / step) * step + off; t <= t1; t += step) {
    const d = new Date(t);
    const midnight = d.getHours() === 0 && d.getMinutes() === 0;
    out.push({ t, label: step >= D || (midnight && step >= H) ? d.toLocaleDateString([], { day: 'numeric', month: 'short' }) : hhmm(t) });
  }
  return out;
}

// Per change: first time it reached each status (merged, monotonic), from the timeline plus the current files.
function changeTimes(s) {
  const by = new Map();
  for (const x of tl.data?.transitions ?? []) (by.get(x.change) ?? by.set(x.change, {}).get(x.change))[x.to] ??= x.t;
  for (const c of s.changes) {
    const m = by.get(c.name) ?? by.set(c.name, {}).get(c.name);
    if (c.status in RANK && m[c.status] == null) m[c.status] = c.lastModified ?? Date.now();
  }
  return by;
}
// Status of a change at time t: the furthest status reached by then.
function statusAt(times, t) {
  let best = null;
  for (const k in times) if (times[k] <= t && (best == null || RANK[k] > RANK[best])) best = k;
  return best;
}

function chartsHtml(s, shown) {
  if (!tl.data && !tl.error) return '<div class="charts"><div class="empty" style="padding:24px">Loading the timeline…</div></div>';
  const card = (id, title, sub, wide) => `<section class="ch-card ${wide ? 'wide' : ''}" aria-labelledby="ch-${id}-t">
      <div class="ch-head"><h3 id="ch-${id}-t">${title}</h3><span class="ch-sub" id="ch-${id}-sub">${sub}</span></div>
      <div class="ch-plot" data-chart="${id}" data-keep-children></div>
    </section>`;
  return `<div class="charts" data-col="charts">
    ${tl.error ? `<div class="bl-note warn">✕ Timeline not available: ${esc(tl.error)}</div>` : ''}
    ${card('cfd', 'Cumulative flow', 'Changes per status over time. A widening band is work piling up there.', true)}
    ${card('burn', 'Milestone burn-up', '', false)}
    ${card('aging', 'Work in progress: age', 'How long each open change has been in its status, against the typical time.', false)}
    ${card('gantt', 'Cycle time per change', 'Each change from specified to archived, split into its phases.', true)}
    ${card('deps', 'Dependencies and critical path', 'The roadmap as a graph. The highlighted chain is the longest one still open.', true)}
    ${card('heat', 'When tasks get checked off', 'Check-offs per hour of the day.', true)}
    <h3 class="ch-section">Code</h3>
    ${card('codeLines', 'Lines over time', 'Non-empty lines of code, tests, docs and specs, at up to 12 commits and now (the working tree).', true)}
    ${card('codeLangs', 'Languages', 'Code and tests by language, non-empty lines.', false)}
    ${card('codeQuality', 'Quality', 'Test coverage from the last report the build wrote, and a few ratios.', false)}
  </div>`;
}

function drawCharts(s) {
  if (!s || ui.boardView !== 'charts') return;
  const shownNames = new Set(chartShown(s).map((c) => c.name));
  const times = changeTimes(s);
  for (const el of document.querySelectorAll('.ch-plot[data-chart]')) {
    const W = Math.max(280, Math.floor(el.clientWidth));
    const id = el.dataset.chart;
    try {
      morphHtml(el, { cfd: cfdChart, burn: burnChart, aging: agingChart, gantt: ganttChart, heat: heatChart, deps: depsChart, codeLines: codeLinesChart, codeLangs: codeLangsChart, codeQuality: codeQualityChart }[id](s, shownNames, times, W));
    } catch (e) { el.innerHTML = `<div class="empty">✕ ${esc(e.message)}</div>`; console.error(e); }
  }
}
const chartShown = (s) => s.changes.filter((c) => isTicket(c) && c.status !== 'missing' && (!ui.ms || c.milestone === ui.ms));

// Shared axis frame for time charts.
function timeFrame(W, H, t0, t1, maxY, { L = 34, R = 16, T = 10, B = 24 } = {}) {
  const x = (t) => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - v / Math.max(1, maxY)) * (H - T - B);
  const mag = 10 ** Math.floor(Math.log10(Math.max(1, maxY / 5)));
  const yStep = maxY <= 6 ? 1 : maxY <= 12 ? 2 : maxY <= 30 ? 5 : maxY <= 60 ? 10 : [1, 2, 2.5, 5, 10].map((m) => m * mag).find((x) => maxY / x <= 6); // round steps
  let grid = '';
  for (let v = 0; v <= maxY; v += yStep) grid += `<line class="ch-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  for (const k of timeTicks(t0, t1, Math.max(2, Math.floor((W - L - R) / 80)))) grid += `<text class="ch-ax" x="${x(k.t)}" y="${H - 6}" text-anchor="middle">${k.label}</text>`;
  return { x, y, grid, L, R, T, B };
}

// ---- cumulative flow
function cfdChart(s, shownNames, times, W) {
  const BANDS = ui.boardFocus ? CF.filter(([k]) => k !== 'archived') : CF; // focus: open work only
  const names = [...shownNames].filter((n) => times.get(n) && Object.keys(times.get(n)).length);
  const ts = [...new Set(names.flatMap((n) => Object.values(times.get(n))))].sort((a, b) => a - b);
  const now = Date.now();
  if (ts.length < 2) return '<div class="empty">Not enough history yet: the flow appears after the first status changes (from git or while the dashboard runs).</div>';
  const t0 = ts[0], t1 = now;
  const pts = [...ts.filter((t) => t <= now), now].map((t) => {
    const n = Object.fromEntries(BANDS.map(([k]) => [k, 0]));
    for (const name of names) { const st = statusAt(times.get(name), t); if (st && st in n) n[st]++; }
    return { t, n };
  });
  const maxY = Math.max(...pts.map((p) => BANDS.reduce((a, [k]) => a + p.n[k], 0)));
  const H = 240;
  const f = timeFrame(W, H, t0, t1, maxY, { R: 104 });
  let bands = '', gaps = '', labels = '';
  const cum = pts.map(() => 0);
  const lastY = [];
  for (const [k, label, v] of BANDS) {
    const lo = cum.slice();
    pts.forEach((p, i) => { cum[i] += p.n[k]; });
    if (!pts.some((p) => p.n[k])) continue;
    // step area: hold each value until the next change
    let top = '', bottom = '';
    pts.forEach((p, i) => { const nx = i + 1 < pts.length ? f.x(pts[i + 1].t) : f.x(t1); top += `${i ? 'L' : 'M'}${f.x(p.t)},${f.y(cum[i])}L${nx},${f.y(cum[i])}`; });
    for (let i = pts.length - 1; i >= 0; i--) { const nx = i + 1 < pts.length ? f.x(pts[i + 1].t) : f.x(t1); bottom += `L${nx},${f.y(lo[i])}L${f.x(pts[i].t)},${f.y(lo[i])}`; }
    bands += `<path d="${top}${bottom}Z" fill="${CF_VAR[k]}" fill-opacity=".88"/>`;
    gaps += `<path d="${top}" fill="none" stroke="var(--surface)" stroke-width="2"/>`;
    const yMid = (f.y(cum.at(-1)) + f.y(lo.at(-1))) / 2, hgt = f.y(lo.at(-1)) - f.y(cum.at(-1));
    if (hgt >= 3) lastY.push({ k, label, y: yMid, n: pts.at(-1).n[k] });
  }
  // direct labels at the right end, nudged apart so they never overlap
  lastY.sort((a, b) => a.y - b.y);
  for (let i = 1; i < lastY.length; i++) if (lastY[i].y - lastY[i - 1].y < 15) lastY[i].y = lastY[i - 1].y + 15;
  for (const l of lastY) labels += `<rect x="${W - f.R + 8}" y="${l.y - 5}" width="8" height="8" rx="2" fill="${CF_VAR[l.k]}"/><text class="ch-lbl" x="${W - f.R + 20}" y="${l.y + 3.5}">${l.label} <tspan class="ch-num">${l.n}</tspan></text>`;
  chartGeo.set('cfd', { x: f.x, t0, t1, rows: pts.map((p) => ({ t: p.t, lines: [whenFmt(p.t), ...BANDS.slice().reverse().filter(([k]) => p.n[k]).map(([k, l]) => `${l}: ${p.n[k]}`)] })) });
  const legend = `<div class="ch-legend">${BANDS.slice().reverse().map(([k, l]) => `<span><i style="background:${CF_VAR[k]}"></i>${l}</span>`).join('')}</div>`;
  const table = `<details class="ch-data"><summary>Data</summary><table><thead><tr><th>Time</th>${BANDS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>${pts.slice(-40).reverse().map((p) => `<tr><td>${whenFmt(p.t)}</td>${BANDS.map(([k]) => `<td>${p.n[k]}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
  return `${legend}<svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative flow: ${lastY.map((l) => `${l.label} ${l.n}`).join(', ')}">
    ${f.grid}${bands}${gaps}${labels}
    <line class="ch-cross" x1="0" x2="0" y1="${f.T}" y2="${H - f.B}" visibility="hidden"/>
    <rect class="ch-hit" data-xhover="cfd" x="${f.L}" y="0" width="${W - f.L - f.R}" height="${H - f.B}"/>
  </svg>${table}`;
}

// ---- milestone burn-up with a forecast from the recent pace
function burnChart(s, shownNames, times, W) {
  const cur = currentChange(s);
  const ms = ui.ms || cur?.milestone || '';
  const m = s.milestones.find((x) => x.id === ms);
  const scope = s.changes.filter((c) => isTicket(c) && c.status !== 'missing' && (!ms || c.milestone === ms));
  const sub = $('ch-burn-sub');
  if (sub) sub.textContent = ms ? `${ms} "${m?.title ?? ''}": changes done against the changes planned${ui.ms ? '' : ' (the current milestone; pick another above)'}.` : 'All changes: done against planned.';
  const born = (c) => { const t = times.get(c.name); return t ? Math.min(...Object.values(t)) : null; };
  const doneAt = (c) => { const t = times.get(c.name) ?? {}; const xs = [t.complete, t.archived].filter((v) => v != null); return xs.length ? Math.min(...xs) : null; };
  const evs = scope.map((c) => ({ c, born: born(c), done: doneAt(c) })).filter((e) => e.born != null);
  if (!evs.length) return '<div class="empty">No changes in this milestone yet.</div>';
  const now = Date.now();
  const t0 = Math.min(...evs.map((e) => e.born));
  const ts = [...new Set([t0, ...evs.map((e) => e.born), ...evs.map((e) => e.done).filter((v) => v != null), now])].filter((t) => t <= now).sort((a, b) => a - b);
  const pts = ts.map((t) => ({ t, scope: evs.filter((e) => e.born <= t).length, done: evs.filter((e) => e.done != null && e.done <= t).length }));
  const last = pts.at(-1);
  const doneTimes = evs.map((e) => e.done).filter((v) => v != null).sort((a, b) => a - b);
  const recent = doneTimes.slice(-6);
  const remaining = last.scope - last.done;
  let eta = null, pace = null;
  if (remaining > 0 && recent.length >= 2 && recent.at(-1) > recent[0]) {
    pace = (recent.at(-1) - recent[0]) / (recent.length - 1); // ms per change
    eta = now + remaining * pace;
  }
  const span = now - t0;
  const showEta = eta && eta - now <= Math.max(span, 3600e3) * 1.5;
  const t1 = showEta ? eta : now;
  const H = 210;
  const f = timeFrame(W, H, t0, t1, Math.max(1, ...pts.map((p) => p.scope)), { R: 40 });
  const step = (k) => pts.reduce((d, p, i) => d + (i ? `H${f.x(p.t)}V${f.y(p[k])}` : `M${f.x(p.t)},${f.y(p[k])}`), '') + `H${f.x(now)}`;
  chartGeo.set('burn', { x: f.x, t0, t1: now, rows: pts.map((p) => ({ t: p.t, lines: [whenFmt(p.t), `Done: ${p.done}`, `Planned: ${p.scope}`] })) });
  const note = remaining === 0 ? `All ${last.scope} done.`
    : pace ? `${last.done} of ${last.scope} done. At the recent pace (one change every ${dur(pace)}) the remaining ${remaining} take about ${dur(remaining * pace)}: ${whenFmt(eta)}.`
    : `${last.done} of ${last.scope} done. A forecast needs at least two finished changes.`;
  return `<div class="ch-legend"><span><i style="background:var(--cf-complete)"></i>Done</span><span><i class="line"></i>Planned</span>${showEta ? '<span><i class="dash"></i>Forecast</span>' : ''}</div>
  <svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(note)}">
    ${f.grid}
    <path d="${step('scope')}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
    <path d="${step('done')}V${f.y(0)}H${f.x(t0)}Z" fill="var(--cf-complete)" fill-opacity=".12"/>
    <path d="${step('done')}" fill="none" stroke="var(--cf-complete)" stroke-width="2" stroke-linejoin="round"/>
    ${showEta ? `<path d="M${f.x(now)},${f.y(last.done)}L${f.x(eta)},${f.y(last.scope)}" fill="none" stroke="var(--cf-complete)" stroke-width="2" stroke-dasharray="5 4"/>
      <circle cx="${f.x(eta)}" cy="${f.y(last.scope)}" r="4" fill="var(--surface)" stroke="var(--cf-complete)" stroke-width="2" ${tipAttr(['Forecast', whenFmt(eta)])}/>` : ''}
    <circle cx="${f.x(now)}" cy="${f.y(last.done)}" r="4.5" fill="var(--cf-complete)" stroke="var(--surface)" stroke-width="2"/>
    <text class="ch-lbl" x="${f.x(now) + 8}" y="${f.y(last.done) + 4}">${last.done}</text>
    <text class="ch-lbl muted" x="${f.x(now) + 8}" y="${f.y(last.scope) - 4}">${last.scope}</text>
    <line class="ch-cross" x1="0" x2="0" y1="${f.T}" y2="${H - f.B}" visibility="hidden"/>
    <rect class="ch-hit" data-xhover="burn" x="${f.L}" y="0" width="${f.x(now) - f.L}" height="${H - f.B}"/>
  </svg>
  <p class="ch-note">${esc(note)} The pace counts changes, not tasks: tasks only exist once a change is specified.</p>`;
}

// ---- code: lines over time per kind (stacked), languages (bars), quality (coverage and ratios)
const CODE_KINDS = [['code', 'Code', '--cf-specified'], ['tests', 'Tests', '--cf-complete'], ['docs', 'Docs', '--cf-archived'], ['specs', 'Specs (openspec/)', '--cf-draft']];
const kNum = (n) => (n >= 10000 ? `${Math.round(n / 1000)}k` : n >= 1000 ? `${(n / 1000).toFixed(1).replace(/\.0$/, '')}k` : String(n));
const codeEmpty = () => (cs.error ? `<div class="empty">✕ ${esc(cs.error)}</div>` : !cs.data ? '<div class="empty">Counting the lines…</div>' : cs.data.git === false ? '<div class="empty">The code statistics need a git repository.</div>' : null);
function codeLinesChart(s, shownNames, times, W) {
  const e = codeEmpty(); if (e) return e;
  const d = cs.data, pts = [...d.history, { t: Date.now(), h: 'now', kinds: d.kinds }];
  if (pts.length < 2 || pts[0].t === pts.at(-1).t) pts.unshift({ ...pts[0], t: pts[0].t - 3600e3 });
  const tot = (p) => CODE_KINDS.reduce((a, [k]) => a + (p.kinds[k] ?? 0), 0);
  const H = 230, maxY = Math.max(10, ...pts.map(tot));
  const f = timeFrame(W, H, pts[0].t, pts.at(-1).t, maxY, { L: 44, R: 124 });
  f.grid = f.grid.replace(/(<text class="ch-ax" x="[\d.]+" y="[\d.]+" text-anchor="end">)(\d+)(<\/text>)/g, (m, a, v, b) => a + kNum(Number(v)) + b);
  let bands = '', labels = '';
  const cum = pts.map(() => 0), lastY = [];
  for (const [k, label, v] of CODE_KINDS) {
    const lo = cum.slice();
    pts.forEach((p, i) => { cum[i] += p.kinds[k] ?? 0; });
    if (!pts.some((p) => p.kinds[k])) continue;
    const top = pts.map((p, i) => `${i ? 'L' : 'M'}${f.x(p.t)},${f.y(cum[i])}`).join('');
    const bottom = pts.map((p, i) => `L${f.x(p.t)},${f.y(lo[i])}`).reverse().join('');
    bands += `<path d="${top}${bottom}Z" fill="var(${v})" fill-opacity=".85"/><path d="${top}" fill="none" stroke="var(--surface)" stroke-width="2"/>`;
    const yMid = (f.y(cum.at(-1)) + f.y(lo.at(-1))) / 2;
    if (f.y(lo.at(-1)) - f.y(cum.at(-1)) >= 2) lastY.push({ v, label, y: yMid, n: pts.at(-1).kinds[k] });
  }
  lastY.sort((a, b) => a.y - b.y);
  for (let i = 1; i < lastY.length; i++) if (lastY[i].y - lastY[i - 1].y < 15) lastY[i].y = lastY[i - 1].y + 15;
  for (const l of lastY) labels += `<rect x="${W - f.R + 8}" y="${l.y - 5}" width="8" height="8" rx="2" fill="var(${l.v})"/><text class="ch-lbl" x="${W - f.R + 20}" y="${l.y + 3.5}">${esc(l.label.replace(/ \(.*/, ''))} <tspan class="ch-num">${kNum(l.n)}</tspan></text>`;
  const row = (p) => [p.h === 'now' ? 'Now (working tree)' : `${whenFmt(p.t)} · ${p.h}`, ...CODE_KINDS.slice().reverse().map(([k, l]) => `${l}: ${(p.kinds[k] ?? 0).toLocaleString()}`)];
  chartGeo.set('codeLines', { x: f.x, t0: pts[0].t, t1: pts.at(-1).t, rows: pts.map((p) => ({ t: p.t, lines: row(p) })) });
  const legend = `<div class="ch-legend">${CODE_KINDS.slice().reverse().map(([, l, v]) => `<span><i style="background:var(${v})"></i>${l}</span>`).join('')}</div>`;
  const table = `<details class="ch-data"><summary>Data</summary><table><thead><tr><th>Commit</th>${CODE_KINDS.map(([, l]) => `<th>${l}</th>`).join('')}<th>Config</th></tr></thead><tbody>${pts.slice().reverse().map((p) => `<tr><td>${p.h === 'now' ? 'now' : `${whenFmt(p.t)} · ${p.h}`}</td>${CODE_KINDS.map(([k]) => `<td>${(p.kinds[k] ?? 0).toLocaleString()}</td>`).join('')}<td>${(p.kinds.config ?? 0).toLocaleString()}</td></tr>`).join('')}</tbody></table></details>`;
  return `${legend}<svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lines now: ${lastY.map((l) => `${l.label} ${l.n}`).join(', ')}">${f.grid}${bands}${labels}
    <line class="ch-cross" x1="0" x2="0" y1="${f.T}" y2="${H - f.B}" visibility="hidden"/>
    <rect class="ch-hit" data-xhover="codeLines" x="${f.L}" y="0" width="${W - f.L - f.R}" height="${H - f.B}"/></svg>${table}
    <p class="ch-note">Config files (JSON, YAML, XML, …) are counted apart (${kNum(d.kinds.config ?? 0)} lines, in the data); lock files, minified and build output are left out.</p>`;
}
function codeLangsChart(s, shownNames, times, W) {
  const e = codeEmpty(); if (e) return e;

  if (!sum) return '<div class="empty">No code yet.</div>';

  const max = top[0][1];
  return `<div class="cl-bars" role="list">${top.map(([lang, n]) => {

  }).join('')}</div><p class="ch-note">${sum.toLocaleString()} lines of code and tests in ${all.length} language${all.length === 1 ? '' : 's'}.</p>`;

function codeQualityChart(s, shownNames, times, W) {
  const e = codeEmpty(); if (e) return e;
  const d = cs.data, k = d.kinds, cov = d.coverage, hist = d.coverageHistory ?? [];
  const ratio = (a, b) => (b ? (a / b).toFixed(2).replace(/0$/, '') : '—');
  let spark = '';
  if (hist.length >= 2) {
    const w = 120, h = 28, t0 = hist[0].t, t1 = hist.at(-1).t, lo = Math.min(...hist.map((x) => x.pct)), hi = Math.max(...hist.map((x) => x.pct));
    const x = (t) => ((t - t0) / Math.max(1, t1 - t0)) * w, y = (v) => h - 3 - ((v - lo) / Math.max(1, hi - lo)) * (h - 6);
    spark = `<svg class="cq-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Coverage from ${hist[0].pct} % to ${hist.at(-1).pct} %"><path d="${hist.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.pct).toFixed(1)}`).join('')}" fill="none" stroke="var(--cf-complete)" stroke-width="2"/><circle cx="${x(t1)}" cy="${y(hist.at(-1).pct)}" r="3" fill="var(--cf-complete)"/></svg>`;
  }
  const tile = (label, value, sub) => `<div class="cq-tile"><span class="cq-l">${label}</span><span class="cq-v ch-num">${value}</span>${sub ? `<span class="cq-s">${sub}</span>` : ''}</div>`;
  return `<div class="cq-grid">
    ${tile('Test coverage', cov ? `${cov.pct} %` : '—', cov ? `${cov.covered.toLocaleString()} of ${cov.total.toLocaleString()} lines · <span title="${esc(cov.file)}">${esc(cov.file.split('/').slice(-3).join('/'))}</span>, ${ago(cov.t)}${spark ? `<br>${spark}` : ''}` : 'no report found (lcov, JaCoCo, Cobertura, Istanbul summary)')}
    ${tile('Test lines per code line', ratio(k.tests, k.code), `${kNum(k.tests)} test lines, ${kNum(k.code)} code lines`)}
    ${tile('Docs and specs per 100 code lines', k.code ? Math.round(((k.docs + k.specs) / k.code) * 100) : '—', `${kNum(k.docs)} docs, ${kNum(k.specs)} specs`)}
    ${tile('TODO / FIXME', d.todos, 'markers in code and tests')}
    </div>
    ${d.largest?.length ? `<div class="cq-largest"><b>Largest files</b>${d.largest.map((x) => `<div class="cq-f" title="${esc(x.file)}"><span>${esc(x.file.split('/').slice(-2).join('/'))}</span><span class="ch-num">${x.lines}</span></div>`).join('')}</div>` : ''}`;
}
// Phases of each change: specified → in progress → tasks done → archived.
const PHASES = [['specified', 'in-progress'], ['in-progress', 'complete'], ['complete', 'archived']];
function phasesOf(t, now) {
  return PHASES.map(([from, to]) => {
    if (t[from] == null) return null;
    const end = t[to] ?? (Object.entries(t).some(([k, v]) => RANK[k] > RANK[from] && v != null) ? Math.min(...Object.entries(t).filter(([k]) => RANK[k] > RANK[from]).map(([, v]) => v)) : null);
    return { k: from, start: t[from], end: end ?? now, open: end == null };
  }).filter(Boolean);
}

// ---- cycle time per change (a Gantt of the phases)
function ganttChart(s, shownNames, times, W) {
  const now = Date.now();
  const scopeBy = new Map();
  for (const x of tl.data?.scope ?? []) scopeBy.set(x.change, (scopeBy.get(x.change) ?? 0) + x.added);
  const all = [...shownNames].map((n) => ({ n, c: s.changes.find((x) => x.name === n), t: times.get(n) ?? {} }))
    .filter((r) => r.t.specified != null || r.t['in-progress'] != null || r.t.complete != null || r.t.archived != null)
    .map((r) => ({ ...r, ph: phasesOf(r.t, now), start: Math.min(...['specified', 'in-progress', 'complete', 'archived'].map((k) => r.t[k]).filter((v) => v != null)) }))
    .sort((a, b) => a.start - b.start);
  const finished = all.filter((r) => r.t.specified != null && (r.t.archived ?? r.t.complete) != null)
    .map((r) => ({ total: (r.t.archived ?? r.t.complete) - r.t.specified, ph: r.ph }));
  const rows = all.filter((r) => !(ui.boardFocus && r.c?.status === 'archived')).slice(-30);
  if (!rows.length) return `<div class="empty">${all.length ? 'Every change here is archived (focus mode hides them).' : 'No change has been specified yet.'}</div>`;
  const t0 = Math.min(...rows.map((r) => r.start)), t1 = now;
  const LBL = Math.min(230, Math.max(150, W * 0.28)), RT = 120, rowH = 24, T = 6;
  const H = T + rows.length * rowH + 26;
  const x = (t) => LBL + ((t - t0) / Math.max(1, t1 - t0)) * (W - LBL - RT);
  let g = '';
  for (const k of timeTicks(t0, t1, Math.max(2, Math.floor((W - LBL - RT) / 80)))) g += `<line class="ch-grid" x1="${x(k.t)}" x2="${x(k.t)}" y1="${T}" y2="${H - 22}"/><text class="ch-ax" x="${x(k.t)}" y="${H - 6}" text-anchor="middle">${k.label}</text>`;
  rows.forEach((r, i) => {
    const y = T + i * rowH + 6, h = 12;
    const lab = `#${r.c?.inRoadmap ? r.c.order : '–'} ${title(r.n)}`;
    g += `<text class="ch-lbl ch-row" x="${LBL - 10}" y="${y + 10}" text-anchor="end" data-pick="${esc(r.n)}">${esc(lab.length > 34 ? lab.slice(0, 33) + '…' : lab)}<title>${esc(r.n)}</title></text>`;
    let any = false;
    for (const p of r.ph) {
      const x0 = x(p.start), x1 = Math.max(x(p.end), x0 + 2);
      const w = Math.max(2, x1 - x0 - (p.open ? 0 : 2)); // 2px surface gap between phases
      g += `<rect x="${x0}" y="${y}" width="${w}" height="${h}" rx="${Math.min(4, w / 2)}" fill="${CF_VAR[p.k]}" ${p.open ? 'fill-opacity=".55"' : ''} ${tipAttr([r.n, `${CF_LABEL[p.k]}${p.open ? ' (still)' : ''}`, `${whenFmt(p.start)} → ${p.open ? 'now' : whenFmt(p.end)}`, dur(p.end - p.start)])}/>`;
      any = true;
    }
    if (r.t.archived != null) g += `<circle cx="${x(r.t.archived)}" cy="${y + h / 2}" r="4" fill="${CF_VAR.archived}" stroke="var(--surface)" stroke-width="2" ${tipAttr([r.n, `Archived ${whenFmt(r.t.archived)}`, ...(any ? [] : ['earlier phases not recorded (one commit)'])])}/>`;
    const st = r.t.specified ?? r.start;
    const end = r.t.archived ?? r.t.complete;
    const total = end != null ? end - st : now - st;
    const extra = scopeBy.get(r.n);
    g += `<text class="ch-lbl" x="${W - RT + 10}" y="${y + 10}">${r.t.specified == null ? '<tspan class="muted">—</tspan>' : `${end == null ? '<tspan class="muted">open </tspan>' : ''}${dur(total)}`}${extra ? ` <tspan class="ch-warn">+${extra} task${extra > 1 ? 's' : ''}</tspan>` : ''}</text>`;
  });
  g += `<line class="ch-now" x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H - 22}"/>`;
  const med = median(finished.map((f) => f.total));
  const medPh = Object.fromEntries(PHASES.map(([k]) => [k, median(finished.flatMap((f) => f.ph.filter((p) => p.k === k && !p.open).map((p) => p.end - p.start)))]));
  const sub = $('ch-gantt-sub');
  if (sub && med != null) sub.textContent = `From specified to done. Median ${dur(med)} over ${finished.length} change${finished.length > 1 ? 's' : ''}: specifying ${dur(medPh.specified)}, implementing ${dur(medPh['in-progress'])}, review and archive ${dur(medPh.complete)}.`;
  const legend = `<div class="ch-legend">${PHASES.map(([k]) => `<span><i style="background:${CF_VAR[k]}"></i>${CF_LABEL[k]}</span>`).join('')}<span><i class="dot" style="background:${CF_VAR.archived}"></i>Archived</span><span class="muted">pale = still in that phase · <span class="ch-warn">+n tasks</span> = added after work started</span></div>`;
  const table = `<details class="ch-data"><summary>Data</summary><table><thead><tr><th>Change</th><th>Specified</th><th>In progress</th><th>Tasks done</th><th>Archived</th><th>Cycle time</th></tr></thead><tbody>${rows.slice().reverse().map((r) => `<tr><td>${esc(r.n)}</td>${['specified', 'in-progress', 'complete', 'archived'].map((k) => `<td>${r.t[k] != null ? whenFmt(r.t[k]) : '—'}</td>`).join('')}<td>${r.t.specified != null ? dur((r.t.archived ?? r.t.complete ?? now) - r.t.specified) : '—'}</td></tr>`).join('')}</tbody></table></details>`;
  return `${legend}<svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cycle time per change">${g}</svg>${table}`;
}

// ---- age of the open changes in their current status, against the median of finished ones
function agingChart(s, shownNames, times, W) {
  const now = Date.now();
  const open = s.changes.filter((c) => shownNames.has(c.name) && ['specified', 'in-progress', 'complete'].includes(c.status));
  if (!open.length) return '<div class="empty">Nothing open right now: no change is specified, in progress or waiting to be archived.</div>';
  const typical = {};
  for (const [k] of PHASES) typical[k] = median([...times.entries()].map(([, t]) => phasesOf(t, now).find((p) => p.k === k && !p.open)).filter(Boolean).map((p) => p.end - p.start));
  const rows = open.map((c) => { const since = times.get(c.name)?.[c.status] ?? c.lastModified ?? now; return { c, age: now - since, typ: typical[c.status] }; })
    .sort((a, b) => b.age - a.age);
  const maxV = Math.max(...rows.map((r) => Math.max(r.age, r.typ ?? 0))) * 1.08;
  const LBL = Math.min(190, W * 0.4), R = 130, rowH = 34, T = 4;
  const H = T + rows.length * rowH + 4;
  const x = (v) => LBL + (v / maxV) * (W - LBL - R);
  let g = '';
  rows.forEach((r, i) => {
    const y = T + i * rowH;
    const slow = r.typ && r.age > 2 * r.typ;
    g += `<text class="ch-lbl ch-row" x="0" y="${y + 13}" data-pick="${esc(r.c.name)}">${esc(title(r.c.name).slice(0, 30))}<title>${esc(r.c.name)}</title></text>
      <text class="ch-ax" x="0" y="${y + 27}">${CF_LABEL[r.c.status]}${slow ? ' · ⚠ longer than usual' : ''}</text>
      <rect x="${LBL}" y="${y + 9}" width="${Math.max(3, x(r.age) - LBL)}" height="12" rx="4" fill="${CF_VAR[r.c.status]}" ${tipAttr([r.c.name, `${CF_LABEL[r.c.status]} for ${dur(r.age)}`, r.typ ? `typical: ${dur(r.typ)}` : 'no finished change to compare with yet'])}/>
      ${r.typ ? `<line x1="${x(r.typ)}" x2="${x(r.typ)}" y1="${y + 4}" y2="${y + 26}" stroke="var(--ink)" stroke-width="2" ${tipAttr([`typical ${CF_LABEL[r.c.status]}: ${dur(r.typ)}`])}/>` : ''}
      <text class="ch-lbl" x="${Math.max(x(r.age), r.typ ? x(r.typ) : 0) + 8}" y="${y + 19}">${dur(r.age)}${r.typ ? `<tspan class="muted"> / typ. ${dur(r.typ)}</tspan>` : ''}</text>`;
  });
  return `<div class="ch-legend"><span><i class="tick"></i>typical time in that status (median of finished changes)</span></div><svg class="ch-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Age of open changes">${g}</svg>`;
}

// ---- check-offs by day and hour
function heatChart(s, shownNames, times, W) {
  const checks = (tl.data?.checks ?? []).filter((x) => shownNames.has(x.change));
  if (!checks.length) return '<div class="empty">No checked-off tasks recorded yet.</div>';
  const dayKey = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const days = [...new Set(checks.map((x) => dayKey(x.t)))].sort((a, b) => a - b).slice(-14);
  const cell = new Map();
  for (const x of checks) { const k = `${dayKey(x.t)}:${new Date(x.t).getHours()}`; cell.set(k, (cell.get(k) ?? 0) + 1); }
  const max = Math.max(...cell.values());
  const L = 92, T = 4, gap = 2;
  const cw = Math.min(40, Math.max(8, Math.floor((W - L - 4) / 24) - gap)), ch = Math.min(22, cw);
  const H = T + days.length * (ch + gap) + 22;
  let g = '';
  days.forEach((d, r) => {
    const y = T + r * (ch + gap);
    g += `<text class="ch-ax" x="${L - 8}" y="${y + ch / 2 + 4}" text-anchor="end">${dayFmt(d)}</text>`;
    for (let h = 0; h < 24; h++) {
      const n = cell.get(`${d}:${h}`) ?? 0;
      const xx = L + h * (cw + gap);
      g += `<rect x="${xx}" y="${y}" width="${cw}" height="${ch}" rx="3" fill="${n ? `color-mix(in srgb, var(--cf-specified) ${Math.round(18 + 82 * (n / max))}%, var(--surface))` : 'var(--surface-2)'}" ${tipAttr([`${dayFmt(d)}, ${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00`, `${n} task${n === 1 ? '' : 's'} checked off`])}/>`;
    }
  });
  for (const h of [0, 6, 12, 18]) g += `<text class="ch-ax" x="${L + h * (cw + gap)}" y="${H - 6}">${String(h).padStart(2, '0')}:00</text>`;
  const live = checks.filter((x) => x.src === 'live').length;
  const sub = $('ch-heat-sub');
  if (sub) sub.textContent = `${checks.length} check-offs (${live} recorded live, ${checks.length - live} from commits, which only know the commit time). Darker = more.`;
  return `<div class="ch-legend"><span>fewer</span>${[18, 45, 72, 100].map((p) => `<i style="background:color-mix(in srgb, var(--cf-specified) ${p}%, var(--surface))"></i>`).join('')}<span>more (max ${max} per hour)</span></div><div class="ch-scroll"><svg class="ch-svg" width="${L + 24 * (cw + gap)}" height="${H}" role="img" aria-label="Check-offs per hour">${g}</svg></div>`;
}

// ---- the roadmap as a dependency graph, with the longest open chain highlighted
function depsChart(s, shownNames, times, W) {
  const all = s.changes.filter((c) => c.inRoadmap && c.status !== 'parking' && !(ui.boardFocus && c.status === 'archived'));
  const byOrder = new Map(all.map((c) => [c.order, c]));
  const nodes = all.filter((c) => shownNames.has(c.name) || all.some((x) => shownNames.has(x.name) && x.dependsOn.includes(c.order)));
  if (!nodes.length) return '<div class="empty">No roadmap.</div>';
  const inSet = new Set(nodes.map((c) => c.order));
  const deps = (c) => c.dependsOn.filter((o) => inSet.has(o));
  const soft = (c) => (c.softDependsOn ?? []).filter((o) => inSet.has(o));
  const layer = new Map();
  const lay = (c, seen = new Set()) => {
    if (layer.has(c.order)) return layer.get(c.order);
    if (seen.has(c.order)) return 0; seen.add(c.order);
    const l = deps(c).length ? 1 + Math.max(...deps(c).map((o) => lay(byOrder.get(o), seen))) : 0;
    layer.set(c.order, l); return l;
  };
  nodes.forEach((c) => lay(c));
  // critical path: longest chain of changes that are not done yet
  const chain = new Map();
  const len = (c) => {
    if (chain.has(c.order)) return chain.get(c.order).n;
    if (isDone(c)) { chain.set(c.order, { n: 0, prev: null }); return 0; }
    let best = { n: 1, prev: null };
    for (const o of deps(c)) { const n = len(byOrder.get(o)) + 1; if (n > best.n) best = { n, prev: o }; }
    chain.set(c.order, best); return best.n;
  };
  nodes.forEach(len);
  const end = nodes.filter((c) => !isDone(c)).sort((a, b) => chain.get(b.order).n - chain.get(a.order).n || a.seq - b.seq)[0];
  const crit = new Set();
  for (let o = end?.order; o != null; o = chain.get(o)?.prev) crit.add(o);
  const cols = Math.max(...nodes.map((c) => layer.get(c.order))) + 1;
  const byLayer = Array.from({ length: cols }, (_, l) => nodes.filter((c) => layer.get(c.order) === l).sort((a, b) => a.seq - b.seq));
  // fewer crossings: order each layer by the mean row of its prerequisites (barycenter), roadmap order on ties
  const row = new Map();
  byLayer.forEach((l, li) => {
    if (li) {
      const bary = (c) => { const ys = deps(c).map((o) => row.get(o)).filter((v) => v != null); return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : Infinity; };
      l.sort((a, b) => bary(a) - bary(b) || a.seq - b.seq);
    }
    l.forEach((c, i) => row.set(c.order, i));
  });
  const gx = 30, NH = 34, gy = 10;
  const NW = Math.max(124, Math.min(170, Math.floor((W - 8 - (cols - 1) * gx) / cols)));
  const Wd = cols * (NW + gx) - gx + 8, Hd = Math.max(...byLayer.map((l) => l.length)) * (NH + gy) + 8;
  const pos = new Map();
  byLayer.forEach((l, li) => l.forEach((c, i) => pos.set(c.order, { x: 4 + li * (NW + gx), y: 4 + i * (NH + gy) })));
  let edges = '', boxes = '';
  const maxCh = Math.floor((NW - 18) / 6.6);
  for (const c of nodes) {
    const b = pos.get(c.order);
    for (const [list, dashed] of [[deps(c), false], [soft(c), true]]) for (const o of list) {
      const a = pos.get(o);
      const isCrit = !dashed && crit.has(o) && crit.has(c.order) && chain.get(c.order)?.prev === o;
      const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
      const settled = isDone(byOrder.get(o)) && isDone(c);
      edges += `<path d="M${x1},${y1}C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" class="ch-edge${isCrit ? ' crit' : settled ? ' settled' : ''}" ${dashed ? 'stroke-dasharray="4 4"' : ''}/>`;
    }
  }
  for (const c of nodes) {
    const p = pos.get(c.order);
    const st = c.status === 'proposed' ? 'proposed' : c.status;
    const ghost = !shownNames.has(c.name);
    const lab = title(c.name);
    boxes += `<g class="ch-node ${crit.has(c.order) ? 'crit' : ''} ${ghost ? 'ghost' : ''}" data-pick="${esc(c.name)}" ${tipAttr([`#${c.order} ${c.name}`, `${CF_LABEL[st] ?? st}${c.blockedBy?.length && !isDone(c) ? ` · waits for ${c.blockedBy.map((o) => '#' + o).join(', ')}` : ''}`, ...(crit.has(c.order) ? ['on the critical path'] : [])])}>
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="8" class="ch-nbox"/>
      <rect x="${p.x}" y="${p.y}" width="5" height="${NH}" rx="2.5" fill="${CF_VAR[st] ?? 'var(--faint)'}"/>
      <text class="ch-ax" x="${p.x + 12}" y="${p.y + 13}">#${c.order} · ${CF_LABEL[st] ?? st}</text>
      <text class="ch-lbl" x="${p.x + 12}" y="${p.y + 27}">${esc(lab.length > maxCh ? lab.slice(0, maxCh - 1) + '…' : lab)}</text>
    </g>`;
  }
  const sub = $('ch-deps-sub');
  if (sub) sub.textContent = crit.size ? `Critical path: ${[...crit].reverse().map((o) => '#' + o).join(' → ')} (${crit.size} open change${crit.size > 1 ? 's' : ''} in a row). Dashed: soft dependency. Click a change to open it.` : 'Everything here is done.';
  return `<div class="ch-scroll"><svg class="ch-svg" width="${Wd}" height="${Hd}" role="img" aria-label="Dependency graph">${edges}${boxes}</svg></div>`;
}

// ---- hover: a tooltip for marks with data-tip, a crosshair for the time charts
const tip = document.createElement('div');
tip.className = 'ch-tip'; tip.hidden = true; document.body.appendChild(tip);
function showTip(e, lines) {
  tip.innerHTML = lines.map((l, i) => `<div class="${i ? '' : 'h'}">${esc(l)}</div>`).join('');
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = `${Math.min(innerWidth - r.width - 8, e.clientX + 14)}px`;
  tip.style.top = `${e.clientY + 16 + r.height > innerHeight ? e.clientY - r.height - 10 : e.clientY + 16}px`;
}
document.addEventListener('pointermove', (e) => {
  const hit = e.target.closest?.('[data-xhover]');
  document.querySelectorAll('.ch-cross').forEach((l) => { if (!hit || !hit.closest('svg').contains(l)) l.setAttribute('visibility', 'hidden'); });
  if (hit) {
    const geo = chartGeo.get(hit.dataset.xhover);
    if (!geo) return;
    const svg = hit.closest('svg');
    const px = e.clientX - svg.getBoundingClientRect().left;
    let row = geo.rows[0];
    for (const r of geo.rows) if (geo.x(r.t) <= px) row = r;
    const line = svg.querySelector('.ch-cross');
    line.setAttribute('x1', px); line.setAttribute('x2', px); line.setAttribute('visibility', 'visible');
    return showTip(e, row.lines);
  }
  const t = e.target.closest?.('[data-tip]');
  if (t && t.closest('.charts')) return showTip(e, t.dataset.tip.split('\n'));
  tip.hidden = true;
});
document.documentElement.addEventListener('mouseleave', () => { tip.hidden = true; });
let chartResize = null;
addEventListener('resize', () => { clearTimeout(chartResize); chartResize = setTimeout(() => ui.state && drawCharts(ui.state), 150); });

// ------------------------------------------------------------ backlog: the roadmap as a list, by milestone
// Like a backlog in an issue tracker: one row per change in roadmap order. With --agent, tickets that have not
// started can be dragged (or moved with Alt+↑/↓) within their milestone; the server rewrites openspec/roadmap.md,
// renumbers and keeps every "Depends on" reference right, and refuses moves past a prerequisite.
const BL_MOVABLE = new Set(['proposed', 'missing']);
function backlogHtml(s, shown, picked) {
  const focus = ui.boardFocus;
  const groups = s.milestones.map((m) => ({ id: m.id, title: m.title, cs: shown.filter((c) => c.milestone === m.id) }));
  const loose = shown.filter((c) => !c.milestone && isTicket(c));
  if (loose.length) groups.push({ id: '', title: 'Not in a milestone', cs: loose });
  const row = (c) => {
    const done = isDone(c);
    const movable = !!AGENT_TOKEN && c.inRoadmap && !!c.milestone && BL_MOVABLE.has(c.status);
    const t = c.tasks;
    const deps = c.dependsOn?.length ? `after ${c.dependsOn.map((o) => '#' + o).join(', ')}` : '';
    return `<li class="bl-row ${done ? 'done' : ''} ${movable ? 'movable' : ''} ${c.name === picked ? 'picked' : ''}" ${c.name === picked ? 'aria-current="true"' : ''} data-pick="${esc(c.name)}" data-bl="${esc(c.name)}" data-blms="${esc(c.milestone ?? '')}" ${movable ? 'draggable="true" tabindex="0" aria-roledescription="movable ticket"' : ''} title="${esc(c.goal)}">
      <span class="bl-grip" aria-hidden="true">${movable ? '⠿' : ''}</span>
      <span class="bl-o num">${c.inRoadmap ? '#' + c.order : '—'}</span>
      <span class="bl-name">${esc(title(c.name))}<span class="slug">${esc(c.name)}</span></span>
      <span class="bl-area">${esc(c.context)}</span>
      <span class="bl-deps ${c.blockedBy?.length && !done ? 'wait' : ''}">${c.blockedBy?.length && !done ? `waits for ${c.blockedBy.map((o) => '#' + o).join(', ')}` : deps}</span>
      <span class="bl-prog">${t && t.total ? `<span class="bar"><span style="width:${pct(t.done, t.total)}%;background:var(--st-complete)"></span></span><span class="num">${t.done}/${t.total}</span>` : ''}</span>
      <span class="pill" style="--st:${stVar(c.status)}">${esc(columnLabel(c))}</span>
    </li>`;
  };
  const ideas = s.changes.filter((c) => c.status === 'idea');
  const ideaRow = (c) => `<li class="bl-row idea ${c.name === picked ? 'picked' : ''}" data-pick="${esc(c.name)}" data-bl="${esc(c.name)}" title="${esc(c.why ?? '')}">
      <span class="bl-grip" aria-hidden="true"></span><span class="bl-o">💡</span>
      <span class="bl-name">${esc(title(c.name))}<span class="slug">${esc(c.name)}</span></span>
      <span class="bl-area">${esc(c.goal || (c.why ?? '').split(/(?<=[.!?])\s/)[0])}</span>
      ${AGENT_TOKEN ? `<span class="bl-actions"><button class="btn" type="button" data-idea-refine="${esc(c.name)}" title="Brainstorm it in the chat; a ticket is saved only if you save it">💡 Refine</button><button class="btn" type="button" data-idea-plan="${esc(c.name)}" title="Add it to the roadmap as it is">Plan…</button><button class="link" type="button" data-idea-delete="${esc(c.name)}" title="Delete the idea">Delete</button></span>` : ''}
    </li>`;
  const ideasHtml = ideas.length ? `<section class="bl-group bl-ideas">
      <div class="bl-head"><b>💡</b> Ideas<span class="muted num">${ideas.length} · need refinement before they are planned</span></div>
      <ol class="bl-list">${ideas.map(ideaRow).join('')}</ol>
    </section>` : '';
  return `<div class="backlog" data-col="backlog">

  const key = inp.dataset.xpAdd;
  inp.value = ''; xpSave(); renderScout();
  document.querySelector(`[data-xp-add="${CSS.escape(key)}"]`)?.focus(); // ready for the next entry
});
function renderNewProject() {
  const d = ui.overview?.discovery;
  // only the current conversation: "New brainstorm" starts another one in the same folder, the earlier ones stay out
  const jobs = (sc.fresh ? null : groupBySession(d?.newChats.find((x) => x.parent === sc.parent)?.jobs ?? []).at(-1)?.jobs) ?? [];
  $('sc-title').innerHTML = 'New project<span class="sc-path">brainstorm it, then create it</span>';
  const cr = sc.create;
  morphHtml($('sc-bar'), `<div class="ag-row np-row"><label class="np-parent">Create in <input id="np-parent" value="${esc(sc.parentInput ?? '')}" spellcheck="false" autocomplete="off" ${jobs.length ? 'readonly title="Start a new brainstorm to choose another folder"' : ''}></label>
      <button class="link xp-toggle" type="button" data-xp-toggle aria-pressed="${xp.open}" title="Quality gates, task checks, review topics, workflow steps, documentation, diagram format and types, containers, version control and license for the new project">⚙ Expert mode</button>
      ${jobs.length ? '<button class="link" type="button" data-np-fresh>New brainstorm</button>' : ''}</div>
    ${xpHtml()}
    ${cr ? `<div class="ag-row np-create"><span class="ag-note">Create</span><code>${esc((sc.parentInput ?? '').replace(/\/$/, ''))}/</code><input id="np-name" value="${esc(cr.name)}" spellcheck="false" autocomplete="off">
      <button class="btn primary" type="button" data-np-go ${sc.busy ? 'disabled' : ''}>Create and set up</button><button class="link" type="button" data-np-cancel>Cancel</button></div>
      ${sc.attached?.length ? `<div class="ag-note np-att">📎 The setup reads ${sc.attached.length === 1 ? 'the attached file' : `the ${sc.attached.length} attached files`} too: ${sc.attached.map((f) => esc(f.name)).join(', ')} (they stay outside the project)</div>` : ''}` : ''}
    <div class="ag-note ${sc.note.startsWith('✕') ? 'warn' : ''}">${esc(sc.note || 'Brainstorming · read-only · nothing is created until you press Create.')}</div>`);
  const th = $('ag-thread');
  const atEnd = th.scrollHeight - th.scrollTop - th.clientHeight < 60;
  th.innerHTML = threadHtml({ jobs, last: jobs.at(-1), newproject: true });
  if (atEnd || sc.stick) { th.scrollTop = th.scrollHeight; sc.stick = false; }
}
function openScout(p) {
  ag.open = false;
  Object.assign(sc, { open: true, mode: 'candidate', path: p, note: '', create: null });
  scoutPanel('Ask about this project');
  const c = candidate(p);
  if (c && !discJobs(c).chat.length) $('sc-text').value = 'What is this project, and should we onboard it to OpenSpec and the ticket workflow?';
  sc.stick = true;
  renderScout();
  $('sc-text').focus();
  if (ui.overview) renderOverview(ui.overview);
}
function closeScout() { sc.open = false; scoutMax(false); $('agent').hidden = true; document.body.classList.remove('ag-open'); if (ui.overview) renderOverview(ui.overview); }
function renderScout() {
  if (sc.mode === 'new') return $('sc-bar') && renderNewProject();
  const c = candidate(sc.path);
  if (!c || !$('sc-bar')) return;
  const { chat, onboard } = discJobs(c);
  $('sc-title').innerHTML = `${labelHtml(candLabel(c))}<span class="sc-path" title="${esc(c.path)}">${esc(c.display)}</span>`;
  const running = onboard && alive(onboard);
  const rp = c.repo, host = rp ? (rp.platform === 'github' ? 'GitHub' : rp.platform === 'gitlab' ? 'GitLab' : rp.name) : '';
  const repoRow = !rp ? '' : `<div class="ag-row np-repo"><span class="ag-note">Repository: ${esc(host)}, ${esc(rp.visibility)}</span>${rp.url
    ? `<span class="disc-ok">✓ ${/^https:/.test(rp.url) ? `<a href="${esc(rp.url)}" target="_blank" rel="noopener">${esc(rp.url.replace(/^https:\/\//, ''))}</a>` : 'created'}</span><span class="ag-note">added as <code>origin</code>; nothing is pushed: <code>git push -u origin HEAD</code> after your first commit</span>`
    : rp.platform === 'github' ? `<button class="btn" type="button" data-sc-repo>Create it on GitHub</button><span class="ag-note">an empty ${esc(rp.visibility)} repository named <code>${esc(c.name)}</code>, added as <code>origin</code> (with the gh CLI); nothing is pushed</span>`
    : `<span class="ag-note">create an empty ${esc(rp.visibility)} repository on ${esc(host)}, then: <code>git remote add origin &lt;its url&gt;</code></span>`}</div>`;
  morphHtml($('sc-bar'), repoRow + (c.followed
    ? `<div class="ag-row"><span class="disc-ok">✓ Onboarded and followed.</span><a class="btn primary" href="${esc(hrefFor(c.projectId))}">Open it</a><button class="btn" type="button" data-sc-next>Next candidate →</button></div>`
    : running ? `<div class="ag-row"><span class="ag-note"><span class="ag-spin"></span>Onboarding in the background; the project appears in the list once <code>openspec/</code> is set up. Nothing is committed.</span></div>`
    : `<div class="ag-row sc-decide"><span class="ag-note">Decision:</span>
        <button class="btn primary" type="button" data-sc-onboard ${c.openspec ? 'disabled' : ''}>Onboard it</button>
        <button class="btn" type="button" data-sc-skip>Skip → next candidate</button>
        ${onboard?.status === 'failed' ? `<span class="ag-note warn">✕ ${esc(onboard.error ?? 'Onboarding failed')}</span>` : ''}</div>
       ${sc.note ? `<div class="ag-note ${sc.note.startsWith('✕') ? 'warn' : ''}">${esc(sc.note)}</div>` : ''}`));
  const jobs = [...chat, ...(onboard ? [onboard] : [])].sort((a, b) => a.startedAt - b.startedAt);
  const th = $('ag-thread');
  const atEnd = th.scrollHeight - th.scrollTop - th.clientHeight < 60;
  th.innerHTML = threadHtml({ jobs, last: jobs.at(-1), scout: true });
  if (atEnd || sc.stick) { th.scrollTop = th.scrollHeight; sc.stick = false; }
}
function nextCandidate(after) {
  const list = (ui.overview?.discovery?.candidates ?? []).filter((c) => !c.skipped && !c.followed && !c.openspec);
  const i = list.findIndex((c) => c.path === after);
  return list[i + 1] ?? list.find((c) => c.path !== after) ?? null;
}
async function scoutSend(direct = null) {
  const ta = $('sc-text');
  const typed = ta?.value.trim();
  const files = sc.mode === 'new' && !direct ? [...(sc.pending ?? [])] : [];
  const text = direct ?? (typed ? withQuote(typed) : files.length ? `See the attached file${files.length > 1 ? 's' : ''}.` : '');
  if (!text || sc.busy) return;
  sc.busy = true;
  try {
    if (sc.mode === 'new') {
      const payload = await Promise.all(files.map((f) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve({ name: f.name, data: String(r.result).replace(/^data:[^,]*,/, '') });
        r.onerror = () => reject(new Error(`Cannot read ${f.name}.`));
        r.readAsDataURL(f);
      })));
      const parentInput = $('np-parent')?.value.trim() || sc.parentInput;
      const sum = xp.open ? xpSummary().join(' · ') : '';
      const withXp = sum && (sc.fresh || sum !== xp.sent) ? `[Workflow details (expert mode): ${sum.replace(/[\]\n]/g, ' ')}]\n${text}` : text;
      const r = await discPost({ action: 'newchat', parent: parentInput, text: withXp, fresh: sc.fresh, ...(withXp !== text ? xpContainers() : {}), ...(payload.length ? { files: payload } : {}) });
      if (sc.fresh) sc.attached = [];
      sc.attached = [...(sc.attached ?? []), ...(r.files ?? [])]; // they go with Create too
      sc.pending = []; renderFiles();
      if (sum) { xp.sent = sum; if (!xp.fold) { xp.fold = true; renderScout(); } } // the brainstorm gets the room again
      Object.assign(sc, { parent: r.parent, parentInput, fresh: false });
    } else await discPost({ action: 'chat', path: sc.path, text });
    if (!direct) { ta.value = ''; rx.quote = null; showQuoteChip(); }
    sc.stick = true; sc.note = '';
  }
  catch (e) { $('sc-route').innerHTML = `<span style="color:var(--st-blocked)">✕ ${esc(e.message)}</span>`; }
  finally { sc.busy = false; }
}
document.addEventListener('submit', (e) => {
  if (!e.target.matches?.('[data-disc-form]')) return;
  e.preventDefault();
  const path = $('disc-path').value.trim();
  sc.note = 'Searching…';
  discPost({ action: 'scan', path }).then((d) => { sc.note = `${d.found} found`; }).catch((err) => { sc.note = '✕ ' + err.message; }).finally(() => ui.overview && renderOverview(ui.overview));
  if (ui.overview) renderOverview(ui.overview);
});
document.addEventListener('change', (e) => {
  if (e.target.matches?.('[data-disc-skipped]')) { sc.showSkipped = e.target.checked; renderOverview(ui.overview); }
});
document.addEventListener('click', (e) => {
  const t = e.target;
  const hit = t.closest?.('[data-disc], [data-sc-open], [data-sc-close], [data-sc-max], [data-sc-send], [data-sc-onboard], [data-sc-skip], [data-sc-next], [data-np-open], [data-np-fresh], [data-np-create], [data-np-go], [data-np-cancel], [data-sc-repo]');
  if (!hit) return;
  e.stopPropagation();
  if (hit.matches('[data-np-open]')) return openNewProject();
  if (hit.matches('[data-sc-max]')) {
    scoutMax(!sc.max);
    if (sc.mode === 'new') try { localStorage.setItem('osd-np-max', sc.max ? '1' : '0'); } catch {}
    return $('sc-text')?.focus();
  }
  if (hit.matches('[data-np-fresh]')) { Object.assign(sc, { fresh: true, create: null, note: '', attached: [] }); return renderScout(); }
  if (hit.matches('[data-np-cancel]')) { sc.create = null; return renderScout(); }
  if (hit.matches('[data-np-create]')) {
    const pj = sc_projects.get(hit.dataset.npCreate);
    if (!pj) return;
    sc.create = { name: pj.name, brief: pj.brief };
    renderScout();
    return $('np-name')?.focus();
  }
  if (hit.matches('[data-np-go]')) {
    const name = $('np-name')?.value.trim();
    sc.busy = true; sc.note = 'Creating…'; renderScout();
    return discPost({ action: 'create', parent: sc.parent ?? sc.parentInput, name, brief: sc.create.brief, workflow: xp.open ? xpSummary() : null, ...xpContainers(), ...(xp.open ? { repo: xpRepo() } : {}), attachments: (sc.attached ?? []).map((f) => f.path) })
      .then((r) => { sc.busy = false; sc.create = null; openScout(r.path); })
      .catch((err) => { sc.busy = false; sc.note = '✕ ' + err.message; renderScout(); });
  }
  if (hit.matches('[data-sc-open]')) return openScout(hit.dataset.scOpen);
  if (hit.matches('[data-sc-close]')) return closeScout();
  if (hit.matches('[data-sc-send]')) return scoutSend();
  const act = (body, okNote = '') => discPost(body).then(() => { sc.note = okNote; }).catch((err) => { sc.note = '✕ ' + err.message; }).finally(() => { if (ui.overview) renderOverview(ui.overview); if (sc.open) renderScout(); });
  if (hit.matches('[data-disc]')) return act({ action: hit.dataset.disc, path: hit.dataset.path });
  if (hit.matches('[data-sc-onboard]')) return act({ action: 'onboard', path: sc.path });
  if (hit.matches('[data-sc-repo]')) {
    const c = candidate(sc.path);
    if (c?.repo?.visibility === 'public' && !confirm(`Create the PUBLIC repository "${c.name}" on GitHub? Everything you push to it is visible to everyone.`)) return;
    hit.disabled = true;
    return act({ action: 'repo', path: sc.path }, '');
  }
  if (hit.matches('[data-sc-skip], [data-sc-next]')) {
    const next = nextCandidate(sc.path);
    const done = () => (next ? openScout(next.path) : closeScout());
    return hit.matches('[data-sc-skip]') ? discPost({ action: 'skip', path: sc.path }).then(done).catch((err) => { sc.note = '✕ ' + err.message; renderScout(); }) : done();
  }
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sc.open && !document.querySelector('dialog[open]')) { e.preventDefault(); return sc.max ? scoutMax(false) : closeScout(); }
  if (e.target.id !== 'sc-text' || e.key !== 'Enter' || e.isComposing || e.shiftKey) return;
  e.preventDefault(); scoutSend();
});

function startProject() {
  if (PARAMS.has('focus')) ui.boardFocus = PARAMS.get('focus') !== '0'; // ?focus: the board in focus mode
  if (['board', 'backlog', 'charts'].includes(PARAMS.get('view'))) ui.boardView = PARAMS.get('view'); // ?view=backlog|charts
  if (AGENT_TOKEN && PARAMS.get('panel')?.startsWith('ticket:')) { // ?panel=ticket:<change> opens a ticket's panel
    Object.assign(ag, { open: true, panel: 'ticket', target: PARAMS.get('panel').slice(7), max: ag.max || PARAMS.has('max') }); $('agent').hidden = false; document.body.classList.add('ag-open');
  }
  if (AGENT_TOKEN && (PARAMS.get('term') || EMBED)) { ag.convo = 'terminal'; ag.term = PARAMS.get('term') || null; ag.termWrite = PARAMS.get('write') === '1'; } // ?term=<session id> joins that session (&write=1: writing)
  if (EMBED) { ag.open = true; ag.panel = 'chat'; ag.stick = true; $('agent').hidden = false; document.body.classList.add('ag-open'); }
  if (AGENT_TOKEN && PARAMS.get('convo')) ag.convo = PARAMS.get('convo'); // ?convo=assistant|brainstorm|session:<id> (from the background list)
  if (AGENT_TOKEN && PARAMS.get('panel') === 'chat') { ag.open = true; ag.panel = 'chat'; ag.stick = true; ag.max = ag.max || PARAMS.has('max'); $('agent').hidden = false; document.body.classList.add('ag-open'); } // ?panel=chat opens the chat, &max maximized
  if (SNAPSHOT && AGENT_TOKEN) fetch(withProject('/api/agent')).then((r) => r.json()).then((v) => { ag.view = v; renderAgentLive(); });
  if (SNAPSHOT) fetch(withProject('/api/state')).then((r) => r.json()).then((d) => { $('conn').innerHTML = `<span class="dot"></span>snapshot ${hhmm(d.scannedAt)}`; accept(d); });
  else connect();
}
function startOverview() {
  document.querySelectorAll('[data-chat-btn]').forEach((b) => b.remove()); // the chat belongs to a project; candidates have their own
  document.querySelector('.main').hidden = true;
  $('board').hidden = true;
  $('overview').hidden = false;
  if (SNAPSHOT) {
    fetch('/api/projects').then((r) => r.json()).then((d) => { $('conn').innerHTML = `<span class="dot"></span>snapshot ${hhmm(d.scannedAt)}`; renderOverview(d); });
    return;
  }
  const es = new EventSource('/events?overview=1');
  es.onopen = () => { $('conn').innerHTML = '<span class="dot on"></span>live'; };
  let onboardFrom = AGENT_TOKEN ? PARAMS.get('onboard') : null; // ?onboard=<folder>: "Onboard it as a project…" from a session-only session
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data); $('conn').innerHTML = `<span class="dot on"></span>live · ${hhmm(d.scannedAt)}`; renderOverview(d);
    if (onboardFrom && candidate(onboardFrom)) { const p = onboardFrom; onboardFrom = null; const u = new URL(location.href); u.searchParams.delete('onboard'); history.replaceState(null, '', u.pathname + u.search); openScout(p); }
  };
  es.onerror = () => { $('conn').innerHTML = '<span class="dot off"></span>disconnected, retrying…'; };
  setInterval(() => ui.overview && renderOverview(ui.overview), 30000);
}
(async () => {
  let list = [];
  try { list = (await (await fetch('/api/projects')).json()).projects ?? []; } catch { /* older server: one project */ }
  if (list.length > 1 || AGENT_TOKEN) { // with --agent the overview (and its discovery) is reachable with one project too
    const gone = PROJECT && !list.some((p) => p.id === PROJECT); // unfollowed or archived meanwhile: the overview
    if (gone) { PROJECT = null; history.replaceState(null, '', hrefFor(null)); }
    if (!PROJECT && list.length === 1 && !PARAMS.has('overview') && !gone) PROJECT = list[0].id;
    const sel = $('project');
    sel.innerHTML = `<option value="">All projects (${list.length})</option>` + list.map((p) => `<option value="${esc(p.id)}">${esc(p.label ?? p.name)}</option>`).join('');
    sel.value = PROJECT ?? '';
    sel.hidden = false;
    sel.addEventListener('change', () => { location.href = hrefFor(sel.value); });
    if (!PROJECT) return startOverview();
  }
  startProject();
})();
</script>
