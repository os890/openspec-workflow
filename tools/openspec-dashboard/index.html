}
:root[data-style="comic"] .col-head .t::before { width: 12px; height: 12px; border: 2px solid var(--ink); }
:root[data-style="comic"] .col-head .t .num { border: 2px solid var(--ink); color: var(--ink); }
:root[data-style="comic"] .col-head .d { color: var(--ink); font-weight: 600; }
:root[data-style="comic"] .kc { border: 2.5px solid var(--ink); border-radius: 4px; box-shadow: 4px 4px 0 var(--ink); }
:root[data-style="comic"] .kc:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
:root[data-style="comic"] .kc.focus { box-shadow: 4px 4px 0 var(--accent); border-color: var(--accent); }
:root[data-style="comic"] .kc-name { font-weight: 800; }
:root[data-style="comic"] .kc-top .m { border: 1.5px solid var(--ink); }
:root[data-style="comic"] .now { position: relative; background: var(--surface); border: 3px solid var(--ink); border-radius: 26px; box-shadow: 4px 4px 0 var(--ink); margin-bottom: 18px; }
:root[data-style="comic"] .now::before,
:root[data-style="comic"] .now::after { content: ""; position: absolute; left: 46px; clip-path: polygon(0 0, 100% 0, 0 100%); }
:root[data-style="comic"] .now::before { bottom: -22px; width: 30px; height: 22px; background: var(--ink); }
:root[data-style="comic"] .now::after { bottom: -15px; left: 49.5px; width: 22px; height: 16px; background: var(--surface); }
:root[data-style="comic"] .board-now { background: var(--surface); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 3px 3px 0 var(--ink); }
:root[data-style="comic"] .now .tag { background: var(--st-progress); color: var(--ink); border: 2px solid var(--ink); text-transform: uppercase; font-family: var(--font-comic); font-size: 14px; letter-spacing: .05em; font-weight: 400; }
:root[data-style="comic"] .now.done .tag { background: var(--st-complete); }
:root[data-style="comic"] .pill { color: var(--ink); background: color-mix(in srgb, var(--st) 35%, var(--surface)); border: 2px solid var(--ink); text-transform: uppercase; font-weight: 800; }
:root[data-style="comic"] .bar,
:root[data-style="comic"] .seg { background: var(--surface); border: 2px solid var(--ink); height: 14px; }
:root[data-style="comic"] .segs { height: 16px; }
:root[data-style="comic"] .bar > span,
:root[data-style="comic"] .seg > span { background-image: radial-gradient(rgba(255, 255, 255, .45) 1.2px, transparent 1.5px); background-size: 5px 5px; }
:root[data-style="comic"] .box { border: 2.5px solid var(--ink); border-radius: 4px; }
:root[data-style="comic"] .task.done .box { background: var(--st-complete); border-color: var(--ink); }
:root[data-style="comic"] .task.done .box::after { border-color: var(--ink); }
:root[data-style="comic"] .task.cur { background: color-mix(in srgb, var(--st-progress) 22%, transparent); box-shadow: inset 0 0 0 2px var(--ink); }
:root[data-style="comic"] details.group.current { background: transparent; }
:root[data-style="comic"] .tab { border: 2px solid transparent; font-weight: 800; }
:root[data-style="comic"] .tab[aria-selected="true"] { background: var(--accent); color: var(--surface); border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
:root[data-style="comic"] .btn,
:root[data-style="comic"] .style-select,
:root[data-style="comic"] .ms-filter button,
:root[data-style="comic"] .live > span,
:root[data-style="comic"] .board-live { background: var(--surface); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); font-weight: 700; }
:root[data-style="comic"] .ms-filter button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
:root[data-style="comic"] .ms-filter button[aria-pressed="true"] b { color: var(--surface); }
:root[data-style="comic"] details.group > summary .num { border: 2px solid var(--ink); }

/* ---------------------------------------------------------------- style: terminal
   Retro CRT: green phosphor with a soft glow, scanlines, monospace, a blinking cursor on the current task. */
:root[data-style="terminal"] body { text-shadow: 0 0 3px color-mix(in srgb, var(--ink) 45%, transparent); }
:root[data-style="terminal"] body::after {
  content: ""; position: fixed; inset: 0; z-index: 100; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0, 0, 0, .45));
}
:root[data-style="terminal"] header.top h1,
:root[data-style="terminal"] .f-name,
:root[data-style="terminal"] .ms-title,
:root[data-style="terminal"] .board-head .label,
:root[data-style="terminal"] .col-head .t,
:root[data-style="terminal"] .side .label,
:root[data-style="terminal"] .now .t { font-family: var(--font-crt); font-weight: 400 !important; letter-spacing: .02em; }
:root[data-style="terminal"] header.top h1 { font-size: 26px; }
:root[data-style="terminal"] .f-name { font-size: 38px; }
:root[data-style="terminal"] .f-name::before { content: "> "; color: var(--accent); }
:root[data-style="terminal"] .ms-title { font-size: 24px; }
:root[data-style="terminal"] .board-head .label { font-size: 28px; }
:root[data-style="terminal"] .side .label { font-size: 22px !important; color: var(--ink); }
:root[data-style="terminal"] .col-head .t { font-size: 22px; text-transform: uppercase; }
:root[data-style="terminal"] .now .t { font-size: 22px; }
:root[data-style="terminal"] .now .t::after { content: "▋"; margin-left: 4px; color: var(--ink); animation: t-blink 1.1s steps(1) infinite; }
@keyframes t-blink { 50% { opacity: 0; } }
:root[data-style="terminal"] .panel,
:root[data-style="terminal"] .drawer { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 0 18px -6px color-mix(in srgb, var(--ink) 30%, transparent); }
:root[data-style="terminal"] .board.max { border: 0; box-shadow: none; background: var(--bg); }
:root[data-style="terminal"] .col { background: transparent; border: 1px solid var(--line); }
:root[data-style="terminal"] .col-head .t::before { border-radius: 0; }
:root[data-style="terminal"] .kc { background: transparent; border: 1px dashed color-mix(in srgb, var(--st) 75%, transparent); }
:root[data-style="terminal"] .kc:hover { transform: none; background: color-mix(in srgb, var(--st) 9%, transparent); }
:root[data-style="terminal"] .kc.focus { border-style: solid; border-color: var(--accent); box-shadow: 0 0 10px -2px color-mix(in srgb, var(--accent) 60%, transparent); }
:root[data-style="terminal"] .kc-top .m { background: transparent; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
:root[data-style="terminal"] .now,
:root[data-style="terminal"] .board-now { background: transparent; border: 1px solid var(--st-progress); }
:root[data-style="terminal"] .now.done { border-color: var(--st-complete); }
:root[data-style="terminal"] .now .tag { background: var(--st-progress); color: var(--bg); text-shadow: none; }
:root[data-style="terminal"] .now.done .tag { background: var(--st-complete); }
:root[data-style="terminal"] .pill { background: transparent; padding: 0; }
:root[data-style="terminal"] .pill::before { content: "["; }
:root[data-style="terminal"] .pill::after { content: "]"; }
:root[data-style="terminal"] .bar,
:root[data-style="terminal"] .seg { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
:root[data-style="terminal"] .bar > span,
:root[data-style="terminal"] .seg > span { background-image: repeating-linear-gradient(90deg, transparent 0 6px, var(--surface) 6px 8px); }
:root[data-style="terminal"] .box { border-radius: 0; border: 1.5px solid var(--ink); }
:root[data-style="terminal"] .task.done .box { background: var(--ink); border-color: var(--ink); }
:root[data-style="terminal"] .task.done .box::after { border-color: var(--bg); }
:root[data-style="terminal"] .task.cur { background: color-mix(in srgb, var(--st-progress) 12%, transparent); }
:root[data-style="terminal"] details.group.current { background: transparent; }
:root[data-style="terminal"] .tab[aria-selected="true"],
:root[data-style="terminal"] .ms-filter button[aria-pressed="true"] { background: var(--ink); color: var(--bg); text-shadow: none; }
:root[data-style="terminal"] .ms-filter button[aria-pressed="true"] b { color: var(--bg); }
:root[data-style="terminal"] .btn,
:root[data-style="terminal"] .style-select,
:root[data-style="terminal"] .ms-filter button,
:root[data-style="terminal"] .live > span,
:root[data-style="terminal"] .board-live,
:root[data-style="terminal"] .tab,
:root[data-style="terminal"] .eyebrow .switch button { background: transparent; border: 1px solid var(--line); border-radius: 0; color: var(--ink); }
:root[data-style="terminal"] .ms-filter button b { color: var(--ink); }
:root[data-style="terminal"] .style-select option { background: var(--surface); }
:root[data-style="terminal"] .col-head .t .num,
:root[data-style="terminal"] details.group > summary .num,
:root[data-style="terminal"] code { border-radius: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

[hidden] { display: none !important; }
.live > span:empty { display: none; }

/* projects overview (several projects) */
.overview { padding-block: 16px 36px; display: flex; flex-direction: column; gap: 16px; }
.ov-head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.ov-head .label { font-size: 22px; color: var(--ink); font-weight: 800; letter-spacing: -.02em; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
.ov-card { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; color: inherit; text-decoration: none; min-width: 0; transition: box-shadow .15s, transform .15s; }
.ov-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.ov-card.fresh { animation: moved 3s ease-out; }
.ov-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ov-name { font-size: 19px; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
.ov-top .pill { margin-left: auto; }
.ov-path { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); overflow-wrap: anywhere; }
.ov-cur { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ov-cur .k { font-size: 12px; font-weight: 700; }
.ov-cur .n { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.ov-cur .prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.ov-cur .prog .bar { flex: 1; }
.ov-now { font-size: 12.5px; color: var(--muted); }
.ov-now .tid { font-family: var(--font-mono); color: var(--faint); margin-right: 4px; }
.ov-stack { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.ov-stack span { display: block; height: 100%; }
.ov-row { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.ov-row .warn { color: var(--st-blocked); font-weight: 600; }
.ov-empty { color: var(--muted); }
@media (max-width: 720px) { .ov-grid { grid-template-columns: 1fr; } }

@media (max-width: 1000px) {
  .main { grid-template-columns: 1fr; }
  .board.max { overflow: auto; }
  .board.max .board-body { flex: none; }
  .drawer { position: fixed; inset: 0; width: auto; z-index: 60; border-radius: 0; }
  .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .cols { grid-template-columns: 1fr; }
  .col-body { max-height: none; }
  .ms-filter { margin-left: 0; }
  .focus-head { padding: 18px; } .now { margin: 4px 18px 0; } .f-body { padding: 12px 18px 20px; } .tabs { padding: 0 12px; }
  .f-name { font-size: 21px; }
  .progress { grid-template-columns: 1fr; }
  .seg-labels { display: none; }
}
/* ---------------------------------------------------------------- agent panel (--agent) */
.agent-panel { --agp: 18px; position: fixed; top: 12px; right: 12px; bottom: 12px; left: auto; width: min(480px, calc(100vw - 24px)); z-index: 70;
  display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-hover), 0 24px 60px -12px rgba(0, 0, 0, .28); }
.ag-head { padding: 16px var(--agp) 8px; display: flex; align-items: baseline; gap: 10px; }
.ag-head h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.ag-head .link { margin-left: auto; }
.ag-status { margin: 0 var(--agp); font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.ag-hint code { overflow-wrap: anywhere; }
.ag-form { padding: 10px var(--agp) 12px; display: flex; flex-direction: column; gap: 9px; border-bottom: 1px solid var(--line); }
.ag-modes { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 -6px; }
.ag-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ag-target select { flex: 1; min-width: 0; max-width: 100%; }
.ag-form textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--ink); padding: 9px 12px; font: inherit; font-size: 13.5px; }
.ag-note { font-size: 12px; color: var(--muted); min-width: 0; }
.ag-note:empty { display: none; }
.ag-note.warn, .ag-err { color: var(--st-blocked); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
/* every style restyles .btn; the one primary action stays an accent-filled button in all of them */
.agent-panel .btn.primary, .agent-panel .btn.primary:hover { background: var(--accent) !important; color: var(--bg) !important; border-color: var(--accent) !important; text-shadow: none !important; font-weight: 700; }
.agent-panel .btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.ag-body { flex: 1; overflow: auto; padding: 12px var(--agp) 18px; display: flex; flex-direction: column; gap: 10px; }
.ag-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 7px; min-width: 0; flex: none; }
.ag-item .h { display: flex; gap: 4px 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.ag-item .h b { color: var(--ink); font-size: 13px; }
.ag-item .h .pill { margin-left: auto; }
.ag-q { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
.ag-answer, .ag-log .md { font-size: 13px; overflow-wrap: anywhere; }
.ag-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ag-actions .btn { background: var(--surface); }
.ag-logbox summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.ag-log { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; max-height: 46vh; overflow: auto; }
.ag-log li.tool { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.ag-log li.tool::before { content: "→ "; color: var(--faint); }
.ag-log li.user { background: var(--accent-soft); border-radius: 9px; padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ag-log li.error { color: var(--st-blocked); font-size: 12px; overflow-wrap: anywhere; }
.ag-log li.sub { margin-left: 14px; }
.ag-spin { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--st-progress); margin-right: 7px; animation: pulse 2.4s infinite; }
.ag-open { font-size: 12px; padding: 2px 10px; }
.ref { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 2px; }
.md a { color: var(--accent); }
.ag-sub { margin: 0 var(--agp) 4px; display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.ag-sub .link { margin-left: auto; font-size: 13px; }
.ag-empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
.ag-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px var(--agp) 8px; }
.chip { border: 0; background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.ag-bar { padding: 0 var(--agp) 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
.ag-bar:empty { display: none; }
.ag-bar code { overflow-wrap: anywhere; }
.ag-thread { flex: 1; overflow: auto; padding: 14px var(--agp); display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 88%; border-radius: 16px; padding: 8px 12px; font-size: 13.5px; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; flex: none; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--bg); border-bottom-right-radius: 5px; white-space: pre-wrap; }
.msg.them { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 5px; }
.msg.them.sub { margin-left: 16px; opacity: .85; }
.msg .md { font-size: 13.5px; } .msg .md p { margin: .3em 0; } .msg .md > :first-child { margin-top: 0; } .msg .md > :last-child { margin-bottom: 0; }
.msg .meta { font-size: 10.5px; opacity: .7; align-self: flex-end; white-space: normal; }
.msg.me .meta .link { color: inherit; text-decoration: underline; font-size: inherit; }
.msg.typing { color: var(--muted); font-size: 12.5px; flex-direction: row; align-items: center; }
.steps { align-self: flex-start; max-width: 88%; font-family: var(--font-mono); font-size: 11px; color: var(--muted); flex: none; }
.steps summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps > div { padding-left: 14px; overflow-wrap: anywhere; } .steps .error { color: var(--st-blocked); }
.sys { align-self: center; font-size: 11.5px; color: var(--muted); text-align: center; max-width: 90%; flex: none; }
.sys summary { cursor: pointer; } .sys > div { white-space: pre-wrap; text-align: left; margin-top: 4px; }
.sys.err { color: var(--st-blocked); }
.ag-compose { display: flex; gap: 8px; align-items: flex-end; padding: 10px var(--agp) 4px; border-top: 1px solid var(--line); }
.ag-compose textarea { flex: 1; min-height: 42px; max-height: 160px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); color: var(--ink); padding: 9px 12px; font: inherit; font-size: 13.5px; }
.ag-route { padding: 0 var(--agp) 12px; }
.ag-voice { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.ag-voice[hidden] { display: none !important; }
.ag-mic { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; }
.ag-mic.recording { background: color-mix(in srgb, var(--st-blocked) 16%, var(--surface)) !important; color: var(--st-blocked) !important; font-weight: 700; font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 calc(var(--lvl, 0) * 6px) color-mix(in srgb, var(--st-blocked) 25%, transparent); transition: box-shadow .15s; }
.ag-mic.busy { color: var(--muted); }
.rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-blocked); animation: pulse 1.2s infinite; }
.ag-lang { border: 0; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 4px 6px; font-size: 11.5px; cursor: pointer; }
/* on wide screens the full-screen board makes room for the panel instead of hiding columns under it */
@media (min-width: 1100px) { body.ag-open:not(.ag-max) .board.max { padding-right: calc(min(480px, 100vw - 24px) + 24px); } }
/* maximized: the panel covers the window, its content stays a readable centred column */
.agent-panel.max { inset: 8px; width: auto; --agp: max(24px, calc((100% - 1120px) / 2)); }
.agent-panel.max .ag-head { padding-block: 10px 8px; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.agent-panel.max .ag-head .ag-chips { padding: 0; flex: 1 1 auto; min-width: 0; }
.agent-panel.max .ag-bar { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding-bottom: 6px; }
.agent-panel.max .ag-bar > .ag-row { flex: 1 1 auto; }
.agent-panel.max .ag-sub { margin-top: -4px; }
.agent-panel.max .ag-form { padding-block: 6px 10px; }
.agent-panel.max .ag-thread { padding-block: 16px; gap: 10px; }
.agent-panel.max .msg, .agent-panel.max .steps { max-width: 80%; }
.agent-panel.max .ag-compose { padding-block: 10px 2px; }
.agent-panel.max .ag-route { padding-bottom: 8px; }
.ag-head .ag-maxbtn { margin-left: auto; font-size: 13px; }
.ag-head .ag-maxbtn + .link { margin-left: 14px; }
body.ag-max { overflow: hidden; }
:root[data-style="glass"] .agent-panel { background: var(--g-surface-strong); }
:root[data-style="matrix"] .agent-panel { background: var(--surface); }
@media (max-width: 600px) { .agent-panel { inset: 0; width: auto; border-radius: 0; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1 id="title">OpenSpec <span>progress</span></h1>
    <div class="live">
      <select id="project" class="style-select" aria-label="Project" title="Project" hidden></select>
      <span id="conn"><span class="dot"></span>connecting…</span>
      <span id="cli"></span>
      <select id="style" class="style-select" aria-label="Style" title="Visual style">
        <option value="flat">Flat</option><option value="glass">Glass</option><option value="paper">Paper</option><option value="whiteboard">Whiteboard</option><option value="blackboard">Blackboard</option><option value="notebook">Notebook</option><option value="matrix">Matrix</option><option value="terminal">Terminal</option><option value="comic">Comic</option>
      </select>
      <button class="btn" id="agent-btn" type="button" data-chat-btn aria-controls="agent" hidden>Chat</button>
      <button class="btn" id="theme" type="button" aria-label="Toggle light or dark theme">◐</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="overview" id="overview" aria-live="polite" hidden></section>
  <div class="main">
    <article class="panel" id="focus" aria-live="polite"></article>
    <div class="side">
      <section class="panel" id="milestone"></section>
      <section class="panel"><div class="label" style="font-size:15px;color:var(--ink);font-weight:800">Activity</div><ul class="feed" id="feed"></ul><div id="burn"></div></section>
    </div>
  </div>
  <section class="panel board" id="board"></section>
</div>
<aside class="drawer agent-panel" id="agent" aria-label="Agent" hidden></aside>

<script>
const STATUS = {
  'archived':    { label: 'Archived',    v: '--st-archived' },
  'complete':    { label: 'Tasks done',  v: '--st-complete' },
  'in-progress': { label: 'In progress', v: '--st-progress' },
  'specified':   { label: 'Specified',   v: '--st-specified' },
  'proposed':    { label: 'Proposed',    v: '--st-proposed' },
  'missing':     { label: 'Missing',     v: '--st-missing' },
  'parking':     { label: 'Parking lot', v: '--st-proposed' },
};
const ui = { state: null, pinned: null, tab: 'tasks', open: new Map(), fileCache: new Map(), fresh: new Set(), prevCol: new Map(), ms: '', boardMax: false, drawer: null, drawerScroll: 0, colScroll: new Map() };
try { const t = localStorage.getItem('osd-theme'); if (t) document.documentElement.dataset.theme = t; ui.ms = localStorage.getItem('osd-ms') || ''; } catch {}
// visual style: flat (default) or glass; ?style=glass overrides the remembered choice
const STYLES = ['flat', 'glass', 'paper', 'whiteboard', 'blackboard', 'notebook', 'matrix', 'terminal', 'comic'];
// Matrix style: falling code on a canvas behind the page; only exists while that style is active.
let rain = null;
function setRain(on) {
  if (!on) {
    if (rain) { cancelAnimationFrame(rain.raf); removeEventListener('resize', rain.resize); rain.canvas.remove(); rain = null; }
    return;
  }
  if (rain || !document.body) return;
  const canvas = document.createElement('canvas');
  canvas.id = 'matrix-rain'; canvas.setAttribute('aria-hidden', 'true');
  document.body.prepend(canvas);
  const ctx = canvas.getContext('2d');
  const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワ0123456789<>{}=+*';
  const size = 16;
  let w = 0, h = 0, drops = [];
  const resize = () => {
    w = canvas.width = innerWidth; h = canvas.height = innerHeight;
    drops = Array.from({ length: Math.ceil(w / size) }, () => Math.floor(Math.random() * h / size));
  };
  const step = () => {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#00ff66'; ctx.font = size + 'px monospace';
    drops.forEach((y, i) => {
      ctx.fillText(glyphs[Math.floor(Math.random() * glyphs.length)], i * size, y * size);
      drops[i] = y * size > h && Math.random() > 0.975 ? 0 : y + 1;
    });
  };
  rain = { canvas, raf: 0, resize };
  resize(); addEventListener('resize', resize);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { for (let k = 0; k < 90; k++) step(); return; }
  let last = 0;
  const loop = (t) => { rain.raf = requestAnimationFrame(loop); if (t - last < 55) return; last = t; step(); };
  rain.raf = requestAnimationFrame(loop);
}
function applyStyle(name) {
  const st = STYLES.includes(name) ? name : 'flat';
  setRain(st === 'matrix');
  if (st === 'flat') delete document.documentElement.dataset.style; else document.documentElement.dataset.style = st;
  const b = document.getElementById('style');
  if (b) b.value = st;
  return st;
}
{
  // ?theme=light|dark overrides the remembered light/dark choice (links, screenshots)
  const qt = new URLSearchParams(location.search).get('theme');
  if (qt === 'light' || qt === 'dark') document.documentElement.dataset.theme = qt;
  let st = new URLSearchParams(location.search).get('style');
  if (!st) { try { st = localStorage.getItem('osd-style'); } catch {} }
  applyStyle(st);
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// [text](url): web links open in a new tab; project paths show the text, the path is the tooltip
const link = (_, text, url) => /^https?:\/\//.test(url) ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>` : `<span class="ref" title="${url}">${text}</span>`;
const inline = (s) => esc(s).replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, link).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');
const stVar = (s) => `var(${STATUS[s]?.v ?? '--st-proposed'})`;
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
// add-due-dates -> Add due dates (the slug stays visible where it matters)
const title = (slug) => { const t = String(slug).replace(/[-_]+/g, ' ').replace(/\bmcp\b/gi, 'MCP').replace(/\bapi\b/gi, 'API').replace(/\bpostgresql\b/gi, 'PostgreSQL').replace(/\bpoc\b/gi, 'PoC').replace(/\bcqrs\b/gi, 'CQRS').replace(/^setup /, 'Set up '); return t.charAt(0).toUpperCase() + t.slice(1); };
const isDone = (c) => c.status === 'archived' || c.status === 'complete';
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(t) {
  if (!t) return '—';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(t).toLocaleDateString();
}

function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0, list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { closeList(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); const n = Math.min(4, h[1].length); out += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      closeList();
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      let t = '<div class="tbl"><table><thead><tr>' + cells(l).map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { t += '<tr>' + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++; }
      out += t + '</tbody></table></div>'; continue;
    }
    const li = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const kind = /\d/.test(li[2]) ? 'ol' : 'ul';
      if (list !== kind) { closeList(); out += kind === 'ol' ? `<ol start="${parseInt(li[2], 10)}">` : `<${kind}>`; list = kind; } // a nested list must not restart the numbering
      let text = li[3];
      const cb = text.match(/^\[([ xX])\]\s+(.*)$/);
      if (cb) text = (cb[1] === ' ' ? '☐ ' : '☑ ') + cb[2];
      while (i + 1 < lines.length && /^\s{2,}\S/.test(lines[i + 1]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i + 1])) text += ' ' + lines[++i].trim();
      out += `<li style="margin-left:${Math.min(3, Math.floor(li[1].length / 2))}em">${inline(text)}</li>`; i++; continue;
    }
    if (!l.trim()) { closeList(); i++; continue; }
    closeList();
    const buf = [l];
    while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#|```|\s*([-*]|\d+\.)\s|\|)/.test(lines[i + 1])) buf.push(lines[++i]);
    out += `<p>${inline(buf.join(' '))}</p>`; i++;
  }
  closeList();
  return out;
}
async function loadFile(f) {
  const hit = ui.fileCache.get(f.path);
  if (hit && hit.mtime === f.mtime) return hit.text;
  const r = await fetch(withProject('/api/file?path=' + encodeURIComponent(f.path)));
  const text = r.ok ? await r.text() : `Could not load ${f.path} (${r.status}).`;
  ui.fileCache.set(f.path, { mtime: f.mtime, text });
  return text;
}

// ------------------------------------------------------------ what is "current"
// Active = changes with work in them that are not archived: in progress, tasks done (awaiting archive),
// or specified (elaborated, nothing checked yet). Most recently touched first.
function activeChanges(s) {
  const rank = { 'in-progress': 0, 'complete': 1, 'specified': 2 };
  return s.changes.filter((c) => c.status in rank)
    .sort((a, b) => rank[a.status] - rank[b.status] || (b.lastModified ?? 0) - (a.lastModified ?? 0));
}
function currentChange(s) {
  return activeChanges(s)[0] ?? s.changes.find((c) => c.name === s.nextUp) ?? s.changes[0];
}
function currentTask(c) {
  for (const g of c.tasks?.groups ?? []) for (const i of g.items) if (!i.done) return { g, i };
  return null;
}

// ------------------------------------------------------------ render: focus
async function renderFocus(s, el = $('focus'), forced = null) {
  const inDrawer = forced !== null;
  const auto = currentChange(s);
  const c = (inDrawer && s.changes.find((x) => x.name === forced)) || (ui.pinned && s.changes.find((x) => x.name === ui.pinned)) || auto;
  if (!c) { el.innerHTML = '<div class="focus-head">No changes found.</div>'; return; }
  const active = activeChanges(s);
  const pinnedAway = !inDrawer && c.name !== auto?.name;
  const cur = currentTask(c);
  const t = c.tasks;
  const lastDone = s.events.find((e) => e.change === c.name && e.kind === 'task-done');

  let eyebrow;
  if (pinnedAway) eyebrow = 'Viewing';
  else if (c.status === 'in-progress') eyebrow = 'Working on';
  else if (c.status === 'complete') eyebrow = 'Ready to archive';
  else if (c.status === 'specified') eyebrow = 'Up next · planned and ready';
  else eyebrow = 'Up next';

  let now = '';
  if (t && cur) {
    now = `<div class="now"><span class="tag">${c.status === 'in-progress' ? 'Now' : 'First'}</span>
      <div class="t"><span class="tid">${esc(cur.i.id)}</span>${inline(cur.i.text)}</div>
      ${cur.i.verify ? `<div class="v"><b>verify</b>${inline(cur.i.verify)}</div>` : ''}
      <div class="pulse">
        <span>${esc(cur.g.title)} · ${cur.g.done}/${cur.g.total}</span>
        ${lastDone ? `<span>last check-off ${ago(lastDone.t)}</span>` : ''}
        ${s.workspace?.recent?.[0] ? `<span>last file write ${ago(s.workspace.recent[0].mtime)}</span>` : ''}
        ${AGENT_TOKEN ? `<button class="link" type="button" data-agent="${esc(c.name)}" data-agent-mode="ask" data-agent-draft="${esc(`About task ${cur.i.id} (${cur.i.text}): `)}">Ask about this task</button>` : ''}
      </div></div>`;
  } else if (t && !cur) {
    now = `<div class="now done"><span class="tag">Done</span><div class="t">Nice, all ${t.total} tasks are checked.</div>
      <div class="v">${c.status === 'archived' ? `Archived ${esc(c.archivedAt ?? '')}.` : 'Last step: <code>openspec archive ' + esc(c.name) + '</code> moves it into the specs.'}</div></div>`;
  } else {
    const blocked = c.blockedBy.length ? `Waits for ${c.blockedBy.map((o) => '#' + o).join(', ')}. ` : '';
    now = `<div class="now"><span class="tag">Next</span><div class="t">Not planned in detail yet</div>
      <div class="v">${blocked}Only the proposal exists; design, spec deltas and tasks come when the change is picked up.</div></div>`;
  }

  const tabs = [
    ['tasks', t ? 'Tasks' : 'Tasks', !!t],
    ['proposal', 'Proposal', c.artifacts.proposal],
    ['design', 'Design', c.artifacts.design],
    ['specs', `Spec deltas${c.specs.files.length ? ' · ' + c.specs.requirements + ' req' : ''}`, c.specs.files.length > 0],
    ['validation', c.validation ? (c.validation.valid ? 'Validation ✓' : `Validation · ${c.validation.issues.length}`) : 'Validation', true],
  ];
  let tab = ui.tab;
  if (!tabs.find(([k, , ok]) => k === tab && ok)) tab = tabs.find(([, , ok]) => ok)[0];

  let body = '';
  if (tab === 'tasks') {
    body = t.groups.map((g, gi) => {
      const complete = g.done === g.total;
      const isCur = cur && cur.g === g;
      const key = c.name + '|' + gi;
      const open = ui.open.has(key) ? ui.open.get(key) : !complete;
      return `<details class="group ${complete ? 'complete' : ''} ${isCur ? 'current' : ''}" data-key="${esc(key)}" ${open ? 'open' : ''}>
        <summary><span class="chev">▶</span><span>${complete ? '✓ ' : ''}${inline(g.title)}</span><span class="num">${g.done}/${g.total}</span></summary>
        <div class="tasks">${g.items.map((i) => `<div class="task ${i.done ? 'done' : ''} ${cur && cur.i === i ? 'cur' : ''} ${ui.fresh.has(c.name + '|' + i.id) ? 'fresh' : ''}">
          <span class="box"></span><span class="tid">${esc(i.id)}</span><span class="txt">${inline(i.text)}</span>${i.verify && !i.done ? `<span class="ver">verify: ${inline(i.verify)}</span>` : ''}</div>`).join('')}</div>
      </details>`;
    }).join('') || '<div class="empty">tasks.md has no checkboxes.</div>';
  } else if (tab === 'proposal' || tab === 'design') {
    const f = c.files.find((x) => x.name === tab + '.md');
    body = f ? `<div class="md">${md(await loadFile(f))}</div>` : '<div class="empty">Not written yet.</div>';
  } else if (tab === 'specs') {
    const texts = await Promise.all(c.specs.files.map((sf) => { const f = c.files.find((x) => x.path === sf.path); return f ? loadFile(f) : ''; }));
    body = c.specs.files.map((sf, k) => `<div class="label" style="margin:${k ? 22 : 0}px 0 6px;color:var(--accent)">${esc(sf.capability)} · ${sf.requirements} requirements · ${sf.scenarios} scenarios</div><div class="md">${md(texts[k])}</div>`).join('');
  } else {
    if (!c.validation) body = `<div class="empty">${s.cli.available ? 'Waiting for the OpenSpec CLI…' : 'OpenSpec CLI disabled.'}</div>`;
    else if (c.validation.valid) body = `<div class="empty" style="color:var(--st-complete)">✓ <code>openspec validate ${esc(c.name)}</code> passes.</div>`;
    else body = c.validation.issues.map((i) => `<div class="issue ${esc(i.level)}"><b>${esc(i.level)}</b>${esc(i.message)}</div>`).join('')
      + (c.status === 'proposed' ? '<div class="empty">Expected while the change is proposal-only.</div>' : '');
  }

  const scroll = inDrawer ? ui.drawerScroll : window.scrollY;
  if (!el.isConnected) return;
  el.innerHTML = `
    <div class="focus-head">
      <div class="eyebrow">
        <span class="label" style="color:${pinnedAway ? 'var(--muted)' : stVar(c.status)}">${eyebrow}</span>
        ${!inDrawer && active.length > 1 ? `<span class="switch">${active.map((a) => `<button type="button" data-pick="${esc(a.name)}" aria-pressed="${a.name === c.name}" title="${esc(a.name)} · ${STATUS[a.status].label}">${a.inRoadmap ? '#' + a.order : esc(a.name)}</button>`).join('')}</span>` : ''}
        ${pinnedAway ? `<button class="link back" type="button" data-pick="">← back to ${esc(title(auto.name))}</button>` : ''}
        ${AGENT_TOKEN && c.status !== 'archived' ? `<button class="btn ag-open" type="button" data-agent="${esc(c.name)}" title="Ask about this ticket or start a session on it">Agent…</button>` : ''}
        ${inDrawer ? '<button class="link back" type="button" data-close-drawer>Close ✕</button>' : ''}
      </div>
      <h2 class="f-name">${esc(title(c.name))}</h2>
      <div class="slug">${esc(c.name)}</div>
      <div class="f-meta">
        <span class="pill" style="--st:${stVar(c.status)}">${STATUS[c.status].label}</span>
        ${c.inRoadmap ? `<span class="mono">#${c.order}</span>` : '<span>not in roadmap.md</span>'}<span>${esc(c.context)}</span>${c.milestone ? `<span>${esc(c.milestone)}</span>` : ''}
        ${c.validation ? (c.validation.valid ? '<span style="color:var(--st-complete)">✓ valid</span>' : `<span style="color:${c.status === 'proposed' ? 'var(--muted)' : 'var(--st-blocked)'}">✕ validation</span>`) : ''}
        <span>changed ${ago(c.lastModified)}</span>
      </div>
      <div class="f-goal">${inline(c.goal)}</div>
      ${t ? `<div class="progress">
        <div class="count num">${t.done}<small> / ${t.total}</small></div>
        <div class="segs">${t.groups.map((g) => `<div class="seg ${cur && cur.g === g ? 'cur' : ''}" style="--n:${g.total}" title="${esc(g.title)} ${g.done}/${g.total}"><span style="width:${pct(g.done, g.total)}%"></span></div>`).join('')}</div>
        <div class="muted num" style="font-size:12px">${pct(t.done, t.total)}% tasks</div>
        <div class="seg-labels">${t.groups.map((g) => `<span class="${cur && cur.g === g ? 'cur' : ''}" style="--n:${g.total}" title="${esc(g.title)}">${esc(g.title.replace(/^\d+\.\s*/, ''))}</span>`).join('')}</div>
      </div>` : ''}
    </div>
    ${now}
    <div class="tabs" role="tablist">${tabs.map(([k, label, ok]) => `<button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${k === tab}" ${ok ? '' : 'disabled'}>${label}</button>`).join('')}</div>
    <div class="f-body">${body}</div>`;
  if (inDrawer) el.scrollTop = scroll; else if (!ui.boardMax) window.scrollTo(0, scroll);
}

// ------------------------------------------------------------ render: side
function renderMilestone(s) {
  const focusName = ((ui.pinned && s.changes.find((x) => x.name === ui.pinned)) || currentChange(s))?.name;
  const msOf = s.milestones.map((m) => ({ m, cs: s.changes.filter((c) => c.milestone === m.id) }));
  const focusMs = s.changes.find((c) => c.name === focusName)?.milestone;
  const byFocus = msOf.findIndex((x) => x.m.id === focusMs);
  const idx = byFocus >= 0 ? byFocus : Math.max(0, msOf.findIndex((x) => x.cs.some((c) => !isDone(c))));
  const { m, cs } = msOf[idx] ?? { m: { id: '—', title: 'No milestones' }, cs: [] };
  const done = cs.filter(isDone).length;
  const next = msOf[idx + 1];
  const td = s.totals;
  $('milestone').innerHTML = `
    <div class="label">Current milestone</div>
    <div class="ms-title"><span>${esc(m.id)}</span>${esc(m.title)}</div>
    <div class="muted num" style="font-size:12.5px;margin:2px 0 8px">${done} of ${cs.length} changes done</div>
    <div class="bar">${cs.map((c) => `<span style="flex:1;background:${stVar(c.status)};opacity:${isDone(c) ? 1 : c.tasks ? .35 + .65 * (c.tasks.done / Math.max(1, c.tasks.total)) : .15};border-right:2px solid var(--surface)"></span>`).join('')}</div>
    <ul class="ms-list">${cs.map((c) => `<li><button type="button" data-pick="${esc(c.name)}" ${c.name === focusName ? 'style="font-weight:600"' : ''}>
      <span class="sw" style="--st:${stVar(c.status)}"></span><span class="n">${esc(title(c.name))}</span>
      <span class="s num">${c.tasks ? `${c.tasks.done}/${c.tasks.total}` : STATUS[c.status].label.toLowerCase()}</span></button></li>`).join('')}</ul>
    <div class="ms-next">${next ? `Then <b>${esc(next.m.id)}</b> ${esc(next.m.title)} · ${next.cs.length} changes` : 'Last milestone'}<br>
      Overall <span class="num">${s.changes.filter(isDone).length}/${s.changes.filter((c) => c.status !== 'parking').length}</span> changes · <span class="num">${td.done}/${td.total}</span> tasks written so far</div>`;
}

function renderFeed(s) {
  const name = (n) => `<button type="button" class="ch" data-pick="${esc(n)}">${esc(title(n))}</button>`;
  const items = s.events.slice(0, 40).map((e) => {
    let what;
    if (e.kind === 'task-done') what = `<span style="color:var(--st-complete)">✓</span> <span class="mono">${esc(e.task)}</span> ${inline(e.text)} <span class="muted">· ${name(e.change)}</span>`;
    else if (e.kind === 'task-reopened') what = `<span style="color:var(--st-progress)">↺</span> <span class="mono">${esc(e.task)}</span> ${inline(e.text)} <span class="muted">· ${name(e.change)}</span>`;
    else if (e.kind === 'status') what = `${name(e.change)} → <b style="color:${stVar(e.to)}">${STATUS[e.to]?.label ?? e.to}</b>`;
    else if (e.kind === 'added') what = `${name(e.change)} added`;
    else what = `<span class="mono">${esc(e.change)}</span> removed`;
    return `<li><time title="${new Date(e.t).toLocaleString()}">${hhmm(e.t)}</time><span class="what">${what}</span></li>`;
  });
  $('feed').innerHTML = items.join('') || '<li><time></time><span class="what muted">Nothing yet. Checked-off tasks show up here as soon as they happen.</span></li>';
  const w = s.workspace;
  $('burn').innerHTML = burn(s) + (w?.recent?.length ? `<details class="files"><summary>${w.changedLast15m} files written in the last 15 min</summary><ul>${w.recent.slice(0, 10).map((f) => `<li><span class="p" title="${esc(f.path)}"><bdi>${esc(f.path)}</bdi></span><span>${ago(f.mtime)}</span></li>`).join('')}</ul></details>` : '');
}

function burn(s) {
  const pts = s.series;
  if (pts.length < 2) return '';
  const W = 300, H = 90, L = 4, R = 24, T = 8, B = 16;
  const t0 = pts[0].t, t1 = Math.max(Date.now(), pts.at(-1).t);
  const maxY = Math.max(1, ...pts.map((p) => p.total));
  const x = (t) => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - v / maxY) * (H - T - B);
  const step = (k) => pts.reduce((d, p, i) => d + (i ? `H${x(p.t)}V${y(p[k])}` : `M${x(p.t)},${y(p[k])}`), '') + `H${x(t1)}`;
  const last = pts.at(-1);
  return `<div class="label" style="margin-top:14px">Tasks checked over time</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${last.done} of ${last.total} tasks done">
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <path d="${step('total')}" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${step('done')}V${y(0)}H${x(t0)}Z" fill="var(--st-complete)" fill-opacity=".14"/>
    <path d="${step('done')}" fill="none" stroke="var(--st-complete)" stroke-width="2"/>
    <circle cx="${x(t1)}" cy="${y(last.done)}" r="3" fill="var(--st-complete)"/>
    <text x="${x(t1) + 5}" y="${y(last.done) + 3.5}" style="fill:var(--ink);font-weight:600">${last.done}</text>
    <text x="${L}" y="${H - 3}">${hhmm(t0)}</text><text x="${W - R}" y="${H - 3}" text-anchor="end">now</text>
  </svg>`;
}

// ------------------------------------------------------------ render: board
// Columns are derived from the files (see README "Status rules"); the board is read-only on purpose.
const COLS = [
  ['blocked',     'Blocked',     'Draft proposal, waits for prerequisites', '--st-blocked'],
  ['ready',       'Ready',       'Draft proposal, can start now',      '--st-proposed'],
  ['specified',   'Specified',   'Design, spec deltas and tasks written',  '--st-specified'],
  ['in-progress', 'In progress', 'Tasks being checked off',               '--st-progress'],
  ['complete',    'Tasks done',  'Waiting for openspec archive',          '--st-complete'],
  ['archived',    'Archived',    'Merged into openspec/specs',            '--st-archived'],
];
const columnOf = (c) => (c.status === 'proposed' || c.status === 'missing') ? (c.blockedBy.length ? 'blocked' : 'ready') : c.status;

function renderBoard(s) {
  const max = ui.boardMax;
  const cur = currentChange(s);
  const focusName = max && ui.drawer ? ui.drawer : ((ui.pinned && s.changes.find((x) => x.name === ui.pinned)) || cur)?.name;
  const msIds = s.milestones.map((m) => m.id);
  if (ui.ms && !msIds.includes(ui.ms)) ui.ms = '';
  const shown = s.changes.filter((c) => !ui.ms || c.milestone === ui.ms);
  const moved = new Set();
  for (const c of s.changes) {
    const col = columnOf(c);
    if (ui.prevCol.has(c.name) && ui.prevCol.get(c.name) !== col) moved.add(c.name);
    ui.prevCol.set(c.name, col);
  }
  const msBtn = (id, label, cs, name = '') => `<button type="button" data-ms="${esc(id)}" aria-pressed="${ui.ms === id}"${name ? ` title="${esc(id)} ${esc(name)}"` : ''}>${label} <span class="num">${cs.filter(isDone).length}/${cs.length}</span></button>`;
  const card = (c) => {
    const t = c.tasks;
    const flags = [];
    if (c.blockedBy.length && !isDone(c)) flags.push(`<div class="kc-flag ${columnOf(c) === 'blocked' ? 'muted' : ''}">waits for ${c.blockedBy.map((o) => '#' + o).join(', ')}</div>`);
    if (c.validation && !c.validation.valid && c.status !== 'proposed') flags.push('<div class="kc-flag">✕ validation fails</div>');
    return `<button type="button" class="kc ${c.name === focusName ? 'focus' : ''} ${moved.has(c.name) ? 'moved' : ''}" data-pick="${esc(c.name)}" title="${esc(c.goal)}">
      <div class="kc-top"><span class="o">${c.inRoadmap ? '#' + c.order : 'not in roadmap'}</span><span class="c">${esc(c.context)}</span><span class="m">${esc(c.milestone ?? '')}</span></div>
      <div class="kc-name">${esc(title(c.name))}</div>
      ${t && t.total && c.status !== 'archived' ? `<div class="kc-prog"><div class="bar"><span style="width:${pct(t.done, t.total)}%;background:var(--st-complete)"></span></div><span class="num">${t.done}/${t.total}</span></div>` : ''}
      ${flags.join('')}
    </button>`;
  };
  const ct = cur && currentTask(cur);
  const now = !max || !cur ? '' : `<div class="board-now ${cur.tasks && !ct ? 'done' : ''}">
      <span class="k">${cur.status === 'in-progress' ? 'Working on' : cur.status === 'complete' ? 'Ready to archive' : 'Up next'}</span>
      <button class="link" type="button" data-pick="${esc(cur.name)}">${esc(title(cur.name))}</button>
      ${cur.tasks ? `<span class="num muted">${cur.tasks.done}/${cur.tasks.total} tasks</span>` : ''}
      ${ct ? `<span>· now <span class="mono muted">${esc(ct.i.id)}</span> ${inline(ct.i.text)}</span>` : ''}
    </div>`;
  const board = $('board');
  board.classList.toggle('max', max);
  board.innerHTML = `
    <div class="board-head">
      <span class="label">Board</span>
      ${max ? `<span class="board-live">${$('conn').innerHTML}</span>` : ''}
      <span class="muted num" style="font-size:12.5px">${s.changes.filter(isDone).length} of ${s.changes.filter((c) => c.status !== 'parking').length} changes done · ${s.totals.done}/${s.totals.total} tasks</span>
      ${s.changes.filter((c) => c.status === 'parking').map((c) => `<button type="button" class="btn" data-pick="${esc(c.name)}" title="Parking lot: deferred items, never archived">Parking lot · ${c.tasks ? `${c.tasks.total - c.tasks.done} open` : esc(c.name)}</button>`).join('')}
      <span class="ms-filter">${msBtn('', '<b>All</b>', s.changes.filter((c) => c.status !== 'parking'))}${s.milestones.map((m) => msBtn(m.id, `<b>${esc(m.id)}</b><span class="ms-name">${esc(m.title)}</span>`, s.changes.filter((c) => c.milestone === m.id), m.title)).join('')}</span>
      ${AGENT_TOKEN ? '<button class="btn board-toggle" type="button" data-chat-btn aria-controls="agent">Chat</button>' : ''}
      <button class="btn board-toggle" type="button" data-max aria-pressed="${max}" title="${max ? 'Back to the dashboard (Esc)' : 'Show the board across the whole window'}">${max ? 'Exit full screen ✕' : '⤢ Full screen'}</button>
    </div>
    ${now}
    <div class="board-body">
    <div class="cols">${COLS.map(([key, title, desc, v]) => {
      const cs = shown.filter((c) => columnOf(c) === key).sort((a, b) => a.order - b.order);
      return `<section class="col" style="--st:var(${v})" aria-label="${title}">
        <div class="col-head"><div class="t">${title}<span class="num">${cs.length}</span></div><div class="d">${desc}</div></div>
        <div class="col-body" data-col="${key}">${cs.map(card).join('') || '<div class="col-empty">None</div>'}</div>
      </section>`;
    }).join('')}</div>
    ${max && ui.drawer ? '<aside class="drawer" id="drawer" aria-label="Change details"></aside>' : ''}
    </div>`;
  for (const el of board.querySelectorAll('.col-body[data-col]')) el.scrollTop = ui.colScroll.get(el.dataset.col) ?? 0;
  if (max && ui.drawer) renderFocus(s, $('drawer'), ui.drawer);
}

function renderHeader(s) {
  $('title').innerHTML = `${esc(s.project)} <span>· OpenSpec</span>`;
  document.title = `${s.project} · OpenSpec`;
  const cli = $('cli');
  if (!s.cli.available) { cli.textContent = 'CLI off'; cli.title = s.cli.error || 'started with --no-cli'; }
  else if (s.cli.error) { cli.innerHTML = '<span class="dot off"></span>openspec CLI error'; cli.title = s.cli.error; }
  else if (s.cli.lastRun) { cli.textContent = `openspec ${s.cli.version || ''} · validated ${ago(s.cli.lastRun)}`; cli.title = `${s.cli.command}, ${s.cli.durationMs} ms`; }
}

function render() {
  const s = ui.state;
  if (!s) return;
  renderHeader(s);
  renderFocus(s);
  renderMilestone(s);
  renderFeed(s);
  renderBoard(s);
}

// ------------------------------------------------------------ live data
function accept(next) {
  const prev = ui.state;
  if (prev) {
    const before = new Map(prev.changes.map((c) => [c.name, c]));
    for (const c of next.changes) for (const g of c.tasks?.groups ?? []) for (const i of g.items) {
      const old = before.get(c.name)?.tasks?.groups.flatMap((x) => x.items).find((x) => x.id === i.id);
      if (old && !old.done && i.done) ui.fresh.add(c.name + '|' + i.id);
    }
    setTimeout(() => ui.fresh.clear(), 3000);
  }
  ui.state = next;
  if (ui.pinned === null && location.hash.length > 1) ui.pinned = decodeURIComponent(location.hash.slice(1));
  render();
  if (ag.open && !$('ag-thread') && !$('ag-body')) buildAgent(); else renderAgentLive();
}
function connect() {
  const es = new EventSource(withProject('/events'));
  es.onopen = () => { $('conn').innerHTML = '<span class="dot on"></span>live'; };
  es.onmessage = (ev) => { const d = JSON.parse(ev.data); $('conn').innerHTML = `<span class="dot on"></span>live · ${hhmm(d.scannedAt)}`; accept(d); };
  es.onerror = () => { $('conn').innerHTML = '<span class="dot off"></span>disconnected, retrying…'; };
  es.addEventListener('agent', (ev) => { ag.view = JSON.parse(ev.data); renderAgentLive(); });
}

// ------------------------------------------------------------ interaction
function setMax(on) {
  ui.boardMax = on;
  if (!on) ui.drawer = null;
  document.body.classList.toggle('board-max', on);
  history.replaceState(null, '', on ? '#board' : ui.pinned ? '#' + encodeURIComponent(ui.pinned) : location.pathname + location.search);
  if (ui.state) render();
  if (!on) $('board').scrollIntoView({ block: 'start' });
}
function pick(name) {
  if (ui.boardMax) {
    ui.drawer = name || null;
    ui.drawerScroll = 0;
    history.replaceState(null, '', ui.drawer ? '#board:' + encodeURIComponent(ui.drawer) : '#board');
    return renderBoard(ui.state);
  }
  const auto = currentChange(ui.state)?.name;
  ui.pinned = name && name !== auto ? name : '';
  history.replaceState(null, '', ui.pinned ? '#' + encodeURIComponent(ui.pinned) : location.pathname + location.search);
  render();
  $('focus').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.addEventListener('click', (e) => {
  const ms = e.target.closest('[data-ms]');
  if (ms) { ui.ms = ms.dataset.ms; try { localStorage.setItem('osd-ms', ui.ms); } catch {} return renderBoard(ui.state); }
  if (e.target.closest('[data-max]')) return setMax(!ui.boardMax);
  if (e.target.closest('[data-close-drawer]')) { ui.drawer = null; history.replaceState(null, '', '#board'); return renderBoard(ui.state); }
  const p = e.target.closest('[data-pick]');
  if (p) return pick(p.dataset.pick);
  const tab = e.target.closest('[data-tab]');
  if (tab && !tab.disabled) { ui.tab = tab.dataset.tab; ui.drawerScroll = 0; render(); }
});
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (d.matches?.('details.group')) ui.open.set(d.dataset.key, d.open);
}, true);
$('style').addEventListener('change', (e) => {
  const st = applyStyle(e.target.value);
  try { localStorage.setItem('osd-style', st); } catch {}
});
$('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('osd-theme', root.dataset.theme); } catch {}
});
window.addEventListener('hashchange', () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'board' || h.startsWith('board:')) {
    if (!ui.boardMax) setMax(true);
    ui.drawer = h.startsWith('board:') ? h.slice(6) : null;
    history.replaceState(null, '', location.hash);
    return renderBoard(ui.state);
  }
  if (ui.boardMax) { ui.boardMax = false; ui.drawer = null; document.body.classList.remove('board-max'); }
  if (h !== ui.pinned) ui.pinned = h;
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ag.open) {
    if (ag.max) { ag.max = false; try { localStorage.setItem('osd-chat-max', '0'); } catch {} return buildAgent(); }
    return closeAgent();
  }
  if (e.key !== 'Escape' || !ui.boardMax) return;
  if (ui.drawer) { ui.drawer = null; history.replaceState(null, '', '#board'); renderBoard(ui.state); } else setMax(false);
});
// keep scroll positions of the drawer and the columns across live re-renders
document.addEventListener('scroll', (e) => {
  const t = e.target;
  if (t.id === 'drawer') ui.drawerScroll = t.scrollTop;
  else if (t.dataset?.col) ui.colScroll.set(t.dataset.col, t.scrollTop);
}, true);
// #board = full-screen board, #board:<change> = with that change's details open
if (location.hash === '#board' || location.hash.startsWith('#board:')) {
  ui.boardMax = true; ui.pinned = ''; document.body.classList.add('board-max');
  if (location.hash.startsWith('#board:')) ui.drawer = decodeURIComponent(location.hash.slice(7));
}
setInterval(() => ui.state && (renderHeader(ui.state), renderFeed(ui.state)), 30000);

// ------------------------------------------------------------ agent (server started with --agent)
// Two panels in one side sheet, both running the local Claude Code with its own login:
//   Chat (header / board): a messenger independent of tickets. "Assistant" is a read-only project assistant that
//     remembers the conversation; every session started here is a conversation too (its steps and replies, your
//     messages go straight to it); "Terminal session" sends messages to a session running elsewhere (via the hook).
//   Ticket (Agent… on a change): Ask about the ticket (its context is added automatically) or start a session on it.
const AGENT_TOKEN = document.querySelector('meta[name="osd-agent"]')?.content || '';
let chatMax = false;
try { chatMax = localStorage.getItem('osd-chat-max') === '1'; } catch {}
const ag = { max: chatMax, open: false, panel: 'chat', view: null, convo: 'assistant', target: null, mode: 'ask', note: '', force: null, busy: false, expanded: new Map(), drafts: {} };
const JOB_LABEL = { starting: 'starting', running: 'working', idle: 'waiting for you', done: 'ended', stopped: 'stopped', failed: 'failed' };
const JOB_ST = { starting: 'in-progress', running: 'in-progress', idle: 'specified', done: 'complete', stopped: 'proposed', failed: 'missing' };
const alive = (j) => ['starting', 'running', 'idle'].includes(j?.status);

async function agentPost(action, body) {
  const r = await fetch(withProject('/api/agent/' + action), {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-osd-token': AGENT_TOKEN }, body: JSON.stringify(body),
  });
  const d = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw Object.assign(new Error(d.error || `HTTP ${r.status}`), d);
  return d;
}
const recentExternal = () => (ag.view?.sessions ?? []).filter((x) => !x.ended && !x.dashboardJob && Date.now() - x.t < 15 * 60e3);
const groupBySession = (jobs) => {
  const m = new Map();
  for (const j of jobs) { const k = j.sessionId || j.id; if (!m.has(k)) m.set(k, []); m.get(k).push(j); }
  return [...m.entries()].map(([sid, js]) => ({ sid, jobs: js, last: js.at(-1) }));
};
function conversations() {
  const v = ag.view;
  if (!v) return [];
  const chats = groupBySession(v.jobs.filter((j) => j.kind === 'chat'));
  const cur = chats.at(-1);
  const list = [{ id: 'assistant', label: 'Assistant', jobs: cur?.jobs ?? [], last: cur?.last, live: ['running', 'starting'].includes(cur?.last?.status) }];
  for (const g of groupBySession(v.jobs.filter((j) => j.kind === 'session')).reverse().slice(0, 5)) {
    list.push({ id: 'session:' + g.sid, label: title(g.last.change), jobs: g.jobs, last: g.last, live: alive(g.last), session: true });
  }
  const ext = recentExternal();
  if (v.hooks || ext.length || v.messages.some((m) => m.state === 'queued')) list.push({ id: 'terminal', label: 'Terminal session', live: ext.some((x) => Date.now() - x.t < 3 * 60e3), terminal: true });
  return list;
}

function openChat(convo) {
  if (!AGENT_TOKEN) return;
  Object.assign(ag, { open: true, panel: 'chat', note: '' });
  if (convo) ag.convo = convo;
  $('agent').hidden = false;
  document.body.classList.add('ag-open');
  buildAgent();
  $('ag-text')?.focus();
}
function openTicket(change, mode, draft) {
  if (!AGENT_TOKEN) return;
  Object.assign(ag, { open: true, panel: 'ticket', note: '', force: null });
  if (change) ag.target = change;
  if (mode) ag.mode = mode;
  if (draft) ag.drafts['ticket-' + ag.mode] = draft;
  $('agent').hidden = false;
  document.body.classList.add('ag-open');
  buildAgent();
  const ta = $('ag-text');

  try {
    const res = await fetch(`/api/stt?lang=${encodeURIComponent(voice.lang)}`, { method: 'POST', headers: { 'content-type': 'audio/wav', 'x-osd-token': AGENT_TOKEN }, body: wav });
    const d = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    if (!res.ok) throw new Error(d.error || `HTTP ${res.status}`);
    const ta = $('ag-text');
    if (!d.text) voiceNote('No speech recognized.', true);
    else if (ta) {
      const at = ta.selectionStart ?? ta.value.length, end = ta.selectionEnd ?? at;
      const before = ta.value.slice(0, at), after = ta.value.slice(end);
      const ins = (before && !/\s$/.test(before) ? ' ' : '') + d.text + (after && !/^\s/.test(after) ? ' ' : '');
      ta.value = before + ins + after;
      ta.dispatchEvent(new Event('input', { bubbles: true })); // keeps the draft
      ta.focus();
      ta.setSelectionRange(before.length + ins.length, before.length + ins.length);
      voiceNote(`Transcribed locally in ${(d.ms / 1000).toFixed(1)} s. Check the text, then send it.`);
    }
  } catch (e) {
    voiceNote('✕ ' + e.message, true);
  } finally {
    voice.state = 'idle';
    refreshMic();
  }
}
// mono float samples at the recording rate -> 16 kHz mono 16-bit PCM WAV (what whisper.cpp reads)
function toWav16k(chunks, rate) {
  const len = chunks.reduce((a, c) => a + c.length, 0);
  const data = new Float32Array(len);
  let o = 0;
  for (const c of chunks) { data.set(c, o); o += c.length; }
  const ratio = rate / 16000;
  const n = Math.floor(len / ratio);
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true);
  v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.min(len, Math.floor((i + 1) * ratio)));
    let s = 0;
    for (let k = a; k < b; k++) s += data[k];
    const x = Math.max(-1, Math.min(1, s / (b - a))); // averaging also filters what 16 kHz cannot hold
    v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return buf;
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('[data-ag-mic]')) return;
  if (voice.state === 'recording') stopRecording();
  else if (voice.state === 'idle') startRecording();
});
document.addEventListener('change', (e) => {
  if (!e.target.matches?.('[data-ag-lang]')) return;
  voice.lang = e.target.value;
  try { localStorage.setItem('osd-stt-lang', voice.lang); } catch {}
  refreshMic();
});

// ------------------------------------------------------------ several projects
// ?project=<id> shows one project; with several projects and no ?project= the overview is the start page.
const PARAMS = new URLSearchParams(location.search);
const SNAPSHOT = PARAMS.has('snapshot');
let PROJECT = PARAMS.get('project');
function withProject(u) { return PROJECT ? `${u}${u.includes('?') ? '&' : '?'}project=${encodeURIComponent(PROJECT)}` : u; }
function hrefFor(id) {
  const u = new URL(location.href);
  if (id) u.searchParams.set('project', id); else u.searchParams.delete('project');
  u.hash = '';
  return u.pathname + u.search;
}

const CUR_LABEL = { 'in-progress': 'Working on', complete: 'Ready to archive', specified: 'Up next · planned', proposed: 'Up next' };
function renderOverview(o) {
  const prev = new Map((ui.overview?.projects ?? []).map((p) => [p.id, p.lastEvent?.t ?? 0]));
  ui.overview = o;
  const list = [...o.projects].sort((a, b) => (b.lastActivity ?? 0) - (a.lastActivity ?? 0));
  const working = list.filter((p) => p.current?.status === 'in-progress').length;
  $('title').innerHTML = `OpenSpec <span>· ${list.length} projects</span>`;
  document.title = `OpenSpec · ${list.length} projects`;
  $('cli').textContent = '';
  const order = ['archived', 'complete', 'in-progress', 'specified', 'proposed', 'missing'];
  const card = (p) => {
    if (p.loading) return `<a class="panel ov-card" href="${esc(hrefFor(p.id))}"><div class="ov-top"><span class="ov-name">${esc(p.name)}</span></div><div class="ov-empty">Reading openspec/…</div></a>`;
    const c = p.current;
    const fresh = prev.has(p.id) && (p.lastEvent?.t ?? 0) > prev.get(p.id);
    const n = Object.entries(p.counts).filter(([k]) => k !== 'parking').reduce((a, [, v]) => a + v, 0) || 1;
    const cur = c ? `<div class="ov-cur">
        <span class="k" style="color:${stVar(c.status)}">${CUR_LABEL[c.status] ?? 'Current'}</span>
        <span class="n">${esc(title(c.name))}</span>
        ${c.tasks && c.tasks.total ? `<div class="prog"><div class="bar"><span style="width:${pct(c.tasks.done, c.tasks.total)}%;background:var(--st-complete)"></span></div><span class="num">${c.tasks.done}/${c.tasks.total}</span></div>` : ''}
        ${c.task ? `<div class="ov-now"><span class="tid">${esc(c.task.id)}</span>${inline(c.task.text)}</div>` : c.blockedBy?.length ? `<div class="ov-now">waits for ${c.blockedBy.map((x) => '#' + x).join(', ')}</div>` : ''}
      </div>` : '<div class="ov-empty">No change to work on.</div>';
    return `<a class="panel ov-card ${fresh ? 'fresh' : ''}" href="${esc(hrefFor(p.id))}" title="Open ${esc(p.name)}">
      <div class="ov-top"><span class="ov-name">${esc(p.name)}</span>${c ? `<span class="pill" style="--st:${stVar(c.status)}">${STATUS[c.status]?.label ?? c.status}</span>` : ''}</div>
      <div class="ov-path">${esc(p.displayPath ?? p.name)}</div>
      ${cur}
      <div class="ov-stack" title="${order.filter((k) => p.counts[k]).map((k) => `${STATUS[k].label}: ${p.counts[k]}`).join(' · ')}">${order.filter((k) => p.counts[k]).map((k) => `<span style="width:${(p.counts[k] / n) * 100}%;background:${stVar(k)}"></span>`).join('')}</div>
      <div class="ov-row"><span class="num">${p.done}/${p.changes} changes done</span><span class="num">${p.totals.done}/${p.totals.total} tasks</span>${p.milestone ? `<span>${esc(p.milestone.id)} ${esc(p.milestone.title)} · <span class="num">${p.milestone.done}/${p.milestone.total}</span></span>` : ''}</div>
      <div class="ov-row"><span>last activity ${ago(p.lastActivity)}</span>${p.filesLast15m ? `<span class="num">${p.filesLast15m} files written in 15 min</span>` : ''}${p.invalid ? `<span class="warn">✕ ${p.invalid} failing validation</span>` : ''}${p.agent?.session ? `<span><span class="dot on"></span>session on ${esc(title(p.agent.session))}</span>` : p.agent?.external ? '<span><span class="dot on"></span>Claude Code active</span>' : ''}${p.agent?.queued ? `<span>${p.agent.queued} message${p.agent.queued > 1 ? 's' : ''} queued</span>` : ''}${p.cli?.error ? '<span class="warn">CLI error</span>' : ''}</div>
    </a>`;
  };
  $('overview').innerHTML = `
    <div class="ov-head"><span class="label">Projects</span><span class="muted">${list.length} followed · ${working} with a change in progress</span></div>
    <div class="ov-grid">${list.map(card).join('')}</div>`;
}

function startProject() {
  if (AGENT_TOKEN && PARAMS.get('panel')?.startsWith('ticket:')) { // ?panel=ticket:<change> opens a ticket's panel
    Object.assign(ag, { open: true, panel: 'ticket', target: PARAMS.get('panel').slice(7), max: ag.max || PARAMS.has('max') }); $('agent').hidden = false; document.body.classList.add('ag-open');
  }
  if (AGENT_TOKEN && PARAMS.get('panel') === 'chat') { ag.open = true; ag.panel = 'chat'; ag.stick = true; ag.max = ag.max || PARAMS.has('max'); $('agent').hidden = false; document.body.classList.add('ag-open'); } // ?panel=chat opens the chat, &max maximized
  if (SNAPSHOT && AGENT_TOKEN) fetch(withProject('/api/agent')).then((r) => r.json()).then((v) => { ag.view = v; renderAgentLive(); });
  if (SNAPSHOT) fetch(withProject('/api/state')).then((r) => r.json()).then((d) => { $('conn').innerHTML = `<span class="dot"></span>snapshot ${hhmm(d.scannedAt)}`; accept(d); });
  else connect();
}
function startOverview() {
  document.querySelector('.main').hidden = true;
  $('board').hidden = true;
  $('overview').hidden = false;
  if (SNAPSHOT) {
    fetch('/api/projects').then((r) => r.json()).then((d) => { $('conn').innerHTML = `<span class="dot"></span>snapshot ${hhmm(d.scannedAt)}`; renderOverview(d); });
    return;
  }
  const es = new EventSource('/events?overview=1');
  es.onopen = () => { $('conn').innerHTML = '<span class="dot on"></span>live'; };
  es.onmessage = (ev) => { const d = JSON.parse(ev.data); $('conn').innerHTML = `<span class="dot on"></span>live · ${hhmm(d.scannedAt)}`; renderOverview(d); };
  es.onerror = () => { $('conn').innerHTML = '<span class="dot off"></span>disconnected, retrying…'; };
  setInterval(() => ui.overview && renderOverview(ui.overview), 30000);
}
(async () => {
  let list = [];
  try { list = (await (await fetch('/api/projects')).json()).projects ?? []; } catch { /* older server: one project */ }
  if (list.length > 1) {
    if (PROJECT && !list.some((p) => p.id === PROJECT)) PROJECT = null;
    const sel = $('project');
    sel.innerHTML = `<option value="">All projects (${list.length})</option>` + list.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
    sel.value = PROJECT ?? '';
    sel.hidden = false;
    sel.addEventListener('change', () => { location.href = hrefFor(sel.value); });
    if (!PROJECT) return startOverview();
  }
  startProject();
})();
</script>
